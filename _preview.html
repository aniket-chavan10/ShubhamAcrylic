<script type="text/plain" data-path="src/pages/CustomizePage.tsx">
import { ChangeEvent, useCallback, useEffect, useMemo, useRef, useState } from 'react';
import { Link, useNavigate, useParams } from 'react-router-dom';
import {
  AlertTriangle, Check, Crosshair, ImagePlus, Info, Loader2, MessageCircle, Minus, Move, Plus, RefreshCw, Trash2, Type,
} from 'lucide-react';
import DesignCanvas from '../customizer/DesignCanvas';
import CheckoutModal, { CustomerDetails } from '../customizer/CheckoutModal';
import OrderSuccess from '../customizer/OrderSuccess';
import {
  composeView, DEFAULT_TRANSFORM, fitScale, newId, prepareImageArtwork, renderTextArtwork, TEXT_COLORS, TEXT_FONTS,
} from '../customizer/artwork';
import { loadImage } from '../customizer/mockups';
import { errorMessage, getGarments } from '../services/api';
import { useSiteSettings } from '../context/SiteSettingsContext';
import type { Garment, PlacedOrder, Placement, PrintDesign, PrintTransform, View } from '../types';
import { inr, waLink } from '../utils/format';

const MAX_QTY = 500;

interface TextDraft {
  text: string;
  font: string;
  color: string;
}

const extFor = (type: string) => (type === 'image/jpeg' ? 'jpg' : type === 'image/webp' ? 'webp' : 'png');

export default function CustomizePage() {
  const { garmentKey } = useParams<{ garmentKey?: string }>();
  const navigate = useNavigate();
  const { settings } = useSiteSettings();
  const brand = settings?.companyName || 'Astitva Creations';

  const [garments, setGarments] = useState<Garment[]>([]);
  const [loadError, setLoadError] = useState('');
  const [loading, setLoading] = useState(true);

  const [colorHex, setColorHex] = useState('');
  const [size, setSize] = useState('');
  const [quantity, setQuantity] = useState(1);
  const [view, setView] = useState<View>('front');
  const [designs, setDesigns] = useState<Record<string, PrintDesign>>({});
  const [activeKey, setActiveKey] = useState<string | null>(null);
  const [textDraft, setTextDraft] = useState<TextDraft>({ text: '', font: TEXT_FONTS[0].id, color: '#ffffff' });
  const [textEditorFor, setTextEditorFor] = useState<string | null>(null);
  const [notice, setNotice] = useState<{ type: 'error' | 'info'; text: string } | null>(null);
  const [busyKey, setBusyKey] = useState<string | null>(null);
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [placedOrder, setPlacedOrder] = useState<PlacedOrder | null>(null);

  const fileInputRef = useRef<HTMLInputElement>(null);
  const uploadTargetRef = useRef<string | null>(null);

  useEffect(() => {
    getGarments()
      .then(setGarments)
      .catch(err => setLoadError(errorMessage(err, 'Could not load the design studio.')))
      .finally(() => setLoading(false));
  }, []);

  const garment = useMemo(
    () => garments.find(g => g.key === garmentKey) ?? garments[0],
    [garments, garmentKey],
  );
  const placements = useMemo(() => garment?.placements.filter(p => p.enabled) ?? [], [garment]);

  // Keep colour / size / prints valid when the garment changes
  useEffect(() => {
    if (!garment) return;
    setColorHex(c => (garment.colors.some(x => x.hex === c) ? c : garment.colors[0]?.hex ?? '#ffffff'));
    setSize(s => (garment.sizes.some(x => x.label === s) ? s
      : garment.sizes.find(x => x.label === 'M')?.label ?? garment.sizes[0]?.label ?? ''));
    setDesigns(d => {
      const keys = new Set(garment.placements.filter(p => p.enabled).map(p => p.key));
      return Object.fromEntries(Object.entries(d).filter(([k]) => keys.has(k)));
    });
    setActiveKey(k => (k && garment.placements.some(p => p.key === k && p.enabled) ? k : null));
  }, [garment]);

  // Default text colour contrasts with the garment
  useEffect(() => {
    if (!colorHex) return;
    const dark = parseInt(colorHex.slice(1, 3), 16) * 0.299 + parseInt(colorHex.slice(3, 5), 16) * 0.587 + parseInt(colorHex.slice(5, 7), 16) * 0.114 < 140;
    setTextDraft(t => (t.text ? t : { ...t, color: dark ? '#ffffff' : '#141414' }));
  }, [colorHex]);

  // ── Pricing ─────────────────────────────────────────────────────────────
  const pricing = useMemo(() => {
    if (!garment) return { base: 0, prints: [] as Placement[], printsTotal: 0, sizeExtra: 0, unit: 0, total: 0 };
    const base = Number(garment.basePrice) || 0;
    const prints = placements.filter(p => designs[p.key]);
    const printsTotal = prints.reduce((s, p) => s + (Number(p.price) || 0), 0);
    const sizeExtra = Number(garment.sizes.find(s => s.label === size)?.extra) || 0;
    const unit = base + printsTotal + sizeExtra;
    return { base, prints, printsTotal, sizeExtra, unit, total: unit * quantity };
  }, [garment, placements, designs, size, quantity]);

  const colorName = garment?.colors.find(c => c.hex === colorHex)?.name ?? '';

  // ── Print actions ───────────────────────────────────────────────────────
  const focusPlacement = (p: Placement) => {
    setActiveKey(p.key);
    setView(p.view);
  };

  const setDesign = (key: string, design: PrintDesign | null) =>
    setDesigns(d => {
      const next = { ...d };
      if (design) next[key] = design; else delete next[key];
      return next;
    });

  const openUpload = (p: Placement) => {
    focusPlacement(p);
    uploadTargetRef.current = p.key;
    fileInputRef.current?.click();
  };

  const onFileChosen = async (e: ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    const key = uploadTargetRef.current;
    const placement = placements.find(p => p.key === key);
    if (!file || !placement) return;
    setBusyKey(placement.key);
    setNotice(null);
    try {
      const { src, lowRes } = await prepareImageArtwork(file);
      const img = await loadImage(src, false);
      setDesign(placement.key, {
        id: newId(),
        kind: 'image',
        src,
        file,
        fileName: `${placement.key}.${extFor(file.type)}`,
        transform: { ...DEFAULT_TRANSFORM, scale: fitScale(img.width, img.height, placement) },
      });
      setTextEditorFor(null);
      if (lowRes) setNotice({ type: 'info', text: 'Heads up: this image is quite small and may look blurry when printed. A larger PNG works best.' });
    } catch (err) {
      setNotice({ type: 'error', text: err instanceof Error ? err.message : 'Could not use that image.' });
    } finally {
      setBusyKey(null);
    }
  };

  const openTextEditor = (p: Placement) => {
    focusPlacement(p);
    const existing = designs[p.key];
    if (existing?.kind === 'text') {
      setTextDraft({ text: existing.text ?? '', font: existing.font ?? TEXT_FONTS[0].id, color: existing.color ?? '#ffffff' });
    } else {
      setTextDraft(t => ({ ...t, text: '' }));
    }
    setTextEditorFor(p.key);
  };

  const applyText = async (p: Placement) => {
    const text = textDraft.text.trim();
    if (!text) { setNotice({ type: 'error', text: 'Type some text first.' }); return; }
    setBusyKey(p.key);
    setNotice(null);
    try {
      const { src, blob } = await renderTextArtwork(text, textDraft.font, textDraft.color);
      const img = await loadImage(src, false);
      const prev = designs[p.key];
      setDesign(p.key, {
        id: newId(),
        kind: 'text',
        src,
        file: blob,
        fileName: `${p.key}-text.png`,
        text,
        font: textDraft.font,
        color: textDraft.color,
        transform: prev?.kind === 'text'
          ? { ...prev.transform, scale: fitScale(img.width, img.height, p) }
          : { ...DEFAULT_TRANSFORM, scale: fitScale(img.width, img.height, p) },
      });
      setTextEditorFor(null);
    } finally {
      setBusyKey(null);
    }
  };

  const recenter = (p: Placement) => {
    const d = designs[p.key];
    if (!d) return;
    loadImage(d.src, false).then(img => {
      setDesign(p.key, { ...d, id: newId(), transform: { ...DEFAULT_TRANSFORM, scale: fitScale(img.width, img.height, p) } });
    });
  };

  const onTransform = useCallback((key: string, t: PrintTransform) => {
    setDesigns(d => (d[key] ? { ...d, [key]: { ...d[key], transform: t } } : d));
  }, []);

  const onCanvasSelect = useCallback((key: string) => setActiveKey(key), []);

  // ── Checkout ────────────────────────────────────────────────────────────
  const buildOrderForm = async (customer: CustomerDetails) => {
    if (!garment) throw new Error('No product selected');
    const form = new FormData();
    const prints = pricing.prints.map(p => {
      const d = designs[p.key];
      return { key: p.key, kind: d.kind, text: d.text, font: d.font, color: d.color, transform: d.transform };
    });
    form.append('data', JSON.stringify({ ...customer, garmentId: garment.id, colorHex, size, quantity, prints }));
    pricing.prints.forEach(p => {
      const d = designs[p.key];
      form.append(`artwork_${p.key}`, d.file, d.fileName);
    });
    const views: View[] = ['front', ...(pricing.prints.some(p => p.view === 'back') ? ['back' as View] : [])];
    for (const v of views) {
      const blob = await composeView(garment, v, colorHex, designs);
      form.append(`preview_${v}`, blob, `preview-${v}.jpg`);
    }
    return form;
  };

  const startCheckout = () => {
    if (pricing.prints.length === 0) {
      setNotice({ type: 'error', text: 'Add at least one print (image or text) before ordering.' });
      return;
    }
    if (!size) {
      setNotice({ type: 'error', text: 'Please choose a size.' });
      return;
    }
    setCheckoutOpen(true);
  };

  const resetDesign = () => {
    setPlacedOrder(null);
    setDesigns({});
    setActiveKey(null);
    setQuantity(1);
    window.scrollTo({ top: 0 });
  };

  const whatsappQuestion = garment && settings?.whatsappNumber
    ? waLink(settings.whatsappNumber, `Hi ${brand}! I'm designing a custom ${garment.name} (${colorName}, size ${size || '-'}) on your website and have a question.`)
    : '';

  // ── Render ──────────────────────────────────────────────────────────────
  if (placedOrder) {
    return <OrderSuccess order={placedOrder} brand={brand} whatsappNumber={settings?.whatsappNumber} onDesignAnother={resetDesign} />;
  }

  if (loading) {
    return (
      <div className="grid min-h-[70vh] place-items-center">
        <Loader2 className="h-8 w-8 animate-spin text-accent" />
      </div>
    );
  }

  if (loadError || !garment) {
    return (
      <div className="container-x grid min-h-[60vh] place-items-center text-center">
        <div>
          <h1 className="font-display text-2xl font-bold">Design studio unavailable</h1>
          <p className="mt-2 text-muted">{loadError || 'No customisable products are available right now.'}</p>
          <Link to="/" className="btn-primary mt-6">Back to home</Link>
        </div>
      </div>
    );
  }

  return (
    <div className="pb-28 lg:pb-16">
      <input ref={fileInputRef} type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={onFileChosen} />

      {/* Heading */}
      <section className="border-b border-line bg-white">
        <div className="container-x flex flex-col gap-5 py-6 sm:py-8 lg:flex-row lg:items-end lg:justify-between">
          <div>
            <p className="eyebrow"><span className="h-1.5 w-1.5 rounded-full bg-accent" /> Design studio</p>
            <h1 className="mt-2 font-display text-3xl font-bold tracking-tight sm:text-4xl">Make it yours.</h1>
            <p className="mt-1 text-sm text-muted">Pick a garment, add your artwork or text, and see the price update live.</p>
          </div>
          <div className="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 sm:mx-0 sm:px-0">
            {garments.map(g => (
              <button
                key={g.key}
                onClick={() => navigate(`/customize/${g.key}`, { replace: true })}
                className={`shrink-0 rounded-full border px-5 py-2.5 text-sm font-semibold transition ${g.key === garment.key ? 'border-ink bg-ink text-white' : 'border-line bg-white hover:border-ink'}`}
              >
                {g.name}
                <span className={`ml-2 text-xs font-medium ${g.key === garment.key ? 'text-white/60' : 'text-muted'}`}>from {inr(g.basePrice)}</span>
              </button>
            ))}
          </div>
        </div>
      </section>

      <div className="container-x mt-6 grid grid-cols-1 gap-6 lg:grid-cols-12 lg:gap-10">
        {/* ── Canvas ─────────────────────────────────────────────────── */}
        <div className="min-w-0 lg:col-span-7">
          <div className="lg:sticky lg:top-24">
            <div className="card relative overflow-hidden bg-[radial-gradient(circle_at_50%_35%,#ffffff_0%,#efece5_75%)] p-3 sm:p-6">
              <div className="absolute left-4 top-4 z-10 flex rounded-full bg-white p-1 shadow-sm ring-1 ring-line">
                {(['front', 'back'] as View[]).map(v => (
                  <button
                    key={v}
                    onClick={() => setView(v)}
                    className={`rounded-full px-4 py-1.5 text-xs font-semibold capitalize transition ${view === v ? 'bg-ink text-white' : 'text-muted hover:text-ink'}`}
                  >
                    {v}
                  </button>
                ))}
              </div>
              <div className="absolute right-4 top-4 z-10 rounded-full bg-white/90 px-3 py-1.5 text-xs font-medium text-muted shadow-sm ring-1 ring-line">
                {colorName}
              </div>
              <div className="mx-auto max-w-[560px] pt-8 sm:pt-4">
                <DesignCanvas
                  garment={garment}
                  view={view}
                  colorHex={colorHex}
                  designs={designs}
                  activeKey={activeKey}
                  onSelect={onCanvasSelect}
                  onTransform={onTransform}
                />
              </div>
            </div>
            <p className="mt-3 flex items-center justify-center gap-2 text-center text-xs text-muted">
              <Move className="h-3.5 w-3.5" /> Drag to move · pull a corner to resize or rotate · dashed boxes are the print areas
            </p>
          </div>
        </div>

        {/* ── Options ────────────────────────────────────────────────── */}
        <div className="min-w-0 space-y-5 lg:col-span-5">
          <div className="card p-5 sm:p-6">
            <h2 className="font-display text-xl font-bold">{garment.name}</h2>
            {garment.tagline && <p className="mt-0.5 text-sm text-muted">{garment.tagline}</p>}
            {garment.fabric && <p className="mt-3 inline-flex rounded-full bg-paper px-3 py-1 text-xs font-medium">{garment.fabric}</p>}
          </div>

          {/* Colour */}
          <div className="card p-5 sm:p-6">
            <div className="flex items-baseline justify-between">
              <h3 className="text-sm font-semibold">1. Base colour</h3>
              <span className="text-xs text-muted">{colorName}</span>
            </div>
            <div className="mt-4 flex flex-wrap gap-3">
              {garment.colors.map(c => (
                <button
                  key={c.hex}
                  title={c.name}
                  aria-label={c.name}
                  onClick={() => setColorHex(c.hex)}
                  className={`relative h-10 w-10 rounded-full ring-1 ring-black/10 transition hover:scale-110 ${c.hex === colorHex ? 'ring-2 ring-ink ring-offset-2' : ''}`}
                  style={{ backgroundColor: c.hex }}
                >
                  {c.hex === colorHex && (
                    <Check className={`absolute inset-0 m-auto h-4 w-4 ${parseInt(c.hex.slice(1, 3), 16) > 160 ? 'text-ink' : 'text-white'}`} />
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* Prints */}
          <div className="card p-5 sm:p-6">
            <h3 className="text-sm font-semibold">2. Add your prints</h3>
            <p className="mt-1 text-xs text-muted">Choose where you want a print. Each placement is priced separately.</p>
            <div className="mt-4 space-y-3">
              {placements.map(p => {
                const d = designs[p.key];
                const active = activeKey === p.key;
                const editingText = textEditorFor === p.key;
                return (
                  <div
                    key={p.key}
                    className={`rounded-2xl border p-4 transition ${active ? 'border-ink bg-paper/60' : 'border-line hover:border-ink/40'}`}
                  >
                    <button className="flex w-full items-center gap-3 text-left" onClick={() => focusPlacement(p)}>
                      <div className="grid h-12 w-12 shrink-0 place-items-center overflow-hidden rounded-xl bg-paper ring-1 ring-line"
                        style={d ? { backgroundColor: colorHex } : undefined}>
                        {d ? <img src={d.src} alt="" className="max-h-10 max-w-10 object-contain" />
                          : <Crosshair className="h-5 w-5 text-muted" />}
                      </div>
                      <div className="min-w-0 flex-1">
                        <p className="truncate text-sm font-semibold">{p.label}</p>
                        <p className="text-xs capitalize text-muted">{p.view} · {d ? (d.kind === 'text' ? `“${d.text}”` : 'Image added') : 'Not added'}</p>
                      </div>
                      <span className={`shrink-0 rounded-full px-2.5 py-1 text-xs font-semibold ${d ? 'bg-ink text-white' : 'bg-paper text-ink'}`}>
                        +{inr(p.price)}
                      </span>
                    </button>

                    <div className="mt-3 flex flex-wrap gap-2">
                      <button onClick={() => openUpload(p)} disabled={busyKey === p.key} className="inline-flex items-center gap-1.5 rounded-full border border-line bg-white px-3.5 py-2 text-xs font-semibold hover:border-ink">
                        {busyKey === p.key ? <Loader2 className="h-3.5 w-3.5 animate-spin" /> : <ImagePlus className="h-3.5 w-3.5" />}
                        {d?.kind === 'image' ? 'Replace image' : 'Upload image'}
                      </button>
                      <button onClick={() => openTextEditor(p)} className="inline-flex items-center gap-1.5 rounded-full border border-line bg-white px-3.5 py-2 text-xs font-semibold hover:border-ink">
                        <Type className="h-3.5 w-3.5" /> {d?.kind === 'text' ? 'Edit text' : 'Add text'}
                      </button>
                      {d && (
                        <>
                          <button onClick={() => recenter(p)} className="inline-flex items-center gap-1.5 rounded-full px-3 py-2 text-xs font-semibold text-muted hover:text-ink" title="Re-centre">
                            <RefreshCw className="h-3.5 w-3.5" /> Reset
                          </button>
                          <button onClick={() => setDesign(p.key, null)} className="inline-flex items-center gap-1.5 rounded-full px-3 py-2 text-xs font-semibold text-red-600 hover:bg-red-50" title="Remove print">
                            <Trash2 className="h-3.5 w-3.5" /> Remove
                          </button>
                        </>
                      )}
                    </div>

                    {editingText && (
                      <div className="mt-4 space-y-3 rounded-xl bg-white p-4 ring-1 ring-line">
                        <textarea
                          autoFocus
                          rows={2}
                          maxLength={120}
                          value={textDraft.text}
                          onChange={(e) => setTextDraft(t => ({ ...t, text: e.target.value }))}
                          placeholder="Your text (Enter for a new line)"
                          className="field resize-none"
                        />
                        <div className="no-scrollbar flex gap-2 overflow-x-auto">
                          {TEXT_FONTS.map(f => (
                            <button
                              key={f.id}
                              onClick={() => setTextDraft(t => ({ ...t, font: f.id }))}
                              className={`shrink-0 rounded-lg border px-3 py-1.5 text-sm ${textDraft.font === f.id ? 'border-ink bg-ink text-white' : 'border-line'}`}
                              style={{ fontFamily: f.family, fontWeight: f.weight, fontStyle: f.style ?? 'normal' }}
                            >
                              {f.label}
                            </button>
                          ))}
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                          {TEXT_COLORS.map(c => (
                            <button
                              key={c}
                              aria-label={`Text colour ${c}`}
                              onClick={() => setTextDraft(t => ({ ...t, color: c }))}
                              className={`h-7 w-7 rounded-full ring-1 ring-black/15 ${textDraft.color === c ? 'ring-2 ring-ink ring-offset-2' : ''}`}
                              style={{ backgroundColor: c }}
                            />
                          ))}
                          <label className="relative h-7 w-7 cursor-pointer overflow-hidden rounded-full bg-[conic-gradient(red,yellow,lime,cyan,blue,magenta,red)] ring-1 ring-black/15" title="Custom colour">
                            <input type="color" value={textDraft.color} onChange={(e) => setTextDraft(t => ({ ...t, color: e.target.value }))} className="absolute inset-0 cursor-pointer opacity-0" />
                          </label>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => applyText(p)} disabled={busyKey === p.key} className="btn-primary px-5 py-2">
                            {busyKey === p.key && <Loader2 className="h-3.5 w-3.5 animate-spin" />} Apply text
                          </button>
                          <button onClick={() => setTextEditorFor(null)} className="btn px-4 py-2 text-muted hover:text-ink">Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {notice && (
              <p className={`mt-4 flex items-start gap-2 rounded-xl px-4 py-3 text-sm ${notice.type === 'error' ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800'}`}>
                {notice.type === 'error' ? <AlertTriangle className="mt-0.5 h-4 w-4 shrink-0" /> : <Info className="mt-0.5 h-4 w-4 shrink-0" />}
                {notice.text}
              </p>
            )}
          </div>

          {/* Size & quantity */}
          <div className="card p-5 sm:p-6">
            <h3 className="text-sm font-semibold">3. Size &amp; quantity</h3>
            <div className="mt-4 flex flex-wrap gap-2">
              {garment.sizes.map(s => (
                <button
                  key={s.label}
                  onClick={() => setSize(s.label)}
                  className={`min-w-14 rounded-xl border px-3 py-2.5 text-sm font-semibold transition ${size === s.label ? 'border-ink bg-ink text-white' : 'border-line bg-white hover:border-ink'}`}
                >
                  {s.label}
                  {Number(s.extra) > 0 && <span className={`block text-[10px] font-medium ${size === s.label ? 'text-white/60' : 'text-muted'}`}>+{inr(s.extra)}</span>}
                </button>
              ))}
            </div>
            <div className="mt-5 flex items-center justify-between">
              <span className="text-sm text-muted">Quantity</span>
              <div className="flex items-center rounded-full border border-line bg-white">
                <button onClick={() => setQuantity(q => Math.max(1, q - 1))} className="grid h-10 w-10 place-items-center rounded-full hover:bg-paper" aria-label="Decrease quantity"><Minus className="h-4 w-4" /></button>
                <input
                  value={quantity}
                  onChange={(e) => setQuantity(Math.min(MAX_QTY, Math.max(1, parseInt(e.target.value.replace(/\D/g, '')) || 1)))}
                  inputMode="numeric"
                  className="w-12 bg-transparent text-center text-sm font-semibold outline-none"
                  aria-label="Quantity"
                />
                <button onClick={() => setQuantity(q => Math.min(MAX_QTY, q + 1))} className="grid h-10 w-10 place-items-center rounded-full hover:bg-paper" aria-label="Increase quantity"><Plus className="h-4 w-4" /></button>
              </div>
            </div>
          </div>

          {/* Price */}
          <div className="card overflow-hidden">
            <div className="space-y-2.5 p-5 text-sm sm:p-6">
              <div className="flex justify-between"><span className="text-muted">{garment.name} ({colorName})</span><span>{inr(pricing.base)}</span></div>
              {pricing.prints.map(p => (
                <div key={p.key} className="flex justify-between"><span className="text-muted">{p.label}</span><span>+{inr(p.price)}</span></div>
              ))}
              {pricing.sizeExtra > 0 && <div className="flex justify-between"><span className="text-muted">Size {size}</span><span>+{inr(pricing.sizeExtra)}</span></div>}
              <div className="flex justify-between border-t border-dashed border-line pt-2.5 font-medium"><span>Per piece</span><span>{inr(pricing.unit)}</span></div>
              {quantity > 1 && <div className="flex justify-between text-muted"><span>× {quantity} pieces</span><span /></div>}
            </div>
            <div className="flex items-center justify-between bg-ink px-5 py-5 text-white sm:px-6">
              <div>
                <p className="text-xs uppercase tracking-wider text-white/50">Total</p>
                <p className="font-display text-3xl font-bold">{inr(pricing.total)}</p>
              </div>
              <button onClick={startCheckout} className="btn-accent hidden px-7 py-3.5 lg:inline-flex">Place order</button>
            </div>
          </div>

          {whatsappQuestion && (
            <a href={whatsappQuestion} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 text-sm font-semibold text-muted hover:text-ink">
              <MessageCircle className="h-4 w-4" /> Questions? Chat with us on WhatsApp
            </a>
          )}
        </div>
      </div>

      {/* Mobile sticky checkout bar */}
      <div className="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-white/95 px-4 py-3 backdrop-blur lg:hidden">
        <div className="flex items-center justify-between gap-4">
          <div>
            <p className="text-[11px] uppercase tracking-wider text-muted">{quantity} × {inr(pricing.unit)}</p>
            <p className="font-display text-xl font-bold">{inr(pricing.total)}</p>
          </div>
          <button onClick={startCheckout} className="btn-accent px-7">Place order</button>
        </div>
      </div>

      {checkoutOpen && (
        <CheckoutModal
          summary={{
            title: `${garment.name} · ${colorName} · ${size}`,
            subtitle: `${pricing.prints.map(p => p.label).join(', ')} · Qty ${quantity}`,
            total: pricing.total,
          }}
          buildOrderForm={buildOrderForm}
          onClose={() => setCheckoutOpen(false)}
          onPlaced={(order) => { setCheckoutOpen(false); setPlacedOrder(order); window.scrollTo({ top: 0 }); }}
        />
      )}
    </div>
  );
}
</script>
<script type="text/plain" data-path="src/pages/HomePage.tsx">
import { useEffect, useState } from 'react';
import { Link } from 'react-router-dom';
import {
  ArrowRight, ArrowUpRight, BadgeCheck, Droplets, Layers, Palette, Shirt, Sparkles, Truck, Upload, Users,
} from 'lucide-react';
import MockupImage from '../customizer/MockupImage';
import ProductCard from '../components/ProductCard';
import EnquiryForm from '../components/EnquiryForm';
import { getBanners, getGarments, getProducts } from '../services/api';
import { useSiteSettings } from '../context/SiteSettingsContext';
import type { Garment, Product } from '../types';
import { inr } from '../utils/format';
import { getImageUrl } from '../utils/imageUtils';

interface Banner {
  id: number;
  title?: string;
  subtitle?: string;
  imageUrl: string;
  link?: string;
}

const MARQUEE = ['Custom Hoodies', 'Oversized Tees', 'Polo T-Shirts', 'Team & College Merch', 'Corporate Uniforms', 'Event T-Shirts', 'Bulk Orders'];

const STEPS = [
  { icon: Shirt, title: 'Pick your garment', text: 'Hoodie, oversized tee or polo — in the colour you love.' },
  { icon: Upload, title: 'Add your print', text: 'Upload artwork or type text on the chest, front or back. Move and resize it live.' },
  { icon: BadgeCheck, title: 'Verify & order', text: 'Confirm with a quick email code. We print, pack and ship it to your door.' },
];

export default function HomePage() {
  const { settings } = useSiteSettings();
  const [garments, setGarments] = useState<Garment[]>([]);
  const [products, setProducts] = useState<Product[]>([]);
  const [banners, setBanners] = useState<Banner[]>([]);

  useEffect(() => {
    getGarments().then(setGarments).catch(() => setGarments([]));
    getProducts().then(d => setProducts((Array.isArray(d) ? d : d.products || []).slice(0, 8))).catch(() => setProducts([]));
    getBanners().then(d => setBanners(Array.isArray(d) ? d : [])).catch(() => setBanners([]));
  }, []);

  const hoodie = garments.find(g => g.style === 'hoodie');
  const showcase = garments[0];
  const features = [
    { icon: Layers, title: settings?.feature1Title || 'Heavyweight cotton', text: settings?.feature1Desc || '180 to 350 GSM pre-shrunk combed cotton for maximum durability.' },
    { icon: Droplets, title: settings?.feature2Title || 'Precision printing', text: settings?.feature2Desc || 'Vibrant, crack-resistant prints with high detail.' },
    { icon: Sparkles, title: settings?.feature3Title || 'Bio-washed & pre-shrunk', text: settings?.feature3Desc || 'Ultra-soft feel with no fading or shrinkage.' },
    { icon: Users, title: settings?.feature4Title || 'Bulk & team orders', text: settings?.feature4Desc || 'Custom apparel for colleges, events and companies.' },
  ];

  return (
    <>
      {/* ── Hero ─────────────────────────────────────────────────────────── */}
      <section className="relative overflow-hidden">
        <div className="container-x grid items-center gap-10 pb-16 pt-10 sm:pt-14 lg:grid-cols-12 lg:pb-24">
          <div className="animate-fade-up lg:col-span-6">
            <p className="eyebrow"><span className="h-1.5 w-1.5 rounded-full bg-accent" /> Custom apparel studio</p>
            <h1 className="mt-5 font-display text-[clamp(2.75rem,8vw,5.75rem)] font-extrabold leading-[0.95] tracking-tight">
              Wear what<br />you <span className="relative inline-block text-accent">imagine.
                <svg className="absolute -bottom-2 left-0 w-full" viewBox="0 0 300 12" fill="none" aria-hidden="true"><path d="M2 9c60-6 180-8 296-3" stroke="currentColor" strokeWidth="4" strokeLinecap="round" /></svg>
              </span>
            </h1>
            <p className="mt-7 max-w-lg text-base leading-relaxed text-muted sm:text-lg">
              Premium hoodies, oversized tees and polos printed with your artwork. Design it live in our studio and see the exact price before you order.
            </p>
            <div className="mt-9 flex flex-col gap-3 sm:flex-row">
              <Link to="/customize" className="btn-accent px-8 py-4 text-base">Start designing <ArrowRight className="h-4 w-4" /></Link>
              <Link to="/shop" className="btn-outline px-8 py-4 text-base">Shop collection</Link>
            </div>
            <ul className="mt-10 grid max-w-lg grid-cols-3 gap-4 border-t border-line pt-6 text-sm">
              <li><p className="font-display text-2xl font-bold">{garments.length || 3}</p><p className="text-muted">garment styles</p></li>
              <li><p className="font-display text-2xl font-bold">{Math.max(...garments.map(g => g.colors.length), 6)}+</p><p className="text-muted">base colours</p></li>
              <li><p className="font-display text-2xl font-bold">1–500</p><p className="text-muted">pieces / order</p></li>
            </ul>
          </div>

          <div className="relative lg:col-span-6">
            <div className="absolute inset-x-6 bottom-0 top-10 overflow-hidden rounded-[2.5rem] bg-paper-deep sm:inset-x-10">
              <div className="absolute -right-10 -top-10 h-64 w-64 rounded-full bg-accent/50 blur-3xl" />
              <div className="absolute -bottom-16 -left-10 h-56 w-56 rounded-full bg-[#b9a7d6]/50 blur-3xl" />
            </div>
            <div className="relative grid grid-cols-5 items-end px-2 pt-6 sm:px-6">
              <MockupImage garment={{ style: 'oversized-tee' }} color="#f3f1ea" className="col-span-2 -mr-10 mb-6 -rotate-6 drop-shadow-2xl" alt="" />
              <MockupImage garment={hoodie ?? { style: 'hoodie' }} color="#141414" className="relative z-10 col-span-3 drop-shadow-2xl" alt="Custom printed hoodie" />
            </div>
            <div className="absolute left-2 top-10 z-20 rounded-2xl bg-white px-4 py-3 shadow-xl ring-1 ring-line sm:left-4">
              <p className="text-[11px] font-semibold uppercase tracking-wider text-muted">Live pricing</p>
              <p className="mt-1 text-sm">Hoodie {inr(hoodie?.basePrice ?? 500)} <span className="text-muted">+ back print</span></p>
            </div>
            <div className="absolute bottom-6 right-4 z-20 flex items-center gap-2 rounded-full bg-white px-4 py-2.5 text-sm font-semibold shadow-xl ring-1 ring-line sm:right-10">
              <Palette className="h-4 w-4 text-accent" /> {hoodie?.colors.length ?? 6}+ colours
            </div>
          </div>
        </div>

            ))}
          </div>
        </div>
      </section>

      {/* ── Print placements ─────────────────────────────────────────────── */}
      {showcase && (
        <section className="overflow-hidden bg-ink py-20 text-white sm:py-28">
          <div className="container-x grid items-center gap-14 lg:grid-cols-2">
            <div>
              <p className="eyebrow text-white/50">Transparent pricing</p>

              <p className="mt-5 max-w-md text-white/60">Every garment has a base price. Each print spot adds a fixed amount — the total updates instantly in the studio.</p>
              <ul className="mt-10 divide-y divide-white/10 border-y border-white/10">
                <li className="flex items-center justify-between py-4">

                  <li key={p.key} className="flex items-center justify-between py-4">
                    <span className="flex items-center gap-3"><span className="h-2 w-2 rounded-full bg-accent" />{p.label}</span>

                <div key={v} className="relative rounded-3xl bg-white/5 p-4 ring-1 ring-white/10">

      {banners.length > 0 && (
        <section className="pb-20 sm:pb-28">
          <div className="container-x"><p className="eyebrow">Lookbook</p></div>
          <div className="no-scrollbar mt-6 flex snap-x snap-mandatory gap-4 overflow-x-auto px-4 sm:px-6 lg:px-8 xl:px-[max(2rem,calc((100vw_-_80rem)/2_+_2rem))]">
            {banners.map(b => {
              const inner = (
                <div className="group relative h-[420px] w-[78vw] shrink-0 snap-start overflow-hidden rounded-3xl sm:w-[460px]">
                  <img src={getImageUrl(b.imageUrl)} alt={b.title || ''} loading="lazy" className="h-full w-full object-cover transition duration-700 group-hover:scale-105" />
                  {(b.title || b.subtitle) && (
                    <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/75 to-transparent p-6 text-white">
                      {b.title && <h3 className="font-display text-2xl font-bold">{b.title}</h3>}
                      {b.subtitle && <p className="mt-1 text-sm text-white/75">{b.subtitle}</p>}
                    </div>
                  )}
                </div>
              );
              return b.link
                ? <a key={b.id} href={b.link} className="contents">{inner}</a>
                : <div key={b.id} className="contents">{inner}</div>;
            })}
          </div>
        </section>
      )}

      {/* ── Why us ───────────────────────────────────────────────────────── */}
      <section className="border-t border-line bg-white py-20 sm:py-28">
        <div className="container-x">
          <div className="grid gap-12 lg:grid-cols-12">
            <div className="lg:col-span-4">
              <p className="eyebrow">{settings?.aboutSubtitle || 'Why choose us'}</p>
              <h2 className="mt-3 font-display text-4xl font-bold tracking-tight">{settings?.aboutTitle || 'Quality you can feel, prints that last.'}</h2>
              <Link to="/about" className="mt-6 inline-flex items-center gap-2 text-sm font-semibold hover:text-accent">Our story <ArrowRight className="h-4 w-4" /></Link>
            </div>
            <div className="grid gap-8 sm:grid-cols-2 lg:col-span-8">
              {features.map(({ icon: Icon, title, text }) => (
                <div key={title} className="flex gap-5">
                  <span className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-accent-soft text-accent"><Icon className="h-5 w-5" /></span>
                  <div>
                    <h3 className="font-semibold">{title}</h3>
                    <p className="mt-1.5 text-sm leading-relaxed text-muted">{text}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* ── Bulk orders ──────────────────────────────────────────────────── */}
      <section className="container-x py-20 sm:py-28">
        <div className="grid gap-10 rounded-[2rem] bg-paper-deep p-6 sm:p-12 lg:grid-cols-2 lg:gap-16">
          <div>
            <p className="eyebrow">Bulk & corporate</p>
            <h2 className="mt-3 font-display text-4xl font-bold tracking-tight sm:text-5xl">Ordering for a team, event or brand?</h2>
            <p className="mt-5 max-w-md text-muted">Tell us the quantity, garments and artwork you have in mind and we'll get back with a quote for your bulk order.</p>
            <ul className="mt-8 space-y-3 text-sm">
              {['Quotes for bulk quantities', 'Help with artwork & mock-ups', 'Mixed sizes and colours in one order'].map(t => (
                <li key={t} className="flex items-center gap-3"><Truck className="h-4 w-4 text-accent" />{t}</li>
              ))}
            </ul>
          </div>
          <EnquiryForm compact />
        </div>
      </section>
    </>
  );
}

<script type="text/plain" data-path="src/pages/ProductDetails.tsx">
import { FormEvent, useEffect, useState } from 'react';
import { Link, useParams } from 'react-router-dom';
import { ArrowLeft, Loader2, Palette, RotateCcw, ShieldCheck, Shirt, Star, Truck } from 'lucide-react';
import api, { createProductEnquiry, errorMessage } from '../services/api';
import type { Product, ProductImage } from '../types';
import ProductCard from '../components/ProductCard';
import { WhatsAppIcon } from '../components/WhatsAppButton';
import { useSiteSettings } from '../context/SiteSettingsContext';
import { getImageUrl } from '../utils/imageUtils';
import { inr, waLink } from '../utils/format';

interface Review {
    id: number;
    customerName: string;
    rating: number;
    comment: string;
    createdAt: string;
}

const Stars = ({ value, size = 'h-4 w-4' }: { value: number; size?: string }) => (
    <span className="flex gap-0.5">
        {[1, 2, 3, 4, 5].map(i => (
            <Star key={i} className={`${size} ${i <= Math.round(value) ? 'fill-accent text-accent' : 'text-line'}`} />
        ))}
    </span>
);

const ProductDetails = () => {
    const { id } = useParams<{ id: string }>();
    const { settings } = useSiteSettings();
    const [product, setProduct] = useState<Product | null>(null);
    const [related, setRelated] = useState<Product[]>([]);
    const [reviews, setReviews] = useState<Review[]>([]);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState('');
    const [activeImage, setActiveImage] = useState(0);
    const [size, setSize] = useState('');

    const [reviewForm, setReviewForm] = useState({ customerName: '', rating: 5, comment: '' });
    const [reviewState, setReviewState] = useState<'idle' | 'sending' | 'sent'>('idle');

    const [enquiry, setEnquiry] = useState({ name: '', email: '', mobileNo: '', message: '' });
    const [enquiryState, setEnquiryState] = useState<'idle' | 'sending' | 'sent'>('idle');
    const [enquiryError, setEnquiryError] = useState('');

    useEffect(() => {
        let alive = true;
        setLoading(true);
        setActiveImage(0);
        (async () => {
            try {
                const { data } = await api.get<Product>(`/products/${id}`);
                if (!alive) return;
                setProduct(data);
                setSize(data.availableSizes?.[0] || '');
                const [rel, rev] = await Promise.all([
                    api.get(`/products/advanced-search?category=${data.category?.id || ''}`).catch(() => ({ data: [] })),
                    api.get(`/reviews/product/${id}`).catch(() => ({ data: [] })),
                ]);
                if (!alive) return;
                const list: Product[] = Array.isArray(rel.data) ? rel.data : rel.data.products || [];
                setRelated(list.filter(p => p.id !== data.id).slice(0, 4));
                setReviews(Array.isArray(rev.data) ? rev.data : []);
            } catch {
                if (alive) setError('This product could not be found.');
            } finally {
                if (alive) setLoading(false);
            }
        })();
        return () => { alive = false; };
    }, [id]);

    const submitReview = async (e: FormEvent) => {
        e.preventDefault();
        if (!reviewForm.customerName.trim() || !reviewForm.comment.trim()) return;
        setReviewState('sending');
        try {
            const { data } = await api.post('/reviews', { productId: id, ...reviewForm });
            setReviews(r => [data, ...r]);
            setReviewForm({ customerName: '', rating: 5, comment: '' });
            setReviewState('sent');
        } catch {
            setReviewState('idle');
        }
    };

    const submitEnquiry = async (e: FormEvent) => {
        e.preventDefault();
        if (!product) return;
        if (!enquiry.name.trim() || !enquiry.email.trim() || enquiry.mobileNo.replace(/\D/g, '').length < 10) {
            setEnquiryError('Please enter your name, email and a valid mobile number.');
            return;
        }
        setEnquiryError('');
        setEnquiryState('sending');
        try {
            await createProductEnquiry({
                ...enquiry,
                message: enquiry.message || `Interested in ${product.name}${size ? ` (size ${size})` : ''}.`,
                productId: product.id,
                productCode: product.productCode,
                productName: product.name,
            });
            setEnquiryState('sent');
        } catch (err) {
            setEnquiryError(errorMessage(err));
            setEnquiryState('idle');
        }
    };

    if (loading) {
        return <div className="grid min-h-[70vh] place-items-center"><Loader2 className="h-8 w-8 animate-spin text-accent" /></div>;
    }

    if (error || !product) {
        return (
            <div className="container-x grid min-h-[60vh] place-items-center text-center">
                <div>
                    <Shirt className="mx-auto h-12 w-12 text-muted" strokeWidth={1} />
                    <h1 className="mt-4 font-display text-2xl font-bold">{error || 'Product not found'}</h1>
                    <Link to="/shop" className="btn-primary mt-6">Back to shop</Link>
                </div>
            </div>
        );
    }

    const images: ProductImage[] = product.images?.length
        ? product.images
        : product.imageUrl ? [{ id: 0, imageUrl: product.imageUrl, imageOrder: 0, isMain: true }] : [];
    const avg = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : 0;
    const whatsapp = settings?.whatsappNumber
        ? waLink(settings.whatsappNumber, `Hi! I'd like to order *${product.name}* (Code: ${product.productCode})${size ? `, size *${size}*` : ''}. Price shown: ${inr(product.price)}. Please share availability.`)
        : '';
    const specs = [
        ['Fabric', product.fabric],
        ['Fit', product.fitType],
        ['For', product.gender],
        ['Colour', product.color],
        ['Code', product.productCode],
    ].filter(([, v]) => v);

    return (
        <>
            <section className="container-x py-8 sm:py-12">
                <Link to="/shop" className="inline-flex items-center gap-2 text-sm font-medium text-muted hover:text-ink">
                    <ArrowLeft className="h-4 w-4" /> Back to shop
                </Link>

                <div className="mt-6 grid gap-10 lg:grid-cols-2 lg:gap-16">
                    {/* Gallery */}
                    <div className="lg:sticky lg:top-24 lg:self-start">
                        <div className="aspect-[4/5] overflow-hidden rounded-[2rem] bg-paper-deep">
                            {images[activeImage] ? (
                                <img src={getImageUrl(images[activeImage].imageUrl)} alt={product.name} className="h-full w-full object-cover" />
                            ) : (
                                <div className="grid h-full place-items-center text-muted"><Shirt className="h-16 w-16" strokeWidth={1} /></div>
                            )}
                        </div>
                        {images.length > 1 && (
                            <div className="no-scrollbar mt-4 flex gap-3 overflow-x-auto">
                                {images.map((img, i) => (
                                    <button key={img.id} onClick={() => setActiveImage(i)}
                                        className={`h-20 w-16 shrink-0 overflow-hidden rounded-xl ring-2 transition ${i === activeImage ? 'ring-ink' : 'ring-transparent opacity-70 hover:opacity-100'}`}>
                                        <img src={getImageUrl(img.imageUrl)} alt="" className="h-full w-full object-cover" />
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Info */}
                    <div>
                        {product.category && <p className="eyebrow">{product.category.name}</p>}
                        <h1 className="mt-3 font-display text-4xl font-bold tracking-tight sm:text-5xl">{product.name}</h1>
                        {reviews.length > 0 && (
                            <a href="#reviews" className="mt-3 flex items-center gap-2 text-sm text-muted">
                                <Stars value={avg} /> {avg.toFixed(1)} · {reviews.length} review{reviews.length > 1 ? 's' : ''}
                            </a>
                        )}
                        <p className="mt-6 font-display text-4xl font-bold">{inr(product.price)}</p>

                        {product.description && <p className="mt-6 whitespace-pre-line leading-relaxed text-muted">{product.description}</p>}

                        {!!product.availableSizes?.length && (
                            <div className="mt-8">
                                <p className="label">Size</p>
                                <div className="flex flex-wrap gap-2">
                                    {(product.availableSizes ?? []).map(s => (
                                        <button key={s} onClick={() => setSize(s)}
                                            className={`min-w-14 rounded-xl border px-4 py-2.5 text-sm font-semibold transition ${size === s ? 'border-ink bg-ink text-white' : 'border-line bg-white hover:border-ink'}`}>
                                            {s}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="mt-8 flex flex-col gap-3 sm:flex-row">
                            {whatsapp && (
                                <a href={whatsapp} target="_blank" rel="noreferrer" className="btn flex-1 bg-[#25D366] py-4 text-white hover:bg-[#1ebe5a]">
                                    <WhatsAppIcon className="h-5 w-5" /> Order on WhatsApp
                                </a>
                            )}
                            <a href="#enquire" className="btn-outline flex-1 py-4">Send an enquiry</a>
                        </div>
                        {product.isCustomizable && (
                            <Link to="/customize" className="mt-3 flex items-center justify-center gap-2 rounded-full bg-accent-soft py-3 text-sm font-semibold text-accent-dark hover:bg-accent hover:text-white">
                                <Palette className="h-4 w-4" /> Want your own print? Open the design studio
                            </Link>
                        )}

                        {specs.length > 0 && (
                            <dl className="mt-10 divide-y divide-line border-y border-line text-sm">
                                {specs.map(([k, v]) => (
                                    <div key={k} className="flex justify-between py-3"><dt className="text-muted">{k}</dt><dd className="font-medium">{v}</dd></div>
                                ))}
                            </dl>
                        )}

                        <div className="mt-8 grid grid-cols-3 gap-3 text-center text-xs text-muted">
                            {[{ icon: ShieldCheck, t: 'Quality checked' }, { icon: Truck, t: 'Shipped across India' }, { icon: RotateCcw, t: 'Easy support' }].map(({ icon: Icon, t }) => (
                                <div key={t} className="rounded-2xl bg-white p-4 ring-1 ring-line"><Icon className="mx-auto mb-2 h-5 w-5 text-ink" />{t}</div>
                            ))}
                        </div>

                        {/* Enquiry */}
                        <div id="enquire" className="mt-10 scroll-mt-28 rounded-3xl bg-white p-6 ring-1 ring-line">

<script type="text/plain" data-path="src/pages/ShopPage.tsx">

    Promise.all([
      getProducts().then(d => setProducts(Array.isArray(d) ? d : d.products || [])),
      getCategories().then(d => setCategories(Array.isArray(d) ? d : [])),
    ]).catch(() => undefined).finally(() => setLoading(false));
  }, []);

    const q = query.trim().toLowerCase();

        <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">

              <button
                key={c.id}
                onClick={() => setCategory(c.id)}

            </label>
            <select value={sort} onChange={e => setSort(e.target.value as Sort)} className="field w-auto rounded-full pr-8" aria-label="Sort products">
              <option value="new">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>

<script type="text/plain" data-path="src/services/api.ts">
import axios from 'axios';
import type { Garment, PlacedOrder } from '../types';

const API_URL = import.meta.env.VITE_API_URL || 'http://localhost:5000/api';

const api = axios.create({
    baseURL: API_URL,
    headers: {
        'Content-Type': 'application/json',
    },
    timeout: 30000,
});

/** Pull the server's error message out of an axios error */
export const errorMessage = (err: unknown, fallback = 'Something went wrong. Please try again.'): string => {
    if (axios.isAxiosError(err)) {
        const msg = (err.response?.data as { message?: string } | undefined)?.message;
        if (msg) return msg;
        if (err.code === 'ECONNABORTED') return 'The request timed out. Please check your connection.';
    }
    return fallback;
};

export const getProducts = async () => {
    const response = await api.get('/products');
    return response.data;
};

export const createEnquiry = async (enquiryData: { name: string; email: string; mobileNo: string; message: string }) => {
    const response = await api.post('/enquiries', enquiryData);
    return response.data;
};

export const createProductEnquiry = async (enquiryData: {
    name: string;
    email: string;
    mobileNo: string;
    message: string;
    productId: number;
    productCode: string;
    productName: string;
}) => {
    const response = await api.post('/enquiries/product', enquiryData);
    return response.data;
};

export const getCategories = async () => {
    const response = await api.get('/categories');
    return response.data;
};

export const getSiteSettings = async () => {
    const response = await api.get('/settings');
    return response.data;
};

export const getBanners = async () => {
    const response = await api.get('/banners/public');
    return response.data;
};

// ── Design studio ────────────────────────────────────────────────────────────
export const getGarments = async (): Promise<Garment[]> => {
    const response = await api.get('/garments');
    return response.data;
};

export const sendEmailOtp = async (email: string): Promise<{ expiresIn: number }> => {
    const response = await api.post('/otp/send', { email });
    return response.data;
};

export const verifyEmailOtp = async (email: string, code: string): Promise<{ verificationToken: string }> => {
    const response = await api.post('/otp/verify', { email, code });
    return response.data;
};

export const placeOrder = async (form: FormData, verificationToken: string): Promise<PlacedOrder> => {
    const response = await api.post('/orders', form, {
        headers: { 'Content-Type': 'multipart/form-data', 'X-Verification-Token': verificationToken },
        timeout: 120000,
    });
    return response.data;
};

export default api;
</script>

<script type="text/plain" data-path="src/utils/format.ts">
export const inr = (value: number | string | undefined | null): string => {
  const n = Number(value) || 0;
  return `₹${n.toLocaleString('en-IN', { maximumFractionDigits: 2 })}`;
};

/** Normalise a phone number for wa.me (adds India's 91 to bare 10-digit numbers) */
export const waNumber = (raw?: string | null): string => {
  const digits = String(raw || '').replace(/\D/g, '');
  return digits.length === 10 ? `91${digits}` : digits;
};

export const waLink = (number: string | null | undefined, text: string): string => {
  const n = waNumber(number);
  return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;
};

<script type="text/plain" data-path="src/utils/imageUtils.ts">
export function getImageUrl(url?: string | null): string {
  if (!url) return '';
  if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:')) {
    return url;
  }
  const API_URL = import.meta.env.VITE_API_URL || 'http://localhost:5000/api';
  const API_BASE = API_URL.replace(/\/api\/?$/, '');

  if (url.startsWith('/uploads')) {
    return `${API_BASE}${url}`;
  }
  return `${API_BASE}/uploads/${url}`;
}
