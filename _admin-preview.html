      if (selectedEnquiry?.id === id) setSelectedEnquiry({ ...selectedEnquiry, status: "resolved" });
    } catch (err: any) {
      alert("Failed to mark as resolved: " + err.message);
    }
  };

  const handleDelete = async (id: number) => {
    if (!window.confirm("Are you sure you want to delete this enquiry?")) return;
    try {
      await deleteEnquiry(String(id));
      setEnquiries((prev) => prev.filter((e) => e.id !== id));
      setSelectedEnquiry(null);
    } catch (err: any) {
      alert("Failed to delete: " + err.message);
    }
  };

  const pendingCount = enquiries.filter((e) => e.status === "pending").length;
  const productEnquiryCount = enquiries.filter((e) => e.enquiryType === "product").length;

  return (
    <AdminLayout>
      <div className="space-y-6">
        {/* Header */}
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-3xl font-bold text-gray-900 tracking-tight">Enquiry Management</h2>
            <p className="text-gray-600 mt-1">
              {filteredEnquiries.length} enquiries • {pendingCount} pending • {productEnquiryCount} product enquiries
            </p>
          </div>
        </div>

        {/* Filters */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
          <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
            <div className="relative md:col-span-2">
              <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" />
              <input
                type="text"
                placeholder="Search by name, email, phone, product code..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
              />
            </div>

            <div className="relative">
              <Filter className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" />
              <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value as any)}
                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-white">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>

            <div className="relative">
              <MessageCircle className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" />
              <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value as any)}
                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-white">
                <option value="all">All Types</option>
                <option value="general">General</option>
                <option value="product">Product</option>
              </select>
            </div>

            <div className="relative">
              <Calendar className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" />
              <select value={dateFilter} onChange={(e) => setDateFilter(e.target.value as any)}
                className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-white">
                <option value="all">All Time</option>
                <option value="today">Today</option>
                <option value="week">Last 7 Days</option>
                <option value="month">Last 30 Days</option>
              </select>
            </div>
          </div>
        </div>

        {/* Content */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Enquiry List */}
          <div className="lg:col-span-1 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="p-4 border-b border-gray-200 bg-gray-50">
              <h3 className="font-semibold text-gray-900">Enquiries</h3>
            </div>
            <div className="overflow-y-auto max-h-[calc(100vh-350px)]">
              {loading && <p className="p-8 text-center text-gray-500">Loading...</p>}
              {error && <p className="p-8 text-center text-red-600">Error: {error}</p>}
              {!loading && filteredEnquiries.length === 0 && (
                <p className="p-8 text-center text-gray-500">No enquiries found.</p>
              )}
              {filteredEnquiries.map((enquiry) => {
                const isSelected = selectedEnquiry?.id === enquiry.id;
                return (
                  <div
                    key={enquiry.id}
                    onClick={() => setSelectedEnquiry(enquiry)}
                    className={`p-4 border-b border-gray-100 cursor-pointer transition ${
                      isSelected ? "bg-blue-50 border-l-4 border-l-blue-600" : "hover:bg-gray-50"
                    }`}
                  >
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-0.5">
                          <p className="font-semibold text-gray-900 truncate">{enquiry.name}</p>
                          {enquiry.enquiryType === "product" && (
                            <span className="flex-shrink-0 inline-flex items-center gap-0.5 text-[10px] font-bold bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded-full">
                              <Package size={9} /> Product
                            </span>
                          )}
                        </div>
                        {enquiry.productCode && (
                          <p className="text-xs text-orange-600 font-semibold">{enquiry.productCode} • {enquiry.productName}</p>
                        )}
                        <p className="text-sm text-gray-600 truncate">{enquiry.email}</p>
                        <p className="text-xs text-gray-400 mt-1">{new Date(enquiry.createdAt).toLocaleDateString()}</p>
                      </div>
                      <div className="flex-shrink-0">
                        {enquiry.status === "pending" ? (
                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium">
                            <Clock className="w-3 h-3" /> Pending
                          </span>
                        ) : (
                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">
                            <CheckCircle className="w-3 h-3" /> Resolved
                          </span>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Enquiry Details */}
          <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            {selectedEnquiry ? (
              <div className="space-y-6">
                <div className="flex items-start justify-between flex-wrap gap-3">
                  <h3 className="text-2xl font-bold text-gray-900">Enquiry Details</h3>
                  <div className="flex items-center gap-2">
                    {selectedEnquiry.enquiryType === "product" && (
                      <span className="inline-flex items-center gap-1 px-3 py-1.5 bg-orange-100 text-orange-700 rounded-full text-sm font-medium">
                        <Package className="w-4 h-4" /> Product Enquiry
                      </span>
                    )}
                    {selectedEnquiry.status === "pending" ? (
                      <span className="inline-flex items-center gap-1 px-3 py-1.5 bg-yellow-100 text-yellow-700 rounded-full text-sm font-medium">
                        <Clock className="w-4 h-4" /> Pending
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 px-3 py-1.5 bg-green-100 text-green-700 rounded-full text-sm font-medium">
                        <CheckCircle className="w-4 h-4" /> Resolved
                      </span>
                    )}
                  </div>
                </div>

                {/* Product info (if product enquiry) */}
                {selectedEnquiry.enquiryType === "product" && selectedEnquiry.productCode && (
                  <div className="bg-orange-50 border border-orange-200 rounded-xl p-4">
                    <p className="text-xs font-semibold text-orange-600 uppercase tracking-wide mb-1">Product Enquiry</p>
                    <p className="font-bold text-gray-900 text-lg">{selectedEnquiry.productName}</p>
                    <p className="text-sm text-orange-700 font-mono font-bold mt-1">{selectedEnquiry.productCode}</p>
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="space-y-1">
                    <p className="text-sm text-gray-500 flex items-center gap-2"><User className="w-4 h-4" /> Name</p>
                    <p className="font-semibold text-gray-900">{selectedEnquiry.name}</p>
                  </div>
                  <div className="space-y-1">
                    <p className="text-sm text-gray-500 flex items-center gap-2"><Mail className="w-4 h-4" /> Email</p>
                    <p className="font-semibold text-gray-900">{selectedEnquiry.email}</p>
                  </div>
                  <div className="space-y-1">
                    <p className="text-sm text-gray-500 flex items-center gap-2"><Phone className="w-4 h-4" /> Mobile</p>
                    <p className="font-semibold text-gray-900">{selectedEnquiry.mobileNo || "-"}</p>
                  </div>
                  <div className="space-y-1">
                    <p className="text-sm text-gray-500 flex items-center gap-2"><Calendar className="w-4 h-4" /> Received On</p>
                    <p className="font-semibold text-gray-900">{new Date(selectedEnquiry.createdAt).toLocaleString()}</p>
                  </div>
                </div>

                <div>
                  <p className="text-sm text-gray-500 mb-2">Message</p>
                  <div className="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <p className="text-gray-900 whitespace-pre-wrap">{selectedEnquiry.message}</p>
                  </div>
                </div>

                <div className="flex gap-3 pt-4 border-t border-gray-200">
                  {selectedEnquiry.status === "pending" && (
                    <button
                      onClick={() => handleMarkResolved(selectedEnquiry.id)}
                      className="flex-1 px-4 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition flex items-center justify-center gap-2"
                    >
                      <CheckCircle className="w-5 h-5" /> Mark as Resolved
                    </button>
                  )}
                  <button
                    onClick={() => handleDelete(selectedEnquiry.id)}
                    className="flex-1 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-semibold transition flex items-center justify-center gap-2"
                  >
                    <Trash2 className="w-5 h-5" /> Delete
                  </button>
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center h-64 text-gray-500">
                <Mail className="w-16 h-16 mb-4 text-gray-300" />
                <p>Select an enquiry to view details</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </AdminLayout>
  );
};

export default EnquiryManagement;
</script>
<script type="text/plain" data-path="src/pages/GarmentManagement.tsx">
import { useEffect, useMemo, useRef, useState } from "react";
import {
  AlertCircle, CheckCircle2, Eye, EyeOff, ImageUp, Loader2, Plus, Save, Shirt, Trash2, X,
} from "lucide-react";
import AdminLayout from "../components/AdminLayout";
import {
  deleteGarment, fetchGarments, Garment, GarmentColor, GarmentSize, GarmentStyle, Placement, saveGarment,
} from "../services/garmentService";
import { MOCKUP_H, MOCKUP_W, renderMockup } from "../utils/mockups";
import { getImageUrl } from "../utils/imageUtils";
import { inr } from "../utils/format";

const STYLES: { value: GarmentStyle; label: string }[] = [
  { value: "hoodie", label: "Hoodie" },
  { value: "oversized-tee", label: "Oversized T-shirt" },
  { value: "polo", label: "Polo T-shirt" },
];

const PRESET_COLORS: GarmentColor[] = [
  { name: "Jet Black", hex: "#141414" }, { name: "Pure White", hex: "#fafafa" }, { name: "Off White", hex: "#f3f1ea" },
  { name: "Grey Melange", hex: "#a3a3a3" }, { name: "Charcoal", hex: "#3a3a3c" }, { name: "Navy", hex: "#1f2a44" },
  { name: "Royal Blue", hex: "#2747a3" }, { name: "Sky Blue", hex: "#8cb8e0" }, { name: "Red", hex: "#c62828" },
  { name: "Maroon", hex: "#6d1b2b" }, { name: "Bottle Green", hex: "#1e4d3a" }, { name: "Olive", hex: "#5b6236" },
  { name: "Beige", hex: "#d8c7a8" }, { name: "Mustard", hex: "#d4a72c" }, { name: "Lavender", hex: "#b9a7d6" },
  { name: "Baby Pink", hex: "#f2c4ce" },
];

type Draft = Omit<Garment, "id" | "basePrice"> & { id: number | null; basePrice: string };

const blankDraft = (): Draft => ({
  id: null,
  key: "",
  style: "oversized-tee",
  name: "",
  tagline: "",
  description: "",
  fabric: "",
  basePrice: "0",
  colors: [{ name: "Jet Black", hex: "#141414" }, { name: "Pure White", hex: "#fafafa" }],
  sizes: ["S", "M", "L", "XL", "XXL"].map(label => ({ label, extra: 0 })),
  placements: [
    { key: "chest", label: "Left Chest (over heart)", view: "front", price: 0, x: 0.56, y: 0.27, w: 0.14, h: 0.12, enabled: true },
    { key: "front", label: "Front / Stomach – Large", view: "front", price: 0, x: 0.33, y: 0.42, w: 0.34, h: 0.36, enabled: true },
    { key: "back", label: "Full Back", view: "back", price: 0, x: 0.3, y: 0.22, w: 0.4, h: 0.5, enabled: true },
  ],
  mockupFront: null,
  mockupBack: null,
  isActive: true,
  sortOrder: 0,
});

const toDraft = (g: Garment): Draft => ({ ...g, basePrice: String(Number(g.basePrice) || 0) });
const pct = (n: number) => Math.round(n * 1000) / 10;
const clamp01 = (n: number) => Math.min(1, Math.max(0, n));

// ── Mockup preview with draggable print areas ─────────────────────────────────
function ZonePreview({ draft, view, color, frontFile, backFile, onChange, selected, onSelect }: {
  draft: Draft;
  view: "front" | "back";
  color: string;
  frontFile: File | null;
  backFile: File | null;
  onChange: (index: number, patch: Partial<Placement>) => void;
  selected: number | null;
  onSelect: (index: number) => void;
}) {
  const [src, setSrc] = useState("");
  const boxRef = useRef<HTMLDivElement>(null);
  const drag = useRef<{ index: number; mode: "move" | "resize"; startX: number; startY: number; orig: Placement } | null>(null);

  const localFile = view === "front" ? frontFile : backFile;
  const remote = view === "front" ? draft.mockupFront : draft.mockupBack;

  useEffect(() => {
    let alive = true;
    let objectUrl = "";
    if (localFile) objectUrl = URL.createObjectURL(localFile);
    const photo = objectUrl || remote || null;
    renderMockup({ style: draft.style, mockupFront: view === "front" ? photo : null, mockupBack: view === "back" ? photo : null }, view, color, getImageUrl)
      .then(c => { if (alive) setSrc(c.toDataURL("image/png")); })
      .catch(() => { if (alive) setSrc(""); });
    return () => { alive = false; if (objectUrl) URL.revokeObjectURL(objectUrl); };
  }, [draft.style, view, color, localFile, remote]);

  const onPointerDown = (e: React.PointerEvent, index: number, mode: "move" | "resize") => {
    e.preventDefault();
    e.stopPropagation();
    onSelect(index);
    (e.currentTarget as HTMLElement).setPointerCapture(e.pointerId);
    drag.current = { index, mode, startX: e.clientX, startY: e.clientY, orig: draft.placements[index] };
  };
  const onPointerMove = (e: React.PointerEvent) => {
    const d = drag.current;
    const box = boxRef.current?.getBoundingClientRect();
    if (!d || !box) return;
    const dx = (e.clientX - d.startX) / box.width;
    const dy = (e.clientY - d.startY) / box.height;
    const o = d.orig;
    if (d.mode === "move") {
      onChange(d.index, { x: clamp01(Math.min(o.x + dx, 1 - o.w)), y: clamp01(Math.min(o.y + dy, 1 - o.h)) });
    } else {
      onChange(d.index, { w: Math.max(0.03, Math.min(o.w + dx, 1 - o.x)), h: Math.max(0.03, Math.min(o.h + dy, 1 - o.y)) });
    }
  };
  const onPointerUp = () => { drag.current = null; };

  return (
    <div ref={boxRef} className="relative w-full touch-none select-none overflow-hidden rounded-xl bg-[radial-gradient(circle_at_50%_35%,#fff,#ece9e2)]"
      style={{ aspectRatio: `${MOCKUP_W} / ${MOCKUP_H}` }} onPointerMove={onPointerMove} onPointerUp={onPointerUp}>
      {src ? <img src={src} alt="" className="absolute inset-0 h-full w-full" draggable={false} />
        : <div className="absolute inset-0 grid place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div>}
      {draft.placements.map((p, i) => p.view === view && (
        <div
          key={i}
          onPointerDown={(e) => onPointerDown(e, i, "move")}
          className={`absolute cursor-move rounded-md border-2 border-dashed ${selected === i ? "border-accent bg-accent/15" : "border-accent/60 bg-accent/5"} ${p.enabled ? "" : "opacity-40"}`}
          style={{ left: `${p.x * 100}%`, top: `${p.y * 100}%`, width: `${p.w * 100}%`, height: `${p.h * 100}%` }}
        >
          <span className="pointer-events-none absolute -top-5 left-0 whitespace-nowrap rounded bg-accent px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wide text-white">
            {p.label || p.key} · {inr(p.price)}
          </span>
          <span onPointerDown={(e) => onPointerDown(e, i, "resize")}
            className="absolute -bottom-1.5 -right-1.5 h-3.5 w-3.5 cursor-nwse-resize rounded-full border-2 border-white bg-accent shadow" />
        </div>
      ))}
    </div>
  );
}

// ── Page ──────────────────────────────────────────────────────────────────────
const GarmentManagement = () => {
  const [garments, setGarments] = useState<Garment[]>([]);
  const [loading, setLoading] = useState(true);
  const [draft, setDraft] = useState<Draft | null>(null);
  const [frontFile, setFrontFile] = useState<File | null>(null);
  const [backFile, setBackFile] = useState<File | null>(null);
  const [removeFront, setRemoveFront] = useState(false);
  const [removeBack, setRemoveBack] = useState(false);
  const [previewColor, setPreviewColor] = useState("#141414");
  const [selectedZone, setSelectedZone] = useState<number | null>(null);
  const [saving, setSaving] = useState(false);
  const [message, setMessage] = useState<{ type: "ok" | "error"; text: string } | null>(null);

  const load = async (selectId?: number) => {
    try {
      const list = await fetchGarments();
      setGarments(list);
      const pick = list.find(g => g.id === selectId) ?? list[0];
      if (pick && (selectId !== undefined || !draft)) openGarment(pick);
    } catch (err) {
      setMessage({ type: "error", text: (err as Error).message });
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { load(); // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const openGarment = (g: Garment | null) => {
    const d = g ? toDraft(g) : blankDraft();
    setDraft(d);
    setFrontFile(null);
    setBackFile(null);
    setRemoveFront(false);
    setRemoveBack(false);
    setSelectedZone(null);
    setPreviewColor(d.colors[0]?.hex ?? "#141414");
    setMessage(null);
  };

  const set = <K extends keyof Draft>(key: K, value: Draft[K]) => setDraft(d => (d ? { ...d, [key]: value } : d));
  const setColor = (i: number, patch: Partial<GarmentColor>) =>
    setDraft(d => d && { ...d, colors: d.colors.map((c, j) => (j === i ? { ...c, ...patch } : c)) });
  const setSize = (i: number, patch: Partial<GarmentSize>) =>
    setDraft(d => d && { ...d, sizes: d.sizes.map((s, j) => (j === i ? { ...s, ...patch } : s)) });
  const setPlacement = (i: number, patch: Partial<Placement>) =>
    setDraft(d => d && { ...d, placements: d.placements.map((p, j) => (j === i ? { ...p, ...patch } : p)) });

  const example = useMemo(() => {
    if (!draft) return null;
    const base = Number(draft.basePrice) || 0;
    const front = draft.placements.find(p => p.enabled && p.view === "front" && p.w * p.h > 0.05) ?? draft.placements.find(p => p.enabled);
    return front ? { label: front.label, base, print: Number(front.price) || 0 } : null;
  }, [draft]);

  const save = async () => {
    if (!draft) return;
    if (!draft.name.trim()) { setMessage({ type: "error", text: "Please enter a name." }); return; }
    if (draft.colors.length === 0) { setMessage({ type: "error", text: "Add at least one colour." }); return; }
    if (draft.sizes.length === 0) { setMessage({ type: "error", text: "Add at least one size." }); return; }
    const keys = draft.placements.map(p => p.key.trim());
    if (keys.some(k => !k) || new Set(keys).size !== keys.length) {
      setMessage({ type: "error", text: "Each print placement needs a unique key." });
      return;
    }
    setSaving(true);
    setMessage(null);
    try {
      const form = new FormData();
      form.append("name", draft.name);
      form.append("key", draft.key || draft.name);
      form.append("style", draft.style);
      form.append("tagline", draft.tagline || "");
      form.append("description", draft.description || "");
      form.append("fabric", draft.fabric || "");
      form.append("basePrice", draft.basePrice);
      form.append("sortOrder", String(draft.sortOrder || 0));
      form.append("isActive", String(draft.isActive));
      form.append("colors", JSON.stringify(draft.colors));
      form.append("sizes", JSON.stringify(draft.sizes));
      form.append("placements", JSON.stringify(draft.placements));
      if (frontFile) form.append("mockupFront", frontFile);
      if (backFile) form.append("mockupBack", backFile);
      if (removeFront && !frontFile) form.append("removeMockupFront", "true");
      if (removeBack && !backFile) form.append("removeMockupBack", "true");
      const saved = await saveGarment(draft.id, form);
      await load(saved.id);
      setMessage({ type: "ok", text: "Saved. Customers will see the new prices immediately." });
    } catch (err) {
      setMessage({ type: "error", text: (err as Error).message });
    } finally {
      setSaving(false);
    }
  };

  const remove = async () => {
    if (!draft?.id || !confirm(`Delete "${draft.name}"? Customers will no longer be able to design it.`)) return;
    try {
      await deleteGarment(draft.id);
      setDraft(null);
      await load();
    } catch (err) {
      setMessage({ type: "error", text: (err as Error).message });
    }
  };

  const shownFront = removeFront ? null : draft?.mockupFront;
  const shownBack = removeBack ? null : draft?.mockupBack;
  const previewDraft = draft ? { ...draft, mockupFront: shownFront, mockupBack: shownBack } : null;

  return (
    <AdminLayout title="Design Studio Pricing">
      <p className="-mt-2 mb-6 max-w-3xl text-sm text-muted">
        Set the garments customers can customise on the website: base price, available colours and sizes, and the price of each print placement.
        The customer sees <b>base price + selected prints + size extra</b> calculated automatically.
      </p>

      {loading ? (
        <div className="grid h-64 place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div>
      ) : (
        <div className="grid gap-6 xl:grid-cols-[280px_1fr]">
          {/* Garment list */}
          <div className="space-y-3">
            {garments.map(g => (
              <button key={g.id} onClick={() => openGarment(g)}
                className={`flex w-full items-center gap-3 rounded-2xl border p-3 text-left transition ${draft?.id === g.id ? "border-ink bg-white shadow-sm" : "border-line bg-white/60 hover:bg-white"}`}>
                <span className="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-paper"><Shirt className="h-5 w-5" /></span>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-sm font-semibold">{g.name}</span>
                  <span className="block text-xs text-muted">{inr(g.basePrice)} · {g.colors.length} colours · {g.placements.filter(p => p.enabled).length} prints</span>
                </span>
                {!g.isActive && <EyeOff className="h-4 w-4 text-muted" />}
              </button>
            ))}
            <button onClick={() => openGarment(null)} className="flex w-full items-center justify-center gap-2 rounded-2xl border border-dashed border-line py-3 text-sm font-semibold text-muted hover:border-ink hover:text-ink">
              <Plus className="h-4 w-4" /> Add garment
            </button>
          </div>

          {draft && previewDraft && (
            <div className="space-y-6">
              {message && (
                <div className={`flex items-center gap-2 rounded-xl px-4 py-3 text-sm ${message.type === "ok" ? "bg-emerald-50 text-emerald-800" : "bg-red-50 text-red-700"}`}>
                  {message.type === "ok" ? <CheckCircle2 className="h-4 w-4" /> : <AlertCircle className="h-4 w-4" />} {message.text}
                </div>
              )}

              <div className="grid gap-6 2xl:grid-cols-[1fr_420px]">
                <div className="space-y-6">
                  {/* Basics */}
                  <section className="a-card p-5 sm:p-6">
                    <div className="flex items-center justify-between">
                      <h2 className="font-display text-lg font-bold">{draft.id ? "Garment details" : "New garment"}</h2>
                      <button onClick={() => set("isActive", !draft.isActive)}
                        className={`inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold ${draft.isActive ? "bg-emerald-50 text-emerald-700" : "bg-gray-100 text-gray-500"}`}>
                        {draft.isActive ? <Eye className="h-3.5 w-3.5" /> : <EyeOff className="h-3.5 w-3.5" />}
                        {draft.isActive ? "Visible on website" : "Hidden"}
                      </button>
                    </div>
                    <div className="mt-5 grid gap-4 sm:grid-cols-2">
                      <div><label className="a-label">Name</label><input className="a-input" value={draft.name} onChange={e => set("name", e.target.value)} placeholder="Classic Hoodie" /></div>
                      <div>
                        <label className="a-label">Base price (₹)</label>
                        <input className="a-input text-lg font-semibold" type="number" min={0} value={draft.basePrice} onChange={e => set("basePrice", e.target.value)} />
                      </div>
                      <div>
                        <label className="a-label">Mockup drawing</label>
                        <select className="a-input" value={draft.style} onChange={e => set("style", e.target.value as GarmentStyle)}>
                          {STYLES.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                        </select>
                      </div>
                      <div><label className="a-label">URL key</label><input className="a-input" value={draft.key} onChange={e => set("key", e.target.value)} placeholder="hoodie" /></div>
                      <div><label className="a-label">Tagline</label><input className="a-input" value={draft.tagline} onChange={e => set("tagline", e.target.value)} /></div>
                      <div><label className="a-label">Fabric</label><input className="a-input" value={draft.fabric} onChange={e => set("fabric", e.target.value)} placeholder="320 GSM Cotton Fleece" /></div>
                      <div className="sm:col-span-2"><label className="a-label">Description</label><textarea rows={2} className="a-input resize-none" value={draft.description} onChange={e => set("description", e.target.value)} /></div>
                      <div><label className="a-label">Display order</label><input className="a-input" type="number" value={draft.sortOrder} onChange={e => set("sortOrder", parseInt(e.target.value) || 0)} /></div>
                    </div>
                  </section>

                  {/* Colours */}
                  <section className="a-card p-5 sm:p-6">
                    <h2 className="font-display text-lg font-bold">Base colours</h2>
                    <p className="mt-1 text-sm text-muted">Customers can only pick from these colours.</p>
                    <div className="mt-4 space-y-2">
                      {draft.colors.map((c, i) => (
                        <div key={i} className="flex items-center gap-2">
                          <input type="color" value={c.hex} onChange={e => setColor(i, { hex: e.target.value })} className="h-10 w-12 cursor-pointer rounded-lg border border-line bg-white p-1" />
                          <input className="a-input" value={c.name} onChange={e => setColor(i, { name: e.target.value })} placeholder="Colour name" />
                          <input className="a-input w-28 font-mono text-xs uppercase" value={c.hex} onChange={e => setColor(i, { hex: e.target.value })} />
                          <button onClick={() => set("colors", draft.colors.filter((_, j) => j !== i))} className="rounded-lg p-2 text-muted hover:bg-red-50 hover:text-red-600" aria-label="Remove colour"><Trash2 className="h-4 w-4" /></button>
                        </div>
                      ))}
                    </div>
                    <p className="a-label mt-5">Quick add</p>
                    <div className="flex flex-wrap gap-2">
                      {PRESET_COLORS.filter(p => !draft.colors.some(c => c.hex.toLowerCase() === p.hex)).map(p => (
                        <button key={p.hex} onClick={() => set("colors", [...draft.colors, p])}
                          className="inline-flex items-center gap-1.5 rounded-full border border-line bg-white py-1 pl-1 pr-3 text-xs font-medium hover:border-ink">
                          <span className="h-5 w-5 rounded-full ring-1 ring-black/10" style={{ backgroundColor: p.hex }} /> {p.name}
                        </button>
                      ))}
                      <button onClick={() => set("colors", [...draft.colors, { name: "New colour", hex: "#888888" }])}
                        className="inline-flex items-center gap-1 rounded-full border border-dashed border-line px-3 py-1 text-xs font-semibold text-muted hover:border-ink hover:text-ink">
                        <Plus className="h-3.5 w-3.5" /> Custom
                      </button>
                    </div>
                  </section>

                  {/* Sizes */}
                  <section className="a-card p-5 sm:p-6">
                    <h2 className="font-display text-lg font-bold">Sizes</h2>
                    <p className="mt-1 text-sm text-muted">Add an extra charge for bigger sizes if needed (e.g. XXL +₹50).</p>
                    <div className="mt-4 flex flex-wrap gap-3">
                      {draft.sizes.map((s, i) => (
                        <div key={i} className="flex items-center gap-1 rounded-xl border border-line bg-white p-1.5">
                          <input className="w-14 rounded-lg bg-paper px-2 py-1.5 text-center text-sm font-semibold outline-none" value={s.label} onChange={e => setSize(i, { label: e.target.value })} />
                          <span className="pl-1 text-xs text-muted">+₹</span>
                          <input className="w-16 rounded-lg px-1 py-1.5 text-sm outline-none" type="number" min={0} value={s.extra} onChange={e => setSize(i, { extra: Number(e.target.value) || 0 })} />
                          <button onClick={() => set("sizes", draft.sizes.filter((_, j) => j !== i))} className="rounded-md p-1 text-muted hover:text-red-600" aria-label="Remove size"><X className="h-3.5 w-3.5" /></button>
                        </div>
                      ))}
                      <button onClick={() => set("sizes", [...draft.sizes, { label: "", extra: 0 }])} className="rounded-xl border border-dashed border-line px-4 text-sm font-semibold text-muted hover:border-ink hover:text-ink">
                        <Plus className="inline h-4 w-4" /> Size
                      </button>
                    </div>
                  </section>

                  {/* Placements */}
                  <section className="a-card p-5 sm:p-6">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <h2 className="font-display text-lg font-bold">Print placements & prices</h2>
                        <p className="mt-1 text-sm text-muted">Bigger areas usually cost more. Drag the boxes on the preview to position them.</p>
                      </div>
                      <button onClick={() => set("placements", [...draft.placements, { key: `print-${draft.placements.length + 1}`, label: "New print area", view: "front", price: 0, x: 0.4, y: 0.4, w: 0.2, h: 0.15, enabled: true }])}
                        className="a-btn-outline shrink-0"><Plus className="h-4 w-4" /> Add</button>
                    </div>
                    <div className="mt-5 space-y-3">
                      {draft.placements.map((p, i) => (
                        <div key={i} onClick={() => setSelectedZone(i)}
                          className={`rounded-xl border p-4 transition ${selectedZone === i ? "border-accent bg-accent-soft/30" : "border-line"}`}>
                          <div className="grid gap-3 sm:grid-cols-[1fr_120px_110px_auto] sm:items-end">
                            <div><label className="a-label">Label shown to customer</label><input className="a-input" value={p.label} onChange={e => setPlacement(i, { label: e.target.value })} /></div>
                            <div>
                              <label className="a-label">Side</label>
                              <select className="a-input" value={p.view} onChange={e => setPlacement(i, { view: e.target.value as "front" | "back" })}>
                                <option value="front">Front</option><option value="back">Back</option>
                              </select>
                            </div>
                            <div><label className="a-label">Price (₹)</label><input className="a-input font-semibold" type="number" min={0} value={p.price} onChange={e => setPlacement(i, { price: Number(e.target.value) || 0 })} /></div>
                            <div className="flex items-center gap-1">
                              <button onClick={() => setPlacement(i, { enabled: !p.enabled })} title={p.enabled ? "Disable" : "Enable"}
                                className={`rounded-lg p-2.5 ${p.enabled ? "text-emerald-600 hover:bg-emerald-50" : "text-muted hover:bg-paper"}`}>
                                {p.enabled ? <Eye className="h-4 w-4" /> : <EyeOff className="h-4 w-4" />}
                              </button>
                              <button onClick={() => set("placements", draft.placements.filter((_, j) => j !== i))} className="rounded-lg p-2.5 text-muted hover:bg-red-50 hover:text-red-600" title="Remove">
                                <Trash2 className="h-4 w-4" />
                              </button>
                            </div>
                          </div>
                          <div className="mt-3 grid grid-cols-5 gap-2 text-xs">
                            <div><label className="a-label">Key</label><input className="a-input px-2 py-1.5 font-mono text-xs" value={p.key} onChange={e => setPlacement(i, { key: e.target.value })} /></div>
                            {(["x", "y", "w", "h"] as const).map(k => (
                              <div key={k}>
                                <label className="a-label">{{ x: "Left %", y: "Top %", w: "Width %", h: "Height %" }[k]}</label>
                                <input className="a-input px-2 py-1.5 text-xs" type="number" step={0.5} value={pct(p[k])} onChange={e => setPlacement(i, { [k]: clamp01((Number(e.target.value) || 0) / 100) } as Partial<Placement>)} />
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                    {example && (
                      <p className="mt-5 rounded-xl bg-paper px-4 py-3 text-sm">
                        Example: <b>{draft.name || "Garment"}</b> {inr(example.base)} + <b>{example.label}</b> {inr(example.print)} = <b className="text-accent-dark">{inr(example.base + example.print)}</b> per piece
                      </p>
                    )}
                  </section>
                </div>

                {/* Preview & mockups */}
                <div className="space-y-6 2xl:sticky 2xl:top-24 2xl:self-start">
                  <section className="a-card p-5">
                    <div className="flex items-center justify-between">
                      <h2 className="font-display text-lg font-bold">Live preview</h2>
                      <div className="flex gap-1">
                        {draft.colors.slice(0, 8).map(c => (
                          <button key={c.hex + c.name} onClick={() => setPreviewColor(c.hex)} title={c.name}
                            className={`h-6 w-6 rounded-full ring-1 ring-black/10 ${previewColor === c.hex ? "ring-2 ring-ink ring-offset-1" : ""}`} style={{ backgroundColor: c.hex }} />
                        ))}
                      </div>
                    </div>
                    <div className="mt-4 grid grid-cols-2 gap-3">
                      {(["front", "back"] as const).map(v => (
                        <div key={v}>
                          <ZonePreview draft={previewDraft} view={v} color={previewColor} frontFile={frontFile} backFile={backFile}
                            onChange={setPlacement} selected={selectedZone} onSelect={setSelectedZone} />
                          <p className="mt-1.5 text-center text-xs font-semibold uppercase tracking-wider text-muted">{v}</p>
                        </div>
                      ))}
                    </div>
                  </section>

                  <section className="a-card p-5">
                    <h2 className="font-display text-lg font-bold">Photo mockups <span className="text-xs font-normal text-muted">(optional)</span></h2>
                    <p className="mt-1 text-sm text-muted">Upload a <b>white</b> garment photo on a <b>transparent PNG</b> background ({MOCKUP_W}×{MOCKUP_H}px works best). It will be tinted to every colour automatically. Leave empty to use the built-in drawing.</p>
                    <div className="mt-4 grid grid-cols-2 gap-3">
                      {(["front", "back"] as const).map(v => {
                        const file = v === "front" ? frontFile : backFile;
                        const existing = v === "front" ? shownFront : shownBack;
                        return (
                          <div key={v} className="rounded-xl border border-dashed border-line p-3 text-center">
                            <p className="text-xs font-semibold uppercase tracking-wider text-muted">{v}</p>
                            <p className="mt-1 truncate text-xs">{file ? file.name : existing ? "Custom photo" : "Built-in drawing"}</p>
                            <label className="a-btn-outline mt-2 cursor-pointer px-3 py-1.5 text-xs">
                              <ImageUp className="h-3.5 w-3.5" /> Upload
                              <input type="file" accept="image/png,image/webp" className="hidden" onChange={e => {
                                const f = e.target.files?.[0] ?? null;
                                if (v === "front") { setFrontFile(f); setRemoveFront(false); } else { setBackFile(f); setRemoveBack(false); }
                                e.target.value = "";
                              }} />
                            </label>
                            {(file || existing) && (
                              <button className="mt-1 block w-full text-xs text-red-600 hover:underline" onClick={() => {
                                if (v === "front") { setFrontFile(null); setRemoveFront(true); } else { setBackFile(null); setRemoveBack(true); }
                              }}>Use built-in</button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </section>
                </div>
              </div>

              {/* Save bar */}
              <div className="sticky bottom-4 z-20 flex items-center justify-between gap-3 rounded-2xl border border-line bg-white/95 p-3 shadow-lg backdrop-blur">
                {draft.id ? (
                  <button onClick={remove} className="a-btn text-red-600 hover:bg-red-50"><Trash2 className="h-4 w-4" /> Delete</button>
                ) : <span />}
                <button onClick={save} disabled={saving} className="a-btn-accent px-6">
                  {saving ? <Loader2 className="h-4 w-4 animate-spin" /> : <Save className="h-4 w-4" />} Save changes
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </AdminLayout>
  );
};

export default GarmentManagement;
</script>
<script type="text/plain" data-path="src/pages/InvoiceEditor.tsx">
import { useEffect, useMemo, useState } from "react";
import { Link, useNavigate, useParams, useSearchParams } from "react-router-dom";
import { ArrowLeft, Loader2, Plus, Printer, Save, Target, Trash2 } from "lucide-react";
import AdminLayout from "../components/AdminLayout";
import { fetchInvoice, fetchNextInvoiceNumber, InvoiceStatus, saveInvoice } from "../services/invoiceService";
import { fetchOrder } from "../services/orderService";
import { fetchGarments } from "../services/garmentService";
import { fetchProducts } from "../services/productService";
import { getSiteSettings } from "../services/siteSettingsService";
import { computeTotals, discountForTarget, InvoiceItem, lineAmount } from "../utils/invoiceMath";
import { amountInWords } from "../utils/numberToWords";
import { inr } from "../utils/format";

const today = () => new Date().toISOString().slice(0, 10);
const blankItem = (): InvoiceItem => ({ description: "", hsn: "", unit: "pcs", qty: 1, rate: 0, discountPct: 0 });
const GST_PRESETS = [0, 5, 12, 18];

interface Suggestion { label: string; rate: number }

const InvoiceEditor = () => {
  const { id } = useParams<{ id: string }>();
  const [search] = useSearchParams();
  const orderId = search.get("order");
  const navigate = useNavigate();

  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [suggestions, setSuggestions] = useState<Suggestion[]>([]);
  const [target, setTarget] = useState("");

  const [invoiceNumber, setInvoiceNumber] = useState("");
  const [invoiceDate, setInvoiceDate] = useState(today());
  const [dueDate, setDueDate] = useState("");
  const [source, setSource] = useState<"website" | "manual">("manual");
  const [linkedOrder, setLinkedOrder] = useState<number | null>(null);
  const [customer, setCustomer] = useState({ customerName: "", customerPhone: "", customerEmail: "", customerAddress: "", customerGstin: "" });
  const [items, setItems] = useState<InvoiceItem[]>([blankItem()]);
  const [discountType, setDiscountType] = useState<"amount" | "percent">("amount");
  const [discountValue, setDiscountValue] = useState(0);
  const [taxPercent, setTaxPercent] = useState(0);
  const [taxMode, setTaxMode] = useState<"cgst_sgst" | "igst">("cgst_sgst");
  const [shipping, setShipping] = useState(0);
  const [roundOff, setRoundOff] = useState(true);
  const [amountPaid, setAmountPaid] = useState(0);
  const [status, setStatus] = useState<InvoiceStatus>("unpaid");
  const [notes, setNotes] = useState("");
  const [terms, setTerms] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const [settings, garments, products] = await Promise.all([
          getSiteSettings().catch(() => ({})),
          fetchGarments().catch(() => []),
          fetchProducts().catch(() => ({ products: [] })),
        ]);
        const productList: { name: string; price: number | string }[] = Array.isArray(products) ? products : products.products || [];
        const garmentList: { name: string; basePrice: number | string }[] = garments;
        setSuggestions([
          ...garmentList.map(g => ({ label: `Custom ${g.name}`, rate: Number(g.basePrice) || 0 })),
          ...productList.map(p => ({ label: p.name, rate: Number(p.price) || 0 })),
        ]);

        if (id) {
          const inv = await fetchInvoice(id);
          setInvoiceNumber(inv.invoiceNumber);
          setInvoiceDate(inv.invoiceDate);
          setDueDate(inv.dueDate || "");
          setSource(inv.source);
          setLinkedOrder(inv.orderId ?? null);
          setCustomer({
            customerName: inv.customerName, customerPhone: inv.customerPhone || "", customerEmail: inv.customerEmail || "",
            customerAddress: inv.customerAddress || "", customerGstin: inv.customerGstin || "",
          });
          setItems(inv.items.length ? inv.items.map(it => ({
            description: it.description, hsn: it.hsn || "", unit: it.unit || "pcs",
            qty: Number(it.qty) || 0, rate: Number(it.rate) || 0, discountPct: Number(it.discountPct) || 0,
          })) : [blankItem()]);
          setDiscountType(inv.discountType);
          setDiscountValue(Number(inv.discountValue) || 0);
          setTaxPercent(Number(inv.taxPercent) || 0);
          setTaxMode(inv.taxMode);
          setShipping(Number(inv.shipping) || 0);
          setRoundOff(inv.roundOff);
          setAmountPaid(Number(inv.amountPaid) || 0);
          setStatus(inv.status);
          setNotes(inv.notes || "");
          setTerms(inv.terms || "");
        } else {
          setInvoiceNumber(await fetchNextInvoiceNumber().catch(() => ""));
          setTerms((settings as { invoiceTerms?: string }).invoiceTerms || "");
          if (orderId) {
            const o = await fetchOrder(orderId);
            setSource("website");
            setLinkedOrder(o.id);
            setCustomer({
              customerName: o.customerName, customerPhone: o.phone, customerEmail: o.email,
              customerAddress: [o.address, [o.city, o.pincode].filter(Boolean).join(" - ")].filter(Boolean).join("\n"), customerGstin: "",
            });
            setItems([{
              description: `Custom ${o.garmentName} – ${o.colorName}, Size ${o.size} (${o.prints.map(p => p.label).join(", ")})`,
              hsn: "", unit: "pcs", qty: o.quantity, rate: Number(o.unitPrice) || 0, discountPct: 0,
            }]);
            setNotes(`Website order ${o.orderNumber}`);
          }
        }
      } catch (err) {
        setError((err as Error).message);
      } finally {
        setLoading(false);
      }
    })();
  }, [id, orderId]);

  const totals = useMemo(
    () => computeTotals(items, { discountType, discountValue, taxPercent, shipping, roundOff }),
    [items, discountType, discountValue, taxPercent, shipping, roundOff],
  );
  const balance = Math.max(0, totals.grandTotal - amountPaid);

  const setItem = (i: number, patch: Partial<InvoiceItem>) => setItems(list => list.map((it, j) => (j === i ? { ...it, ...patch } : it)));
  const onDescription = (i: number, value: string) => {
    const match = suggestions.find(s => s.label === value);
    setItem(i, match && !items[i].rate ? { description: value, rate: match.rate } : { description: value });
  };

  const applyTarget = () => {
    const t = Number(target);
    if (!t) return;
    setDiscountType("amount");
    setDiscountValue(discountForTarget(totals.subtotal, t, taxPercent, shipping));
    setRoundOff(true);
  };

  const save = async (thenPrint: boolean) => {
    if (!customer.customerName.trim()) { setError("Enter the customer name."); return; }
    if (!items.some(it => it.description.trim())) { setError("Add at least one item."); return; }
    setError("");
    setSaving(true);
    try {
      const saved = await saveInvoice(id ? Number(id) : null, {
        invoiceNumber, invoiceDate, dueDate: dueDate || null, source, orderId: linkedOrder,
        ...customer, items, discountType, discountValue, taxPercent, taxMode, shipping, roundOff, amountPaid, status, notes, terms,
      });
      navigate(thenPrint ? `/invoices/${saved.id}/print` : "/invoices");
    } catch (err) {
      setError((err as Error).message);
    } finally {
      setSaving(false);
    }
  };

  const num = (v: string) => Math.max(0, Number(v) || 0);

  if (loading) {
    return <AdminLayout title="Invoice"><div className="grid h-64 place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div></AdminLayout>;
  }

  return (
    <AdminLayout title={id ? `Edit ${invoiceNumber}` : "New invoice"}>
      <Link to="/invoices" className="mb-4 inline-flex items-center gap-1.5 text-sm text-muted hover:text-ink"><ArrowLeft className="h-4 w-4" /> All invoices</Link>

      <div className="grid gap-6 xl:grid-cols-[1fr_360px]">
        <div className="space-y-6">
          {/* Header */}
          <section className="a-card grid gap-4 p-5 sm:grid-cols-4 sm:p-6">
            <div><label className="a-label">Invoice no.</label><input className="a-input font-semibold" value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)} /></div>
            <div><label className="a-label">Invoice date</label><input type="date" className="a-input" value={invoiceDate} onChange={e => setInvoiceDate(e.target.value)} /></div>
            <div><label className="a-label">Due date</label><input type="date" className="a-input" value={dueDate} onChange={e => setDueDate(e.target.value)} /></div>
            <div>
              <label className="a-label">Order source</label>
              <select className="a-input" value={source} onChange={e => setSource(e.target.value as "website" | "manual")}>
                <option value="manual">Offline / direct</option>
                <option value="website">Website order</option>
              </select>
            </div>
          </section>

          {/* Customer */}
          <section className="a-card p-5 sm:p-6">
            <h2 className="font-display text-lg font-bold">Bill to</h2>
            <div className="mt-4 grid gap-4 sm:grid-cols-2">
              <div><label className="a-label">Customer / business name</label><input className="a-input" value={customer.customerName} onChange={e => setCustomer(c => ({ ...c, customerName: e.target.value }))} /></div>
              <div><label className="a-label">Phone</label><input className="a-input" value={customer.customerPhone} onChange={e => setCustomer(c => ({ ...c, customerPhone: e.target.value }))} /></div>
              <div><label className="a-label">Email</label><input className="a-input" value={customer.customerEmail} onChange={e => setCustomer(c => ({ ...c, customerEmail: e.target.value }))} /></div>
              <div><label className="a-label">GSTIN (optional)</label><input className="a-input uppercase" value={customer.customerGstin} onChange={e => setCustomer(c => ({ ...c, customerGstin: e.target.value.toUpperCase() }))} /></div>
              <div className="sm:col-span-2"><label className="a-label">Address</label><textarea rows={2} className="a-input resize-none" value={customer.customerAddress} onChange={e => setCustomer(c => ({ ...c, customerAddress: e.target.value }))} /></div>
            </div>
          </section>

          {/* Items */}
          <section className="a-card p-5 sm:p-6">
            <h2 className="font-display text-lg font-bold">Items</h2>
            <datalist id="invoice-products">
              {suggestions.map(s => <option key={s.label} value={s.label}>{inr(s.rate)}</option>)}
            </datalist>
            <div className="mt-4 hidden grid-cols-[1fr_80px_70px_100px_70px_100px_32px] gap-2 px-1 text-[11px] font-semibold uppercase tracking-wider text-muted lg:grid">
              <span>Product / description</span><span>HSN</span><span>Qty</span><span>Rate ₹</span><span>Disc %</span><span className="text-right">Amount</span><span />
            </div>
            <div className="mt-2 space-y-3">
              {items.map((it, i) => (
                <div key={i} className="grid grid-cols-6 gap-2 rounded-xl bg-paper/60 p-3 lg:grid-cols-[1fr_80px_70px_100px_70px_100px_32px] lg:items-center lg:bg-transparent lg:p-0">
                  <input list="invoice-products" className="a-input col-span-6 lg:col-span-1" placeholder="e.g. Custom Hoodie – Black, L" value={it.description} onChange={e => onDescription(i, e.target.value)} />
                  <input className="a-input col-span-2 lg:col-span-1" placeholder="HSN" value={it.hsn} onChange={e => setItem(i, { hsn: e.target.value })} />
                  <input className="a-input col-span-2 lg:col-span-1" type="number" min={0} value={it.qty} onChange={e => setItem(i, { qty: num(e.target.value) })} aria-label="Quantity" />
                  <input className="a-input col-span-2 lg:col-span-1" type="number" min={0} value={it.rate} onChange={e => setItem(i, { rate: num(e.target.value) })} aria-label="Rate" />
                  <input className="a-input col-span-2 lg:col-span-1" type="number" min={0} max={100} value={it.discountPct} onChange={e => setItem(i, { discountPct: Math.min(100, num(e.target.value)) })} aria-label="Discount percent" />
                  <p className="col-span-3 self-center text-right font-semibold lg:col-span-1">{inr(lineAmount(it), true)}</p>
                  <button onClick={() => setItems(list => (list.length > 1 ? list.filter((_, j) => j !== i) : [blankItem()]))}
                    className="col-span-1 grid place-items-center rounded-lg p-2 text-muted hover:bg-red-50 hover:text-red-600" aria-label="Remove item">
                    <Trash2 className="h-4 w-4" />
                  </button>
                </div>
              ))}
            </div>
            <button onClick={() => setItems(list => [...list, blankItem()])} className="a-btn-outline mt-4"><Plus className="h-4 w-4" /> Add item</button>
          </section>

          {/* Adjustments */}
          <section className="a-card grid gap-5 p-5 sm:grid-cols-2 sm:p-6">
            <div>
              <label className="a-label">Extra discount</label>
              <div className="flex gap-2">
                <div className="flex rounded-xl border border-line bg-paper p-0.5">
                  {(["amount", "percent"] as const).map(t => (
                    <button key={t} onClick={() => setDiscountType(t)} className={`rounded-lg px-3 text-sm font-semibold ${discountType === t ? "bg-white shadow-sm" : "text-muted"}`}>
                      {t === "amount" ? "₹" : "%"}
                    </button>
                  ))}
                </div>
                <input className="a-input" type="number" min={0} value={discountValue} onChange={e => setDiscountValue(num(e.target.value))} />
              </div>
            </div>
            <div>
              <label className="a-label">GST</label>
              <div className="flex flex-wrap gap-2">
                {GST_PRESETS.map(g => (
                  <button key={g} onClick={() => setTaxPercent(g)} className={`rounded-lg border px-3 py-2 text-sm font-semibold ${taxPercent === g ? "border-ink bg-ink text-white" : "border-line bg-white"}`}>{g}%</button>
                ))}
                <input className="a-input w-20" type="number" min={0} value={taxPercent} onChange={e => setTaxPercent(num(e.target.value))} aria-label="Custom GST percent" />
              </div>
              {taxPercent > 0 && (
                <div className="mt-2 flex gap-4 text-sm">
                  <label className="flex items-center gap-1.5"><input type="radio" checked={taxMode === "cgst_sgst"} onChange={() => setTaxMode("cgst_sgst")} /> CGST + SGST (same state)</label>
                  <label className="flex items-center gap-1.5"><input type="radio" checked={taxMode === "igst"} onChange={() => setTaxMode("igst")} /> IGST</label>
                </div>
              )}
            </div>
            <div><label className="a-label">Shipping / other charges (₹)</label><input className="a-input" type="number" min={0} value={shipping} onChange={e => setShipping(num(e.target.value))} /></div>
            <div><label className="a-label">Amount received (₹)</label><input className="a-input" type="number" min={0} value={amountPaid} onChange={e => setAmountPaid(num(e.target.value))} /></div>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={roundOff} onChange={e => setRoundOff(e.target.checked)} className="h-4 w-4 accent-ink" /> Round off to nearest rupee</label>
            <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={status === "draft"} onChange={e => setStatus(e.target.checked ? "draft" : "unpaid")} className="h-4 w-4 accent-ink" /> Save as draft</label>
            <div className="sm:col-span-2"><label className="a-label">Notes (printed on invoice)</label><textarea rows={2} className="a-input resize-none" value={notes} onChange={e => setNotes(e.target.value)} /></div>
            <div className="sm:col-span-2"><label className="a-label">Terms & conditions</label><textarea rows={3} className="a-input resize-none" value={terms} onChange={e => setTerms(e.target.value)} /></div>
          </section>
        </div>

        {/* Live summary */}
        <aside className="space-y-4 xl:sticky xl:top-24 xl:self-start">
          <div className="overflow-hidden rounded-2xl bg-ink text-white">
            <div className="space-y-2.5 p-5 text-sm">
              <p className="text-[11px] font-semibold uppercase tracking-widest text-white/40">Live total · {totals.totalQty} pcs</p>
              <Row label="Items total" value={inr(totals.gross, true)} />
              {totals.lineDiscounts > 0 && <Row label="Item discounts" value={`− ${inr(totals.lineDiscounts, true)}`} accent />}
              {totals.discountTotal > 0 && <Row label={`Extra discount${discountType === "percent" ? ` (${discountValue}%)` : ""}`} value={`− ${inr(totals.discountTotal, true)}`} accent />}
              <Row label="Taxable value" value={inr(totals.taxable, true)} />
              {taxPercent > 0 && (taxMode === "igst"
                ? <Row label={`IGST ${taxPercent}%`} value={inr(totals.taxTotal, true)} />
                : <>
                  <Row label={`CGST ${taxPercent / 2}%`} value={inr(totals.taxTotal / 2, true)} />
                  <Row label={`SGST ${taxPercent / 2}%`} value={inr(totals.taxTotal / 2, true)} />
                </>)}
              {totals.shipping > 0 && <Row label="Shipping" value={inr(totals.shipping, true)} />}
              {roundOff && totals.roundOffAmount !== 0 && <Row label="Round off" value={`${totals.roundOffAmount > 0 ? "+" : "−"} ${inr(Math.abs(totals.roundOffAmount), true)}`} />}
            </div>
            <div className="border-t border-white/10 bg-white/5 p-5">
              <p className="text-xs text-white/50">Grand total</p>
              <p className="font-display text-4xl font-bold">{inr(totals.grandTotal, !roundOff)}</p>
              <p className="mt-1 text-xs leading-snug text-white/50">{amountInWords(totals.grandTotal)}</p>
              {amountPaid > 0 && (
                <div className="mt-3 flex justify-between border-t border-white/10 pt-3 text-sm">
                  <span className="text-white/60">Balance due</span><span className="font-semibold">{inr(balance, true)}</span>
                </div>
              )}
            </div>
          </div>

          <div className="a-card p-4">
            <label className="a-label flex items-center gap-1.5"><Target className="h-3.5 w-3.5" /> Agreed a final price?</label>
            <div className="flex gap-2">
              <input className="a-input" type="number" min={0} placeholder={String(totals.grandTotal)} value={target} onChange={e => setTarget(e.target.value)} />
              <button onClick={applyTarget} className="a-btn-outline shrink-0">Apply</button>
            </div>
            <p className="mt-1.5 text-xs text-muted">Sets the extra discount so the grand total matches this amount.</p>
          </div>

          {error && <p className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{error}</p>}

          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => save(false)} disabled={saving} className="a-btn-outline">
              {saving ? <Loader2 className="h-4 w-4 animate-spin" /> : <Save className="h-4 w-4" />} Save
            </button>
            <button onClick={() => save(true)} disabled={saving} className="a-btn-accent">
              <Printer className="h-4 w-4" /> Save & print
            </button>
          </div>
        </aside>
      </div>
    </AdminLayout>
  );
};

const Row = ({ label, value, accent = false }: { label: string; value: string; accent?: boolean }) => (
  <div className="flex justify-between gap-4">
    <span className="text-white/60">{label}</span>
    <span className={accent ? "text-accent" : ""}>{value}</span>
  </div>
);

export default InvoiceEditor;
</script>
<script type="text/plain" data-path="src/pages/InvoiceList.tsx">
import { useCallback, useEffect, useState } from "react";
import { Link, useNavigate } from "react-router-dom";
import { FileText, Loader2, Pencil, Plus, Printer, Search, Settings2, Trash2, X } from "lucide-react";
import AdminLayout from "../components/AdminLayout";
import { deleteInvoice, fetchInvoices, Invoice, INVOICE_STATUSES, InvoiceStatus } from "../services/invoiceService";
import { getSiteSettings, updateSiteSettings } from "../services/siteSettingsService";
import { formatDate, inr } from "../utils/format";

function InvoiceSettingsModal({ onClose }: { onClose: () => void }) {
  const [form, setForm] = useState({ gstin: "", bankDetails: "", upiId: "", invoiceTerms: "" });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    getSiteSettings()
      .then(s => setForm({ gstin: s.gstin || "", bankDetails: s.bankDetails || "", upiId: s.upiId || "", invoiceTerms: s.invoiceTerms || "" }))
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, []);

  const save = async () => {
    setSaving(true);
    setError("");
    try {
      const fd = new FormData();
      Object.entries(form).forEach(([k, v]) => fd.append(k, v));
      await updateSiteSettings(fd);
      onClose();
    } catch (err) {
      setError((err as Error).message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 grid place-items-center bg-ink/40 p-4 backdrop-blur-sm" onClick={onClose}>
      <div className="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <h2 className="font-display text-xl font-bold">Invoice settings</h2>
          <button onClick={onClose} className="rounded-full p-1.5 hover:bg-paper" aria-label="Close"><X className="h-5 w-5" /></button>
        </div>
        <p className="mt-1 text-sm text-muted">Printed on every invoice. Company name, logo, address and phone come from Site Settings.</p>
        {loading ? <div className="grid h-40 place-items-center"><Loader2 className="h-5 w-5 animate-spin" /></div> : (
          <div className="mt-5 space-y-4">
            <div><label className="a-label">Your GSTIN</label><input className="a-input uppercase" value={form.gstin} onChange={e => setForm(f => ({ ...f, gstin: e.target.value.toUpperCase() }))} placeholder="27ABCDE1234F1Z5" /></div>
            <div><label className="a-label">UPI ID</label><input className="a-input" value={form.upiId} onChange={e => setForm(f => ({ ...f, upiId: e.target.value }))} placeholder="business@upi" /></div>
            <div><label className="a-label">Bank details</label><textarea rows={3} className="a-input resize-none" value={form.bankDetails} onChange={e => setForm(f => ({ ...f, bankDetails: e.target.value }))} placeholder={"Bank: HDFC Bank\nA/C: 50100XXXXXXX\nIFSC: HDFC0000XXX"} /></div>
            <div><label className="a-label">Default terms</label><textarea rows={3} className="a-input resize-none" value={form.invoiceTerms} onChange={e => setForm(f => ({ ...f, invoiceTerms: e.target.value }))} /></div>
            {error && <p className="text-sm text-red-600">{error}</p>}
            <button onClick={save} disabled={saving} className="a-btn-primary w-full">{saving && <Loader2 className="h-4 w-4 animate-spin" />} Save settings</button>
          </div>
        )}
      </div>
    </div>
  );
}

const InvoiceList = () => {
  const navigate = useNavigate();
  const [invoices, setInvoices] = useState<Invoice[]>([]);
  const [summary, setSummary] = useState({ billed: 0, received: 0, outstanding: 0 });
  const [status, setStatus] = useState<InvoiceStatus | "">("");
  const [query, setQuery] = useState("");
  const [page, setPage] = useState(1);
  const [pages, setPages] = useState(1);
  const [loading, setLoading] = useState(true);
  const [showSettings, setShowSettings] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const data = await fetchInvoices({ page, status, q: query.trim() });
      setInvoices(data.invoices);
      setSummary(data.summary);
      setPages(data.pages || 1);
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  }, [page, status, query]);

  useEffect(() => {
    const t = setTimeout(load, 250);
    return () => clearTimeout(t);
  }, [load]);

  const remove = async (inv: Invoice) => {
    if (!confirm(`Delete invoice ${inv.invoiceNumber}? This cannot be undone.`)) return;
    try {
      await deleteInvoice(inv.id);
      load();
    } catch (err) {
      alert((err as Error).message);
    }
  };

  return (
    <AdminLayout
      title="Invoices"
      actions={<Link to="/invoices/new" className="a-btn-accent"><Plus className="h-4 w-4" /> <span className="hidden sm:inline">New invoice</span></Link>}
    >
      <div className="grid gap-4 sm:grid-cols-3">
        <div className="a-card p-5"><p className="a-label">Total billed</p><p className="font-display text-3xl font-bold">{inr(summary.billed)}</p></div>
        <div className="a-card p-5"><p className="a-label">Received</p><p className="font-display text-3xl font-bold text-emerald-700">{inr(summary.received)}</p></div>
        <div className="a-card p-5"><p className="a-label">Outstanding</p><p className="font-display text-3xl font-bold text-accent-dark">{inr(summary.outstanding)}</p></div>
      </div>

      <div className="mt-6 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-wrap gap-2">
          {[{ value: "" as const, label: "All" }, ...INVOICE_STATUSES].map(s => (
            <button key={s.value} onClick={() => { setStatus(s.value); setPage(1); }}
              className={`rounded-full border px-3.5 py-1.5 text-sm font-medium transition ${status === s.value ? "border-ink bg-ink text-white" : "border-line bg-white hover:border-ink"}`}>
              {s.label}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          <label className="relative flex-1 lg:w-72">
            <Search className="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" />
            <input className="a-input pl-10" placeholder="Invoice no, customer, phone…" value={query} onChange={e => { setQuery(e.target.value); setPage(1); }} />
          </label>
          <button onClick={() => setShowSettings(true)} className="a-btn-outline" title="Invoice settings"><Settings2 className="h-4 w-4" /></button>
        </div>
      </div>

      <div className="a-card mt-4 overflow-hidden">
        {loading && invoices.length === 0 ? (
          <div className="grid h-48 place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div>
        ) : invoices.length === 0 ? (
          <div className="py-16 text-center">
            <FileText className="mx-auto h-10 w-10 text-muted" strokeWidth={1.25} />
            <p className="mt-3 font-semibold">No invoices yet</p>
            <p className="text-sm text-muted">Create one for a walk-in order, or from a website order.</p>
            <Link to="/invoices/new" className="a-btn-primary mt-4"><Plus className="h-4 w-4" /> New invoice</Link>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[760px] text-sm">
              <thead className="border-b border-line bg-paper/60 text-left text-[11px] uppercase tracking-wider text-muted">
                <tr>
                  <th className="px-4 py-3 font-semibold">Invoice</th>
                  <th className="px-4 py-3 font-semibold">Customer</th>
                  <th className="px-4 py-3 font-semibold">Source</th>
                  <th className="px-4 py-3 text-right font-semibold">Amount</th>
                  <th className="px-4 py-3 font-semibold">Status</th>
                  <th className="px-4 py-3" />
                </tr>
              </thead>
              <tbody className="divide-y divide-line">
                {invoices.map(inv => {
                  const s = INVOICE_STATUSES.find(x => x.value === inv.status) ?? INVOICE_STATUSES[1];
                  return (
                    <tr key={inv.id} className="transition hover:bg-paper/60">
                      <td className="cursor-pointer px-4 py-3" onClick={() => navigate(`/invoices/${inv.id}/print`)}>
                        <p className="font-semibold">{inv.invoiceNumber}</p>
                        <p className="text-xs text-muted">{formatDate(inv.invoiceDate)}</p>
                      </td>
                      <td className="px-4 py-3"><p className="font-medium">{inv.customerName}</p><p className="text-xs text-muted">{inv.customerPhone}</p></td>
                      <td className="px-4 py-3">
                        <span className={`rounded-full px-2 py-0.5 text-xs font-medium ${inv.source === "website" ? "bg-accent-soft text-accent-dark" : "bg-paper text-muted"}`}>
                          {inv.source === "website" ? "Website" : "Offline"}
                        </span>
                      </td>
                      <td className="px-4 py-3 text-right">
                        <p className="font-semibold">{inr(inv.grandTotal)}</p>
                        {Number(inv.amountPaid) > 0 && inv.status !== "paid" && <p className="text-xs text-muted">paid {inr(inv.amountPaid)}</p>}
                      </td>
                      <td className="px-4 py-3"><span className={`inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${s.tone}`}>{s.label}</span></td>
                      <td className="px-4 py-3">
                        <div className="flex justify-end gap-1">
                          <Link to={`/invoices/${inv.id}/print`} className="rounded-lg p-2 text-muted hover:bg-paper hover:text-ink" title="View / print"><Printer className="h-4 w-4" /></Link>
                          <Link to={`/invoices/${inv.id}/edit`} className="rounded-lg p-2 text-muted hover:bg-paper hover:text-ink" title="Edit"><Pencil className="h-4 w-4" /></Link>
                          <button onClick={() => remove(inv)} className="rounded-lg p-2 text-muted hover:bg-red-50 hover:text-red-600" title="Delete"><Trash2 className="h-4 w-4" /></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {pages > 1 && (
        <div className="mt-4 flex items-center justify-end gap-2 text-sm">
          <button disabled={page <= 1} onClick={() => setPage(p => p - 1)} className="a-btn-outline px-3 py-1.5">Previous</button>
          <span className="text-muted">Page {page} of {pages}</span>
          <button disabled={page >= pages} onClick={() => setPage(p => p + 1)} className="a-btn-outline px-3 py-1.5">Next</button>
        </div>
      )}

      {showSettings && <InvoiceSettingsModal onClose={() => setShowSettings(false)} />}
    </AdminLayout>
  );
};

export default InvoiceList;
</script>
<script type="text/plain" data-path="src/pages/InvoicePrint.tsx">
import { useEffect, useState } from "react";
import { Link, useParams } from "react-router-dom";
import { ArrowLeft, Loader2, MessageCircle, Pencil, Printer } from "lucide-react";
import { fetchInvoice, Invoice } from "../services/invoiceService";
import { getSiteSettings } from "../services/siteSettingsService";
import { getImageUrl } from "../utils/imageUtils";
import { formatDate, inr, waNumber } from "../utils/format";
import { amountInWords } from "../utils/numberToWords";

interface Settings {
  companyName?: string;
  logoUrl?: string;
  address?: string;
  phone?: string;
  email?: string;
  gstin?: string;
  bankDetails?: string;
  upiId?: string;
}

/** A4 printable invoice. Use the browser's "Save as PDF" to share a PDF. */
const InvoicePrint = () => {
  const { id } = useParams<{ id: string }>();
  const [invoice, setInvoice] = useState<Invoice | null>(null);
  const [settings, setSettings] = useState<Settings>({});
  const [error, setError] = useState("");

  useEffect(() => {
    Promise.all([fetchInvoice(id!), getSiteSettings().catch(() => ({}))])
      .then(([inv, s]) => { setInvoice(inv); setSettings(s); })
      .catch(err => setError(err.message));
  }, [id]);

  useEffect(() => {
    if (invoice) document.title = `${invoice.invoiceNumber} – ${invoice.customerName}`;
    return () => { document.title = "Admin"; };
  }, [invoice]);

  if (error) return <div className="grid min-h-screen place-items-center text-red-600">{error}</div>;
  if (!invoice) return <div className="grid min-h-screen place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div>;

  const brand = settings.companyName || "Astitva Creations";
  const tax = Number(invoice.taxPercent) || 0;
  const taxTotal = Number(invoice.taxTotal) || 0;
  const grand = Number(invoice.grandTotal) || 0;
  const paid = Number(invoice.amountPaid) || 0;
  const balance = Math.max(0, grand - paid);
  const gross = invoice.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.rate) || 0), 0);
  const subtotal = Number(invoice.subtotal) || 0;
  const title = tax > 0 && settings.gstin ? "Tax Invoice" : "Invoice";
  const hasHsn = invoice.items.some(it => it.hsn);
  const hasLineDiscount = invoice.items.some(it => Number(it.discountPct) > 0);

  const share = invoice.customerPhone
    ? `https://wa.me/${waNumber(invoice.customerPhone)}?text=${encodeURIComponent(
      `Hi ${invoice.customerName}, here are your invoice details from ${brand}:\n\nInvoice: ${invoice.invoiceNumber}\nDate: ${formatDate(invoice.invoiceDate)}\nAmount: ${inr(grand, true)}${balance > 0 && balance < grand ? `\nBalance due: ${inr(balance, true)}` : ""}${settings.upiId ? `\n\nPay via UPI: ${settings.upiId}` : ""}\n\nThank you for your business!`,
    )}`
    : "";

  return (
    <div className="min-h-screen bg-paper-deep py-6 print:bg-white print:py-0">
      {/* Toolbar */}
      <div className="no-print mx-auto mb-5 flex max-w-[210mm] flex-wrap items-center justify-between gap-3 px-4">
        <Link to="/invoices" className="inline-flex items-center gap-1.5 text-sm font-medium text-muted hover:text-ink"><ArrowLeft className="h-4 w-4" /> Invoices</Link>
        <div className="flex gap-2">
          <Link to={`/invoices/${invoice.id}/edit`} className="a-btn-outline"><Pencil className="h-4 w-4" /> Edit</Link>
          {share && <a href={share} target="_blank" rel="noreferrer" className="a-btn bg-[#25D366] text-white hover:bg-[#1ebe5a]"><MessageCircle className="h-4 w-4" /> WhatsApp</a>}
          <button onClick={() => window.print()} className="a-btn-primary"><Printer className="h-4 w-4" /> Print / PDF</button>
        </div>
      </div>

      {/* A4 sheet */}
      <article className="print-page relative mx-auto flex min-h-[297mm] w-full max-w-[210mm] flex-col overflow-hidden bg-white text-[12.5px] leading-relaxed text-ink shadow-xl">
        {invoice.status === "paid" && (
          <div className="pointer-events-none absolute right-10 top-44 rotate-[-14deg] rounded-xl border-4 border-emerald-600/70 px-5 py-1.5 font-display text-4xl font-extrabold uppercase tracking-widest text-emerald-600/70">Paid</div>
        )}
        {invoice.status === "cancelled" && (
          <div className="pointer-events-none absolute right-10 top-44 rotate-[-14deg] rounded-xl border-4 border-red-600/60 px-5 py-1.5 font-display text-4xl font-extrabold uppercase tracking-widest text-red-600/60">Cancelled</div>
        )}

        {/* Brand header */}
        <header className="flex items-start justify-between gap-6 bg-ink px-10 py-8 text-white">
          <div className="flex items-center gap-4">
            {settings.logoUrl ? (
              <img src={getImageUrl(settings.logoUrl)} alt="" className="h-16 w-16 rounded-xl bg-white object-contain p-1" />
            ) : (
              <div className="grid h-16 w-16 place-items-center rounded-xl bg-accent font-display text-3xl font-extrabold">{brand.charAt(0)}</div>
            )}
            <div>
              <h1 className="font-display text-2xl font-extrabold uppercase tracking-tight">{brand}</h1>
              <p className="text-[11px] uppercase tracking-[0.2em] text-white/50">Custom Printed Apparel</p>
            </div>
          </div>
          <div className="text-right">
            <p className="font-display text-3xl font-bold uppercase tracking-wide text-accent">{title}</p>
            <p className="mt-1 font-semibold">{invoice.invoiceNumber}</p>
          </div>
        </header>

        <div className="flex-1 px-10 py-8">
          {/* Parties */}
          <section className="grid grid-cols-3 gap-6 border-b border-line pb-6">
            <div>
              <p className="mb-1.5 text-[10px] font-bold uppercase tracking-[0.18em] text-muted">From</p>
              <p className="font-semibold">{brand}</p>
              {settings.address && <p className="whitespace-pre-line text-muted">{settings.address}</p>}
              {settings.phone && <p className="text-muted">Ph: {settings.phone}</p>}
              {settings.email && <p className="text-muted">{settings.email}</p>}
              {settings.gstin && <p className="mt-1 font-semibold">GSTIN: {settings.gstin}</p>}
            </div>
            <div>
              <p className="mb-1.5 text-[10px] font-bold uppercase tracking-[0.18em] text-muted">Bill to</p>
              <p className="font-semibold">{invoice.customerName}</p>
              {invoice.customerAddress && <p className="whitespace-pre-line text-muted">{invoice.customerAddress}</p>}
