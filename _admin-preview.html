              {invoice.customerPhone && <p className="text-muted">Ph: {invoice.customerPhone}</p>}
              {invoice.customerEmail && <p className="text-muted">{invoice.customerEmail}</p>}
              {invoice.customerGstin && <p className="mt-1 font-semibold">GSTIN: {invoice.customerGstin}</p>}
            </div>
            <div className="space-y-1 text-right">
              <p><span className="text-muted">Invoice date:</span> <b>{formatDate(invoice.invoiceDate)}</b></p>
              {invoice.dueDate && <p><span className="text-muted">Due date:</span> <b>{formatDate(invoice.dueDate)}</b></p>}
              <p><span className="text-muted">Order type:</span> <b>{invoice.source === "website" ? "Website" : "Direct"}</b></p>
            </div>
          </section>

          {/* Items */}
          <table className="mt-6 w-full border-collapse">
            <thead>
              <tr className="border-b-2 border-ink text-left text-[10px] font-bold uppercase tracking-[0.14em]">
                <th className="w-8 py-2.5">#</th>
                <th className="py-2.5">Description</th>
                {hasHsn && <th className="py-2.5">HSN</th>}
                <th className="py-2.5 text-right">Qty</th>
                <th className="py-2.5 text-right">Rate</th>
                {hasLineDiscount && <th className="py-2.5 text-right">Disc.</th>}
                <th className="py-2.5 text-right">Amount</th>
              </tr>
            </thead>
            <tbody>
              {invoice.items.map((it, i) => {
                const amount = (Number(it.qty) || 0) * (Number(it.rate) || 0) * (1 - (Number(it.discountPct) || 0) / 100);
                return (
                  <tr key={i} className="border-b border-line align-top">
                    <td className="py-3 text-muted">{i + 1}</td>
                    <td className="py-3 pr-4 font-medium">{it.description}</td>
                    {hasHsn && <td className="py-3 text-muted">{it.hsn}</td>}
                    <td className="py-3 text-right">{Number(it.qty)} {it.unit}</td>
                    <td className="py-3 text-right">{inr(it.rate, true)}</td>
                    {hasLineDiscount && <td className="py-3 text-right">{Number(it.discountPct) ? `${Number(it.discountPct)}%` : "—"}</td>}
                    <td className="py-3 text-right font-semibold">{inr(amount, true)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          {/* Totals */}
          <section className="mt-6 grid grid-cols-2 gap-10">
            <div className="space-y-4">
              <div>
                <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-muted">Amount in words</p>
                <p className="mt-1 font-medium">{amountInWords(grand)}</p>
              </div>
              {(settings.bankDetails || settings.upiId) && (
                <div className="rounded-xl bg-paper p-4">
                  <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-muted">Payment details</p>
                  {settings.bankDetails && <p className="mt-1 whitespace-pre-line">{settings.bankDetails}</p>}
                  {settings.upiId && <p className="mt-1">UPI: <b>{settings.upiId}</b></p>}
                </div>
              )}
              {invoice.notes && (
                <div>
                  <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-muted">Notes</p>
                  <p className="mt-1 whitespace-pre-line">{invoice.notes}</p>
                </div>
              )}
            </div>
            <div className="space-y-1.5">
              <Line label="Sub total" value={inr(hasLineDiscount ? gross : subtotal, true)} />
              {hasLineDiscount && <Line label="Item discounts" value={`− ${inr(gross - subtotal, true)}`} />}
              {Number(invoice.discountTotal) > 0 && (
                <Line label={`Discount${invoice.discountType === "percent" ? ` (${Number(invoice.discountValue)}%)` : ""}`} value={`− ${inr(invoice.discountTotal, true)}`} />
              )}
              {tax > 0 && (invoice.taxMode === "igst"
                ? <Line label={`IGST @ ${tax}%`} value={inr(taxTotal, true)} />
                : <>
                  <Line label={`CGST @ ${tax / 2}%`} value={inr(taxTotal / 2, true)} />
                  <Line label={`SGST @ ${tax / 2}%`} value={inr(taxTotal / 2, true)} />
                </>)}
              {Number(invoice.shipping) > 0 && <Line label="Shipping & handling" value={inr(invoice.shipping, true)} />}
              {Number(invoice.roundOffAmount) !== 0 && <Line label="Round off" value={inr(invoice.roundOffAmount, true)} />}
              <div className="mt-2 flex items-baseline justify-between rounded-xl bg-ink px-4 py-3 text-white">
                <span className="text-xs font-bold uppercase tracking-[0.18em]">Total</span>
                <span className="font-display text-2xl font-bold">{inr(grand, true)}</span>
              </div>
              {paid > 0 && (
                <>
                  <Line label="Amount received" value={inr(paid, true)} />
                  <Line label="Balance due" value={inr(balance, true)} bold />
                </>
              )}
            </div>
          </section>

          {/* Terms & signature */}
          <section className="mt-10 grid grid-cols-2 items-end gap-10">
            <div>
              {invoice.terms && (
                <>
                  <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-muted">Terms & conditions</p>
                  <ol className="mt-1 list-decimal space-y-0.5 pl-4 text-[11px] text-muted">
                    {invoice.terms.split("\n").filter(Boolean).map((t, i) => <li key={i}>{t}</li>)}
                  </ol>
                </>
              )}
            </div>
            <div className="text-right">
              <p className="text-[11px] text-muted">For <b className="text-ink">{brand}</b></p>
              <div className="mt-14 inline-block border-t border-ink px-6 pt-1.5 text-[11px] font-semibold">Authorised Signatory</div>
            </div>
          </section>
        </div>

        <footer className="flex items-center justify-between border-t-4 border-accent bg-paper px-10 py-4 text-[11px] text-muted">
          <span>Thank you for your business!</span>
          <span>{[settings.phone, settings.email].filter(Boolean).join("  ·  ")}</span>
        </footer>
      </article>
    </div>
  );
};

const Line = ({ label, value, bold = false }: { label: string; value: string; bold?: boolean }) => (
  <div className={`flex justify-between px-1 ${bold ? "font-bold" : ""}`}>
    <span className="text-muted">{label}</span>
    <span>{value}</span>
  </div>
);

export default InvoicePrint;
</script>
<script type="text/plain" data-path="src/pages/Login.tsx">
import { useState, useEffect } from "react";
import { API_URL } from "../utils/apiUtils";
import { getSiteSettings } from "../services/siteSettingsService";
import { getImageUrl } from "../utils/imageUtils";

const Login = () => {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const [companyName, setCompanyName] = useState("Astitva Creations");
  const [logoUrl, setLogoUrl] = useState("");

  useEffect(() => {
    const fetchSettings = async () => {
      try {
        const data = await getSiteSettings();
        if (data.companyName) setCompanyName(data.companyName);
        if (data.logoUrl) setLogoUrl(getImageUrl(data.logoUrl));
      } catch (err) {
        console.error("Login settings error:", err);
      }
    };
    fetchSettings();
  }, []);

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setError("");
    setLoading(true);

    try {
      const res = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Login failed");

      sessionStorage.setItem("token", data.token);
      window.location.href = "/";
    } catch (err: any) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div 
      className="min-h-screen flex items-center justify-center relative bg-slate-100"
      style={{
        backgroundImage: 'url("/login-bg.jpg")',
        backgroundSize: 'cover',
        backgroundPosition: 'center',
      }}
    >
      
      {/* Decorative Overlay to ensure text readability */}
      <div className="absolute inset-0 bg-white/40 backdrop-blur-sm"></div>

      <div className="w-full max-w-md rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] bg-white/90 backdrop-blur-xl border border-white/50 p-10 flex flex-col items-center relative z-10">
        {/* Brand/Logo Accent */}
        <div className="flex flex-col items-center mb-8">
          {logoUrl ? (
            <img
              src={logoUrl}
              alt="Logo"
              className="h-16 w-auto object-contain mb-4 drop-shadow-md"
            />
          ) : (
            <div className="bg-gradient-to-tr from-indigo-600 to-blue-500 w-16 h-16 rounded-2xl flex items-center justify-center text-white font-extrabold text-3xl mb-4 shadow-lg shadow-indigo-500/30 ring-4 ring-white">
              {companyName.charAt(0)}
            </div>
          )}
          <h2 className="text-3xl font-extrabold text-gray-900 mb-1 tracking-tight text-center">{companyName}</h2>
          <div className="text-sm text-indigo-600 font-bold tracking-widest uppercase">Admin Portal</div>
        </div>
        
        {/* Form */}
        <form onSubmit={handleSubmit} className="space-y-5 w-full">
          <div>
            <label className="block mb-1.5 text-sm font-bold text-gray-700">Email Address</label>
            <input
              type="email"
              autoComplete="username"
              className="w-full px-5 py-3.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 transition text-sm bg-white text-gray-900 placeholder-gray-400 font-medium"
              value={email}
              onChange={e => setEmail(e.target.value)}
              required
              placeholder="admin@example.com"
            />
          </div>
          <div>
            <label className="block mb-1.5 text-sm font-bold text-gray-700">Password</label>
            <input
              type="password"
              autoComplete="current-password"
              className="w-full px-5 py-3.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 transition text-sm bg-white text-gray-900 placeholder-gray-400 font-medium"
              value={password}
              onChange={e => setPassword(e.target.value)}
              required
              placeholder="••••••••"
            />
          </div>
          {error && (
            <div className="text-red-600 text-center text-sm rounded-lg bg-red-50 border border-red-200 py-3 mt-2 font-medium">
              {error}
            </div>
          )}
          <button
            type="submit"
            className="w-full py-3.5 mt-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-xl font-bold text-base hover:from-indigo-700 hover:to-blue-700 transition-all shadow-lg shadow-indigo-200 active:scale-[0.98]"
            disabled={loading}
          >
            {loading ? "Authenticating..." : "Sign In"}
          </button>
        </form>
        
        {/* Footer */}
        <div className="mt-8 text-xs text-gray-400 text-center font-medium">
          © {new Date().getFullYear()} {companyName}. All rights reserved.
        </div>
      </div>
    </div>
  );
};

export default Login;
</script>
<script type="text/plain" data-path="src/pages/ManageBanners.tsx">
import { useState, useEffect } from "react";
import AdminLayout from "../components/AdminLayout";
import * as bannerService from "../services/bannerService";
import { getImageUrl } from "../utils/imageUtils";

const ManageBanners = () => {
    const [banners, setBanners] = useState<any[]>([]);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState("");
    const [editingBanner, setEditingBanner] = useState<any>(null);
    const [isFormOpen, setIsFormOpen] = useState(false);

    // Form State
    const [title, setTitle] = useState("");
    const [subtitle, setSubtitle] = useState("");
    const [link, setLink] = useState("");
    const [order, setOrder] = useState(0);
    const [isActive, setIsActive] = useState(true);
    const [imageFile, setImageFile] = useState<File | null>(null);
    const [preview, setPreview] = useState("");

    useEffect(() => {
        loadBanners();
    }, []);

    const loadBanners = async () => {
        try {
            setLoading(true);
            const data = await bannerService.fetchBanners();
            setBanners(data);
        } catch (err: any) {
            setError(err.message);
        } finally {
            setLoading(false);
        }
    };

    const handleEdit = (banner: any) => {
        setEditingBanner(banner);
        setTitle(banner.title || "");
        setSubtitle(banner.subtitle || "");
        setLink(banner.link || "");
        setOrder(banner.order || 0);
        setIsActive(banner.isActive);
        setPreview(banner.imageUrl || "");
        setImageFile(null);
        setIsFormOpen(true);
    };

    const handleAddNew = () => {
        setEditingBanner(null);
        setTitle("");
        setSubtitle("");
        setLink("");
        setOrder(0);
        setIsActive(true);
        setPreview("");
        setImageFile(null);
        setIsFormOpen(true);
    };

    const handleImageChange = (e: React.ChangeEvent<HTMLInputElement>) => {
        const file = e.target.files?.[0];
        if (file) {
            setImageFile(file);
            const reader = new FileReader();
            reader.onloadend = () => setPreview(reader.result as string);
            reader.readAsDataURL(file);
        }
    };

    const handleSubmit = async (e: React.FormEvent) => {
        e.preventDefault();
        try {
            const formData = new FormData();
            formData.append("title", title);
            formData.append("subtitle", subtitle);
            formData.append("link", link);
            formData.append("order", order.toString());
            formData.append("isActive", isActive.toString());
            if (imageFile) {
                formData.append("image", imageFile);
            }

            if (editingBanner) {
                await bannerService.updateBanner(editingBanner.id || editingBanner._id, formData);
            } else {
                await bannerService.addBanner(formData);
            }

            setIsFormOpen(false);
            loadBanners();
        } catch (err: any) {
            alert(err.message);
        }
    };

    const handleDelete = async (id: string) => {
        if (window.confirm("Are you sure you want to delete this banner?")) {
            try {
                await bannerService.deleteBanner(id);
                loadBanners();
            } catch (err: any) {
                alert(err.message);
            }
        }
    };

    const handleToggleActive = async (banner: any) => {
        try {
            const formData = new FormData();
            formData.append("title", banner.title || "");
            formData.append("subtitle", banner.subtitle || "");
            formData.append("link", banner.link || "");
            formData.append("order", banner.order.toString());
            formData.append("isActive", (!banner.isActive).toString());

            await bannerService.updateBanner(banner.id || banner._id, formData);
            loadBanners();
        } catch (err: any) {
            alert("Failed to toggle banner status: " + err.message);
        }
    };

    return (
        <AdminLayout>
            <div className="flex items-center justify-between mb-8">
                <div className="flex items-center gap-3">
                    <span className="inline-block w-1 h-8 rounded-full bg-blue-600"></span>
                    <h2 className="text-3xl font-bold text-blue-900 tracking-tight">Manage Banners</h2>
                </div>
                <button
                    onClick={handleAddNew}
                    className="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition"
                >
                    Add New Banner
                </button>
            </div>

            {isFormOpen && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
                        <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                            <h3 className="text-xl font-bold text-gray-800">
                                {editingBanner ? "Edit Banner" : "Add New Banner"}
                            </h3>
                            <button onClick={() => setIsFormOpen(false)} className="text-gray-500 hover:text-gray-700">
                                ✕
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                    <input
                                        type="text"
                                        value={title}
                                        onChange={(e) => setTitle(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Subtitle</label>
                                    <input
                                        type="text"
                                        value={subtitle}
                                        onChange={(e) => setSubtitle(e.target.value)}
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Link (Optional)</label>
                                    <input
                                        type="text"
                                        value={link}
                                        onChange={(e) => setLink(e.target.value)}
                                        placeholder="/products"
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Order</label>
                                    <input
                                        type="number"
                                        value={order}
                                        onChange={(e) => setOrder(parseInt(e.target.value))}
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <input
                                    type="checkbox"
                                    id="isActive"
                                    checked={isActive}
                                    onChange={(e) => setIsActive(e.target.checked)}
                                    className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500"
                                />
                                <label htmlFor="isActive" className="text-sm font-medium text-gray-700">Active</label>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Banner Image *</label>
                                <input
                                    type="file"
                                    accept="image/*"
                                    onChange={handleImageChange}
                                    className="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                                />
                                {preview && (
                                    <div className="mt-4">
                                        <img src={getImageUrl(preview)} alt="Preview" className="w-full h-48 object-cover rounded-lg border border-gray-200" />
                                    </div>
                                )}
                            </div>

                            <div className="pt-4 flex gap-3">
                                <button
                                    type="submit"
                                    className="flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
                                >
                                    {editingBanner ? "Update Banner" : "Create Banner"}
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setIsFormOpen(false)}
                                    className="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-200 transition"
                                >
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            )}

            <div className="bg-white rounded-3xl shadow-xl overflow-hidden">
                {loading ? (
                    <p className="p-8 text-center text-gray-500">Loading banners...</p>
                ) : error ? (
                    <p className="p-8 text-center text-red-500">{error}</p>
                ) : banners.length === 0 ? (
                    <p className="p-8 text-center text-gray-500">No banners found. Add one to get started!</p>
                ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
                        {banners.map((banner) => (
                            <div key={banner.id || banner._id} className="bg-gray-50 rounded-xl overflow-hidden shadow-sm border border-gray-100 group">
                                <div className="relative h-48">
                                    <img src={getImageUrl(banner.imageUrl)} alt={banner.title} className="w-full h-full object-cover" />
                                    <div className="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button
                                            onClick={() => handleEdit(banner)}
                                            className="p-2 bg-white rounded-full shadow-md text-blue-600 hover:text-blue-800"
                                        >
                                            ✎
                                        </button>
                                        <button
                                            onClick={() => handleDelete(banner.id || banner._id)}
                                            className="p-2 bg-white rounded-full shadow-md text-red-600 hover:text-red-800"
                                        >
                                            🗑
                                        </button>
                                    </div>
                                    {!banner.isActive && (
                                        <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                                            <span className="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Inactive</span>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4">
                                    <h3 className="font-bold text-gray-900 truncate">{banner.title || "No Title"}</h3>
                                    <p className="text-sm text-gray-500 truncate">{banner.subtitle || "No Subtitle"}</p>
                                    <div className="mt-3 flex justify-between items-center text-xs">
                                        <span className="text-gray-400">Order: {banner.order}</span>
                                        <button
                                            onClick={() => handleToggleActive(banner)}
                                            className={`px-3 py-1 rounded-full text-xs font-semibold transition ${banner.isActive
                                                    ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                                                    : 'bg-green-100 text-green-700 hover:bg-green-200'
                                                }`}
                                        >
                                            {banner.isActive ? 'Deactivate' : 'Activate'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        </AdminLayout>
    );
};

export default ManageBanners;
</script>
<script type="text/plain" data-path="src/pages/ManageProducts.tsx">
import { useState, useEffect } from "react";
import { fetchProducts, addProduct, updateProduct, deleteProduct } from "../services/productService";
import AdminLayout from "../components/AdminLayout";
import ProductForm from "../components/ProductForm";
import ProductTable from "../components/ProductTable";
import { Plus } from "lucide-react";

const ManageProducts = () => {
  const [products, setProducts] = useState<any[]>([]);
  const [viewMode, setViewMode] = useState<"list" | "form">("list");
  const [editingProduct, setEditingProduct] = useState<any>(null);
  const [loading, setLoading] = useState<boolean>(true);
  const [error, setError] = useState<string>("");

  useEffect(() => {
    const loadProducts = async () => {
      try {
        setLoading(true);
        const fetchedProducts = await fetchProducts();
        console.log("API response:", fetchedProducts);

        let productsArray: any[] = [];

        if (!Array.isArray(fetchedProducts)) {
          // If products array is nested inside 'products' key
          if (Array.isArray(fetchedProducts.products)) {
            productsArray = fetchedProducts.products;
          } else {
            setError("Invalid products data format");
            setLoading(false);
            return;
          }
        } else {
          productsArray = fetchedProducts;
        }

        const cleanedProducts = productsArray.map((p: any) => {
          let parsedTags: string[] = [];

          if (Array.isArray(p.tags)) {
            // Parse stringified tags inside the array if any
            parsedTags = p.tags.flatMap((tag: any) => {
              try {
                const parsed = JSON.parse(tag);
                return Array.isArray(parsed) ? parsed : [parsed];
              } catch {
                return [tag]; // Normal string
              }
            });
          } else if (typeof p.tags === "string") {
            try {
              parsedTags = JSON.parse(p.tags);
              if (!Array.isArray(parsedTags)) parsedTags = [];
            } catch {
              parsedTags = p.tags.split(",").map((t: string) => t.trim());
            }
          }

          return {
            ...p,
            tags: parsedTags,
            name: p.name?.trim(),
            description: p.description?.trim(),
            category: typeof p.category === 'object' ? p.category : p.category?.trim(),
            materialType: p.materialType?.trim(),
            size: p.size?.trim(),
            color: p.color?.trim(),
          };
        });

        setProducts(cleanedProducts);
        setLoading(false);
      } catch (err: any) {
        setLoading(false);
        setError(err.message);
      }
    };
    loadProducts();
  }, []);

  const handleAddNew = () => {
    setEditingProduct(null);
    setViewMode("form");
  };

  const handleEdit = (product: any) => {
    setEditingProduct(product);
    setViewMode("form");
  };

  const handleDelete = async (id: number) => {
    if (!window.confirm("Are you sure you want to delete this product?")) {
      return;
    }

    try {
      await deleteProduct(id);
      setProducts((prev) => prev.filter((p) => p.id !== id));
      alert("Product deleted successfully!");
    } catch (err: any) {
      alert("Failed to delete product: " + err.message);
    }
  };

  const handleFormSubmit = async (form: any) => {
    try {
      if (editingProduct) {
        const updated = await updateProduct(editingProduct.id, form);
        setProducts((prev) =>
          prev.map((p) => (p.id === updated.id ? updated : p))
        );
      } else {
        const added = await addProduct(form);
        setProducts((prev) => [added, ...prev]);
      }
      setEditingProduct(null);
      setViewMode("list");
    } catch (err: any) {
      alert(`Error: ${err.message}`);
    }
  };

  return (
    <AdminLayout>
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3">
          <span className="inline-block w-1 h-8 rounded-full bg-blue-600"></span>
          <h2 className="text-3xl font-bold text-blue-900 tracking-tight">Manage Products</h2>
        </div>

        {viewMode === "list" && (
          <button
            onClick={handleAddNew}
            className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold transition-all shadow-lg hover:shadow-blue-200 active:scale-95"
          >
            <Plus size={20} />
            Add New Product
          </button>
        )}
      </div>

      <div className="w-full max-w-7xl pb-16 min-h-[75vh]">
        <div className="bg-white rounded-3xl shadow-2xl px-10 py-12">
          <div className="flex items-center gap-3 mb-8">
            <span className="inline-block w-1 h-8 rounded-full bg-blue-600"></span>
            <h2 className="text-2xl font-bold text-blue-900 tracking-tight">
              {viewMode === "form"
                ? editingProduct
                  ? "Edit Product"
                  : "Add New Product"
                : "All Products"}
            </h2>
          </div>

          {loading && <p>Loading products...</p>}
          {error && <p className="text-red-600">Error: {error}</p>}

          {viewMode === "form" && (
            <ProductForm
              initialValues={editingProduct}
              onSubmit={handleFormSubmit}
              mode={editingProduct ? "edit" : "add"}
              onCancel={() => {
                setEditingProduct(null);
                setViewMode("list");
              }}
            />
          )}

          {viewMode === "list" && (
            <ProductTable
              products={products}
              onEdit={handleEdit}
              onDelete={handleDelete}
            />
          )}
        </div>
      </div>
    </AdminLayout>
  );
};

export default ManageProducts;
</script>
<script type="text/plain" data-path="src/pages/OrderManagement.tsx">
import { useCallback, useEffect, useState } from "react";
import { useNavigate } from "react-router-dom";
import {
  BadgeCheck, Download, FileText, Loader2, Mail, MessageCircle, Phone, Search, ShoppingBag, Trash2, X,
} from "lucide-react";
import AdminLayout from "../components/AdminLayout";
import {
  deleteOrder, fetchOrders, fetchOrderStats, Order, ORDER_STATUSES, OrderStatus, updateOrder,
} from "../services/orderService";
import { getImageUrl } from "../utils/imageUtils";
import { formatDateTime, inr, waNumber } from "../utils/format";

const StatusBadge = ({ status }: { status: OrderStatus }) => {
  const s = ORDER_STATUSES.find(x => x.value === status) ?? ORDER_STATUSES[0];
  return <span className={`inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${s.tone}`}>{s.label}</span>;
};

function OrderDrawer({ order, onClose, onChanged, onDeleted }: {
  order: Order;
  onClose: () => void;
  onChanged: (o: Order) => void;
  onDeleted: (id: number) => void;
}) {
  const navigate = useNavigate();
  const [notes, setNotes] = useState(order.adminNotes || "");
  const [saving, setSaving] = useState(false);

  useEffect(() => setNotes(order.adminNotes || ""), [order.id, order.adminNotes]);

  const patch = async (data: { status?: OrderStatus; adminNotes?: string }) => {
    setSaving(true);
    try {
      onChanged(await updateOrder(order.id, data));
    } catch (err) {
      alert((err as Error).message);
    } finally {
      setSaving(false);
    }
  };

  const remove = async () => {
    if (!confirm(`Delete order ${order.orderNumber}? This cannot be undone.`)) return;
    try {
      await deleteOrder(order.id);
      onDeleted(order.id);
    } catch (err) {
      alert((err as Error).message);
    }
  };

  const wa = `https://wa.me/${waNumber(order.phone)}?text=${encodeURIComponent(`Hi ${order.customerName.split(" ")[0]}, this is regarding your order ${order.orderNumber} (${order.garmentName}, total ${inr(order.total)}).`)}`;

  return (
    <div className="fixed inset-0 z-50 flex justify-end bg-ink/40 backdrop-blur-sm" onClick={onClose}>
      <aside className="h-full w-full max-w-2xl overflow-y-auto bg-paper shadow-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 z-10 flex items-center justify-between border-b border-line bg-white px-6 py-4">
          <div>
            <p className="text-xs text-muted">{formatDateTime(order.createdAt)}</p>
            <h2 className="font-display text-xl font-bold">{order.orderNumber}</h2>
          </div>
          <button onClick={onClose} className="rounded-full p-2 hover:bg-paper" aria-label="Close"><X className="h-5 w-5" /></button>
        </div>

        <div className="space-y-5 p-6">
          {/* Status */}
          <div className="a-card p-4">
            <p className="a-label">Status</p>
            <div className="flex flex-wrap gap-2">
              {ORDER_STATUSES.map(s => (
                <button key={s.value} disabled={saving} onClick={() => patch({ status: s.value })}
                  className={`rounded-full border px-3 py-1.5 text-xs font-semibold transition ${order.status === s.value ? "border-ink bg-ink text-white" : "border-line bg-white hover:border-ink"}`}>
                  {s.label}
                </button>
              ))}
            </div>
          </div>

          {/* Previews */}
          <div className="grid grid-cols-2 gap-3">
            {(["front", "back"] as const).map(v => order.previews?.[v] ? (
              <a key={v} href={getImageUrl(order.previews[v])} target="_blank" rel="noreferrer" className="a-card overflow-hidden">
                <img src={getImageUrl(order.previews[v])} alt={`${v} preview`} className="w-full" />
                <p className="py-2 text-center text-xs font-semibold uppercase tracking-wider text-muted">{v}</p>
              </a>
            ) : (
              <div key={v} className="a-card grid place-items-center p-6 text-xs text-muted">No {v} print</div>
            ))}
          </div>

          {/* Product */}
          <div className="a-card divide-y divide-line">
            <div className="flex items-center gap-3 p-4">
              <span className="h-10 w-10 shrink-0 rounded-full ring-1 ring-black/10" style={{ backgroundColor: order.colorHex || "#fff" }} />
              <div className="flex-1">
                <p className="font-semibold">{order.garmentName}</p>
                <p className="text-sm text-muted">{order.colorName} · Size {order.size} · Qty {order.quantity}</p>
              </div>
            </div>
            {order.prints.map(p => (
              <div key={p.key} className="flex items-center gap-3 p-4">
                <img src={getImageUrl(p.artworkUrl)} alt="" className="h-14 w-14 shrink-0 rounded-lg bg-paper object-contain p-1 ring-1 ring-line" />
                <div className="min-w-0 flex-1">
                  <p className="text-sm font-semibold">{p.label} <span className="font-normal capitalize text-muted">· {p.view}</span></p>
                  <p className="truncate text-xs text-muted">
                    {p.kind === "text" ? `Text “${p.text}” · ${p.font} · ${p.color}` : "Uploaded image"} · size {Math.round(p.transform.scale * 100)}% of area{p.transform.angle ? ` · rotated ${p.transform.angle}°` : ""}
                  </p>
                </div>
                <a href={getImageUrl(p.artworkUrl)} target="_blank" rel="noreferrer" download className="a-btn-outline px-3 py-1.5 text-xs">
                  <Download className="h-3.5 w-3.5" /> Artwork
                </a>
              </div>
            ))}
            <div className="space-y-1.5 p-4 text-sm">
              <div className="flex justify-between"><span className="text-muted">Base</span><span>{inr(order.basePrice)}</span></div>
              <div className="flex justify-between"><span className="text-muted">Prints</span><span>+{inr(order.printsPrice)}</span></div>
              {Number(order.sizeExtra) > 0 && <div className="flex justify-between"><span className="text-muted">Size extra</span><span>+{inr(order.sizeExtra)}</span></div>}
              <div className="flex justify-between"><span className="text-muted">Per piece × {order.quantity}</span><span>{inr(order.unitPrice)}</span></div>
              <div className="flex justify-between border-t border-line pt-2 text-base font-bold"><span>Total</span><span>{inr(order.total)}</span></div>
            </div>
          </div>

          {/* Customer */}
          <div className="a-card p-4">
            <div className="flex items-center justify-between">
              <p className="font-semibold">{order.customerName}</p>
              {order.emailVerified && <span className="inline-flex items-center gap-1 text-xs font-semibold text-emerald-700"><BadgeCheck className="h-3.5 w-3.5" /> Email verified</span>}
            </div>
            <p className="mt-2 whitespace-pre-line text-sm text-muted">{[order.address, [order.city, order.pincode].filter(Boolean).join(" - ")].filter(Boolean).join("\n")}</p>
            {order.notes && <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-900"><b>Customer note:</b> {order.notes}</p>}
            <div className="mt-4 flex flex-wrap gap-2">
              <a href={wa} target="_blank" rel="noreferrer" className="a-btn bg-[#25D366] text-white hover:bg-[#1ebe5a]"><MessageCircle className="h-4 w-4" /> WhatsApp</a>
              <a href={`tel:${order.phone}`} className="a-btn-outline"><Phone className="h-4 w-4" /> {order.phone}</a>
              <a href={`mailto:${order.email}`} className="a-btn-outline"><Mail className="h-4 w-4" /> Email</a>
            </div>
          </div>

          {/* Notes */}
          <div className="a-card p-4">
            <label className="a-label">Internal notes</label>
            <textarea rows={3} className="a-input resize-none" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Payment received via UPI, courier AWB…" />
            <button disabled={saving || notes === (order.adminNotes || "")} onClick={() => patch({ adminNotes: notes })} className="a-btn-primary mt-2">Save notes</button>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3">
            <button onClick={remove} className="a-btn text-red-600 hover:bg-red-50"><Trash2 className="h-4 w-4" /> Delete order</button>
            <button onClick={() => navigate(`/invoices/new?order=${order.id}`)} className="a-btn-accent"><FileText className="h-4 w-4" /> Create invoice</button>
          </div>
        </div>
      </aside>
    </div>
  );
}

const OrderManagement = () => {
  const [orders, setOrders] = useState<Order[]>([]);
  const [stats, setStats] = useState<{ total: number; revenue: number; byStatus: Partial<Record<OrderStatus, number>> } | null>(null);
  const [status, setStatus] = useState<OrderStatus | "">("");
  const [query, setQuery] = useState("");
  const [page, setPage] = useState(1);
  const [pages, setPages] = useState(1);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState<Order | null>(null);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const [list, s] = await Promise.all([fetchOrders({ page, status, q: query.trim() }), fetchOrderStats()]);
      setOrders(list.orders);
      setPages(list.pages || 1);
      setStats(s);
    } catch (err) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  }, [page, status, query]);

  useEffect(() => {
    const t = setTimeout(load, 250);
    return () => clearTimeout(t);
  }, [load]);

  const onChanged = (o: Order) => {
    setSelected(o);
    setOrders(list => list.map(x => (x.id === o.id ? o : x)));
    fetchOrderStats().then(setStats).catch(() => undefined);
  };

  return (
    <AdminLayout title="Website Orders">
      <div className="grid gap-4 sm:grid-cols-3">
        <div className="a-card p-5"><p className="a-label">Total orders</p><p className="font-display text-3xl font-bold">{stats?.total ?? "—"}</p></div>
        <div className="a-card p-5"><p className="a-label">Awaiting action</p><p className="font-display text-3xl font-bold text-accent">{stats?.byStatus.new ?? 0}</p></div>
        <div className="a-card p-5"><p className="a-label">Order value (excl. cancelled)</p><p className="font-display text-3xl font-bold">{inr(stats?.revenue ?? 0)}</p></div>
      </div>

      <div className="mt-6 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div className="flex flex-wrap gap-2">
          {[{ value: "" as const, label: "All" }, ...ORDER_STATUSES].map(s => {
            const count = s.value ? stats?.byStatus[s.value as OrderStatus] : undefined;
            return (
              <button key={s.value} onClick={() => { setStatus(s.value); setPage(1); }}
                className={`rounded-full border px-3.5 py-1.5 text-sm font-medium transition ${status === s.value ? "border-ink bg-ink text-white" : "border-line bg-white hover:border-ink"}`}>
                {s.label}
                {count ? <span className="ml-1.5 opacity-60">{count}</span> : null}
              </button>
            );
          })}
        </div>
        <label className="relative lg:w-80">
          <Search className="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" />
          <input className="a-input pl-10" placeholder="Search order no, name, phone…" value={query} onChange={e => { setQuery(e.target.value); setPage(1); }} />
        </label>
      </div>

      <div className="a-card mt-4 overflow-hidden">
        {loading && orders.length === 0 ? (
          <div className="grid h-48 place-items-center"><Loader2 className="h-6 w-6 animate-spin text-muted" /></div>
        ) : orders.length === 0 ? (
          <div className="py-16 text-center">
            <ShoppingBag className="mx-auto h-10 w-10 text-muted" strokeWidth={1.25} />
            <p className="mt-3 font-semibold">No orders yet</p>
            <p className="text-sm text-muted">Orders from the website design studio will appear here.</p>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full min-w-[760px] text-sm">
              <thead className="border-b border-line bg-paper/60 text-left text-[11px] uppercase tracking-wider text-muted">
                <tr>
                  <th className="px-4 py-3 font-semibold">Order</th>
                  <th className="px-4 py-3 font-semibold">Customer</th>
                  <th className="px-4 py-3 font-semibold">Product</th>
                  <th className="px-4 py-3 text-right font-semibold">Total</th>
                  <th className="px-4 py-3 font-semibold">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-line">
                {orders.map(o => (
                  <tr key={o.id} onClick={() => setSelected(o)} className="cursor-pointer transition hover:bg-paper/60">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-3">
                        {o.previews?.front
                          ? <img src={getImageUrl(o.previews.front)} alt="" className="h-12 w-11 rounded-lg bg-paper object-cover" />
                          : <span className="h-12 w-11 rounded-lg bg-paper" />}
                        <div>
                          <p className="font-semibold">{o.orderNumber}</p>
                          <p className="text-xs text-muted">{formatDateTime(o.createdAt)}</p>
                        </div>
                      </div>
                    </td>
                    <td className="px-4 py-3"><p className="font-medium">{o.customerName}</p><p className="text-xs text-muted">{o.phone}</p></td>
                    <td className="px-4 py-3">
                      <p className="font-medium">{o.garmentName} <span className="text-muted">× {o.quantity}</span></p>
                      <p className="text-xs text-muted">{o.colorName} · {o.size} · {o.prints.map(p => p.label.split(" ")[0]).join(", ")}</p>
                    </td>
                    <td className="px-4 py-3 text-right font-semibold">{inr(o.total)}</td>
                    <td className="px-4 py-3"><StatusBadge status={o.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {pages > 1 && (
        <div className="mt-4 flex items-center justify-end gap-2 text-sm">
          <button disabled={page <= 1} onClick={() => setPage(p => p - 1)} className="a-btn-outline px-3 py-1.5">Previous</button>
          <span className="text-muted">Page {page} of {pages}</span>
          <button disabled={page >= pages} onClick={() => setPage(p => p + 1)} className="a-btn-outline px-3 py-1.5">Next</button>
        </div>
      )}

      {selected && (
        <OrderDrawer
          order={selected}
          onClose={() => setSelected(null)}
          onChanged={onChanged}
          onDeleted={(id) => { setSelected(null); setOrders(list => list.filter(o => o.id !== id)); load(); }}
        />
      )}
    </AdminLayout>
  );
};

export default OrderManagement;
</script>
<script type="text/plain" data-path="src/pages/ProfilePage.tsx">
import { useState, useEffect } from "react";
import AdminLayout from "../components/AdminLayout";
import { getMe, changePassword, listAdmins, createAdmin, deleteAdmin } from "../services/profileService";
import { User, KeyRound, UserPlus, Shield, Trash2, CheckCircle2, AlertCircle } from "lucide-react";

export default function ProfilePage() {
  const [currentUser, setCurrentUser] = useState<any>(null);
  const [admins, setAdmins] = useState<any[]>([]);
  const [loading, setLoading] = useState(true);

  // Password state
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [passMsg, setPassMsg] = useState<{ type: "success" | "error"; text: string } | null>(null);
  const [passSubmitting, setPassSubmitting] = useState(false);

  // New admin state
  const [newUsername, setNewUsername] = useState("");
  const [newEmail, setNewEmail] = useState("");
  const [newAdminPassword, setNewAdminPassword] = useState("");
  const [adminMsg, setAdminMsg] = useState<{ type: "success" | "error"; text: string } | null>(null);
  const [adminSubmitting, setAdminSubmitting] = useState(false);

  const fetchData = async () => {
    try {
      const me = await getMe();
      setCurrentUser(me);
      const list = await listAdmins();
      setAdmins(list);
    } catch (err: any) {
      console.error(err);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchData();
  }, []);

  const handlePasswordSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setPassMsg(null);
    if (newPassword !== confirmPassword) {
      setPassMsg({ type: "error", text: "New passwords do not match!" });
      return;
    }
    if (newPassword.length < 6) {
      setPassMsg({ type: "error", text: "Password must be at least 6 characters!" });
      return;
    }

    setPassSubmitting(true);
    try {
      await changePassword(currentPassword, newPassword);
      setPassMsg({ type: "success", text: "Password changed successfully!" });
      setCurrentPassword("");
      setNewPassword("");
      setConfirmPassword("");
    } catch (err: any) {
      setPassMsg({ type: "error", text: err.message || "Failed to update password" });
    } finally {
      setPassSubmitting(false);
    }
  };

  const handleCreateAdminSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setAdminMsg(null);
    setAdminSubmitting(true);
    try {
      await createAdmin(newUsername, newEmail, newAdminPassword);
      setAdminMsg({ type: "success", text: `Admin user '${newUsername}' created successfully!` });
      setNewUsername("");
      setNewEmail("");
      setNewAdminPassword("");
      fetchData();
    } catch (err: any) {
      setAdminMsg({ type: "error", text: err.message || "Failed to create admin" });
    } finally {
      setAdminSubmitting(false);
    }
  };

  const handleDeleteAdmin = async (id: number, username: string) => {
    if (!window.confirm(`Are you sure you want to delete admin '${username}'?`)) return;
    try {
      await deleteAdmin(id);
      fetchData();
    } catch (err: any) {
      alert(err.message || "Failed to delete admin");
    }
  };

  if (loading) {
    return (
      <AdminLayout>
        <div className="flex items-center justify-center min-h-[400px]">
          <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-600"></div>
        </div>
      </AdminLayout>
    );
  }

  return (
    <AdminLayout>
      <div className="max-w-6xl mx-auto space-y-8">
        <div>
          <h1 className="text-3xl font-extrabold text-gray-900">Admin Profile & Management</h1>
          <p className="text-sm text-gray-500 mt-1">Manage your credentials and secondary admin accounts</p>
        </div>

        {/* ── Section 1: Current User Profile Card ────────────────────────────────── */}
        <div className="bg-white rounded-2xl p-6 shadow-md border border-gray-100 flex items-center justify-between">
          <div className="flex items-center gap-5">
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 text-white font-black text-2xl flex items-center justify-center shadow-lg">
              {currentUser?.username?.[0]?.toUpperCase() || "A"}
            </div>
            <div>
              <div className="flex items-center gap-3">
                <h2 className="text-xl font-bold text-gray-800">{currentUser?.username}</h2>
                {currentUser?.isMaster ? (
                  <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 border border-amber-300">
                    <Shield size={12} /> MASTER ADMIN
                  </span>
                ) : (
                  <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">
                    <User size={12} /> Standard Admin
                  </span>
                )}
              </div>
              <p className="text-sm text-gray-500 mt-1">{currentUser?.email}</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
          {/* ── Section 2: Change Password ────────────────────────────────────── */}
          <div className="bg-white rounded-2xl p-6 shadow-md border border-gray-100 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                <KeyRound className="text-indigo-600" size={20} />
                <h3 className="text-lg font-bold text-gray-800">Change Password</h3>
              </div>

              {passMsg && (
                <div
                  className={`p-3.5 rounded-xl mb-4 text-xs font-semibold flex items-center gap-2 ${
                    passMsg.type === "success" ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-rose-50 text-rose-700 border border-rose-200"
                  }`}
                >
                  {passMsg.type === "success" ? <CheckCircle2 size={16} /> : <AlertCircle size={16} />}
                  {passMsg.text}
                </div>
              )}

              <form onSubmit={handlePasswordSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Current Password</label>
                  <input
                    type="password"
                    required
                    value={currentPassword}
                    onChange={(e) => setCurrentPassword(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">New Password</label>
                  <input
                    type="password"
                    required
                    value={newPassword}
                    onChange={(e) => setNewPassword(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Confirm New Password</label>
                  <input
                    type="password"
                    required
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={passSubmitting}
                  className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition duration-150 disabled:opacity-50 text-sm mt-2"
                >
                  {passSubmitting ? "Updating..." : "Update Password"}
                </button>
              </form>
            </div>
          </div>

          {/* ── Section 3: Create Secondary Admin ─────────────────────────────── */}
          <div className="bg-white rounded-2xl p-6 shadow-md border border-gray-100 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                <UserPlus className="text-indigo-600" size={20} />
                <h3 className="text-lg font-bold text-gray-800">Create New Admin Account</h3>
              </div>

              {adminMsg && (
                <div
                  className={`p-3.5 rounded-xl mb-4 text-xs font-semibold flex items-center gap-2 ${
                    adminMsg.type === "success" ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-rose-50 text-rose-700 border border-rose-200"
                  }`}
                >
                  {adminMsg.type === "success" ? <CheckCircle2 size={16} /> : <AlertCircle size={16} />}
                  {adminMsg.text}
                </div>
              )}

              <form onSubmit={handleCreateAdminSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Username</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. client_admin"
                    value={newUsername}
                    onChange={(e) => setNewUsername(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                  <input
                    type="email"
                    required
                    placeholder="e.g. client@astitvacreations.com"
                    value={newEmail}
                    onChange={(e) => setNewEmail(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-700 mb-1">Initial Password</label>
                  <input
                    type="password"
                    required
                    placeholder="Set starting password"
                    value={newAdminPassword}
                    onChange={(e) => setNewAdminPassword(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>

                <button
                  type="submit"
                  disabled={adminSubmitting}
                  className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:bg-emerald-700 transition duration-150 disabled:opacity-50 text-sm mt-2"
                >
                  {adminSubmitting ? "Creating..." : "Create Admin User"}
                </button>
              </form>
            </div>
          </div>
        </div>

        {/* ── Section 4: All Admin Accounts Table ─────────────────────────────────── */}
        <div className="bg-white rounded-2xl p-6 shadow-md border border-gray-100">
          <h3 className="text-lg font-bold text-gray-800 mb-4 pb-3 border-b border-gray-100">All Registered Admins</h3>

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="border-b border-gray-200 text-xs font-bold text-gray-500 uppercase tracking-wider">
                  <th className="py-3 px-4">User</th>
                  <th className="py-3 px-4">Email</th>
                  <th className="py-3 px-4">Role</th>
                  <th className="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100 text-sm">
                {admins.map((admin) => (
                  <tr key={admin.id} className="hover:bg-gray-50/80 transition-colors">
                    <td className="py-3 px-4 font-semibold text-gray-800 flex items-center gap-2">
                      <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-xs">
                        {admin.username[0]?.toUpperCase()}
                      </div>
                      {admin.username}
                    </td>
                    <td className="py-3 px-4 text-gray-600">{admin.email}</td>
                    <td className="py-3 px-4">
                      {admin.isMaster ? (
                        <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-amber-100 text-amber-800 border border-amber-300">
                          <Shield size={10} /> MASTER
                        </span>
                      ) : (

<script type="text/plain" data-path="src/pages/ReviewManagement.tsx">
import { useState, useEffect } from 'react';
import { Trash2, Star, Package } from 'lucide-react';
import * as reviewService from '../services/reviewService';
import AdminLayout from '../components/AdminLayout';

interface Review {
    _id: string;
    productId: {
        _id: string;
        name: string;
        imageUrl: string;
    };
    customerName: string;
    rating: number;
    comment: string;
    createdAt: string;
}

const ReviewManagement = () => {
    const [reviews, setReviews] = useState<Review[]>([]);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState('');

    useEffect(() => {
        fetchReviews();
    }, []);

    const fetchReviews = async () => {
        try {
            console.log('Fetching reviews...');
            const response = await reviewService.getAllReviews();
            console.log('Review response:', response);

            // Handle different response formats
            const reviewsData = response.data || response || [];
            console.log('Reviews data:', reviewsData);

            setReviews(Array.isArray(reviewsData) ? reviewsData : []);
            setLoading(false);
        } catch (err: any) {
            console.error('Review fetch error:', err);
            setError(`Failed to load reviews: ${err.message}`);
            setLoading(false);
        }
    };

    const handleDelete = async (id: string) => {
        if (!confirm('Are you sure you want to delete this review?')) return;

        try {
            await reviewService.deleteReview(id);
            setReviews(reviews.filter(review => review._id !== id));
        } catch (err) {
            alert('Failed to delete review');
        }
    };

    if (loading) return (
        <AdminLayout>
            <div className="flex justify-center items-center h-64">
                <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
        </AdminLayout>
    );

    if (error) return (
        <AdminLayout>
            <div className="text-red-500 text-center">{error}</div>
        </AdminLayout>
    );

    return (
        <AdminLayout>
            <div className="p-6">
                <div className="mb-6">
                    <h1 className="text-3xl font-bold text-gray-900">Review Management</h1>
                    <p className="text-gray-600 mt-2">Manage customer reviews for all products</p>
                </div>

                <div className="bg-white rounded-lg shadow overflow-hidden">
                    <div className="px-6 py-4 border-b border-gray-200 bg-gray-50">
                        <div className="flex items-center justify-between">
                            <h2 className="text-lg font-semibold text-gray-900">
                                All Reviews ({reviews.length})
                            </h2>
                        </div>
                    </div>

                    {reviews.length === 0 ? (
                        <div className="p-12 text-center text-gray-500">
                            <Star className="w-12 h-12 mx-auto mb-4 text-gray-300" />
                            <p>No reviews yet</p>
                        </div>
                    ) : (
                        <div className="divide-y divide-gray-200">
                            {reviews.map((review) => (
                                <div key={review._id} className="p-6 hover:bg-gray-50 transition-colors">
                                    <div className="flex gap-4">
                                        <div className="flex-shrink-0">
                                            <div className="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center">
                                                {review.productId ? (
                                                    <img
                                                        src={review.productId.imageUrl || 'https://via.placeholder.com/80'}
                                                        alt={review.productId.name}
                                                        className="w-full h-full object-cover"
                                                    />
                                                ) : (
                                                    <Package className="w-8 h-8 text-gray-400" />
                                                )}
                                            </div>
                                        </div>

                                        <div className="flex-1">
                                            <div className="flex items-start justify-between mb-2">
                                                <div>
                                                    <h3 className="font-semibold text-gray-900">
                                                        {review.productId ? review.productId.name : 'Product Deleted'}
                                                    </h3>
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <div className="flex text-yellow-400">
                                                            {[...Array(5)].map((_, i) => (
                                                                <Star
                                                                    key={i}
                                                                    size={16}
                                                                    fill={i < review.rating ? "currentColor" : "none"}
                                                                    className={i < review.rating ? "text-yellow-400" : "text-gray-300"}
                                                                />
                                                            ))}
                                                        </div>
                                                        <span className="text-sm text-gray-600">
                                                            by <strong>{review.customerName}</strong>
                                                        </span>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => handleDelete(review._id)}
                                                    className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                                    title="Delete review"
                                                >
                                                    <Trash2 size={18} />
                                                </button>
                                            </div>

                                            <p className="text-gray-700 mb-2">{review.comment}</p>

                                            <p className="text-sm text-gray-500">
                                                {new Date(review.createdAt).toLocaleDateString('en-US', {
                                                    year: 'numeric',
                                                    month: 'long',
                                                    day: 'numeric',
                                                    hour: '2-digit',
                                                    minute: '2-digit'
                                                })}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        </AdminLayout>
    );
};

export default ReviewManagement;
</script>

        feature2Title: data.feature2Title || "Precision DTG & Screen Printing",
        feature2Desc: data.feature2Desc || "Vibrant, crack-resistant eco-friendly prints with high detail.",
        feature3Title: data.feature3Title || "Bio-Washed & Pre-Shrunk",
        feature3Desc: data.feature3Desc || "Ultra-soft fabric feel with zero color fading or shrinkage.",
        feature4Title: data.feature4Title || "Custom Apparel & Bulk Orders",
        feature4Desc: data.feature4Desc || "Bespoke oversized fits, custom embroidery, and corporate branding.",

    const file = e.target.files?.[0];

    setLogoFile(file);
    const reader = new FileReader();
    reader.onloadend = () => setLogoPreview(reader.result as string);

          formData.append(key, val);

        aboutImage2: updated.aboutImage2 || "",

        feature3Title: updated.feature3Title || "",
        feature3Desc: updated.feature3Desc || "",
        feature4Title: updated.feature4Title || "",
        feature4Desc: updated.feature4Desc || "",

      setAboutImage2Preview(getImageUrl(updated.aboutImage2));

      setLogoFile(null);
      setAboutImage1File(null);
      setAboutImage2File(null);

      setSaved(true);
      setTimeout(() => setSaved(false), 4000);

  taxTotal: number | string;

  grandTotal: number | string;
  amountPaid: number | string;
  status: InvoiceStatus;
  notes?: string;
  terms?: string;
  createdAt: string;
}

  { value: "partial", label: "Partly paid", tone: "bg-amber-50 text-amber-700" },
  { value: "paid", label: "Paid", tone: "bg-emerald-50 text-emerald-700" },

    throw new Error(err.message || fallback);
  }
  return res.json();
}

export async function fetchInvoices(params: { page?: number; status?: string; q?: string } = {}): Promise<{
  total: number; pages: number; page: number; invoices: Invoice[];

  return json(await fetchWithAuth(`/invoices/${id}`, { method: "DELETE" }), "Failed to delete invoice");

<script type="text/plain" data-path="src/utils/apiUtils.ts">
export const API_URL = import.meta.env.VITE_API_URL || "http://localhost:5000/api";

export async function fetchWithAuth(endpoint: string, options: RequestInit = {}) {
    const token = sessionStorage.getItem("token");
    if (!token && window.location.pathname !== "/login") {
        window.location.href = "/login";
        throw new Error("User not authenticated");
    }

    const headers: Record<string, string> = {
        ...(options.headers as Record<string, string> || {}),
        Authorization: `Bearer ${token}`,
    };

    // Ensure Content-Type is set for JSON bodies if not already set (and not FormData)
    if (!(options.body instanceof FormData) && !headers["Content-Type"]) {
        // @ts-ignore
        headers["Content-Type"] = "application/json";
    }

    const config = {
        ...options,
        headers,
    };

    const response = await fetch(`${API_URL}${endpoint}`, config);

    if (response.status === 401 && window.location.pathname !== "/login") {
        sessionStorage.removeItem("token");
        window.location.href = "/login";
        throw new Error("Session expired. Please login again.");
    }

    return response;
}
</script>
