<script type="text/plain" data-path="src/App.tsx">
import { BrowserRouter, Routes, Route } from 'react-router-dom';
import Login from './pages/Login';
import Dashboard from './pages/Dashboard';
import ManageProducts from './pages/ManageProducts';
import EnquiryManagement from './pages/EnquiryManagement';

import SiteSettings from './pages/SiteSettings';
import ProfilePage from './pages/ProfilePage';
import GarmentManagement from './pages/GarmentManagement';
import OrderManagement from './pages/OrderManagement';
import InvoiceList from './pages/InvoiceList';
import InvoiceEditor from './pages/InvoiceEditor';
import InvoicePrint from './pages/InvoicePrint';
import ProtectedRoute from './components/ProtectedRoute';

function App() {
        return (
                <BrowserRouter>
                        <Routes>
                                <Route path="/login" element={<Login />} />
                                <Route path="/" element={<ProtectedRoute><Dashboard /></ProtectedRoute>} />
                                <Route path="/orders" element={<ProtectedRoute><OrderManagement /></ProtectedRoute>} />
                                <Route path="/invoices" element={<ProtectedRoute><InvoiceList /></ProtectedRoute>} />

                                <Route path="/invoices/:id/print" element={<ProtectedRoute><InvoicePrint /></ProtectedRoute>} />
                                <Route path="/garments" element={<ProtectedRoute><GarmentManagement /></ProtectedRoute>} />
                                <Route path="/products" element={<ProtectedRoute><ManageProducts /></ProtectedRoute>} />
                                <Route path="/categories" element={<ProtectedRoute><CategoryManagement /></ProtectedRoute>} />
                                <Route path="/enquiry-management" element={<ProtectedRoute><EnquiryManagement /></ProtectedRoute>} />
                                <Route path="/banners" element={<ProtectedRoute><ManageBanners /></ProtectedRoute>} />

}

export default App;

<script type="text/plain" data-path="src/components/AdminLayout.tsx">
import { FC, ReactNode, useEffect, useRef, useState } from "react";
import { Link } from "react-router-dom";
import { ChevronDown, ExternalLink, LogOut, Menu, Settings, User } from "lucide-react";
import Sidebar from "./Sidebar";
import { getSiteSettings } from "../services/siteSettingsService";
import { getImageUrl } from "../utils/imageUtils";
import { fetchWithAuth } from "../utils/apiUtils";

const PUBLIC_SITE_URL = import.meta.env.VITE_PUBLIC_SITE_URL || "https://astitvacreations.shop";

const AdminLayout: FC<{ children: ReactNode; title?: string; actions?: ReactNode }> = ({ children, title, actions }) => {
  const [isDropdownOpen, setIsDropdownOpen] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [companyName, setCompanyName] = useState("Astitva Creations");
  const [logoUrl, setLogoUrl] = useState("");
  const [me, setMe] = useState<{ username?: string; email?: string }>({});
  const dropdownRef = useRef<HTMLDivElement>(null);

  const handleLogout = () => {
    sessionStorage.removeItem("token");
    window.location.href = "/login";
  };

  // Inactivity Auto-Logout Timer (15 minutes threshold)
  useEffect(() => {
    const INACTIVITY_TIMEOUT = 15 * 60 * 1000;
    let timeoutId: ReturnType<typeof setTimeout>;

    const resetTimer = () => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        alert("Your admin session has expired due to 15 minutes of inactivity. Please log in again.");
        sessionStorage.removeItem("token");
        window.location.href = "/login?reason=inactivity";
      }, INACTIVITY_TIMEOUT);
    };

    const events = ["mousemove", "keydown", "click", "scroll", "touchstart"];
    events.forEach(event => window.addEventListener(event, resetTimer));
    resetTimer();

    return () => {
      clearTimeout(timeoutId);
      events.forEach(event => window.removeEventListener(event, resetTimer));
    };
  }, []);

  useEffect(() => {
    const handleClickOutside = (event: MouseEvent) => {
      if (dropdownRef.current && !dropdownRef.current.contains(event.target as Node)) setIsDropdownOpen(false);
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  useEffect(() => {
    getSiteSettings()
      .then(data => {
        if (data.companyName) setCompanyName(data.companyName);
        if (data.logoUrl) setLogoUrl(getImageUrl(data.logoUrl));
      })
      .catch(err => console.error("AdminLayout settings error:", err));
    fetchWithAuth("/auth/me")
      .then(r => (r.ok ? r.json() : {}))
      .then(setMe)
      .catch(() => undefined);
  }, []);

  const initial = (me.username || "A").charAt(0).toUpperCase();

  return (
    <div className="flex min-h-screen bg-paper">
      <Sidebar companyName={companyName} logoUrl={logoUrl} open={sidebarOpen} onClose={() => setSidebarOpen(false)} />
      <div className="flex min-w-0 flex-1 flex-col">
        <header className="no-print sticky top-0 z-30 border-b border-line bg-paper/85 px-4 py-3 backdrop-blur-md sm:px-8">
          <div className="flex items-center justify-between gap-4">
            <div className="flex min-w-0 items-center gap-3">
              <button onClick={() => setSidebarOpen(true)} className="rounded-lg p-2 hover:bg-ink/5 lg:hidden" aria-label="Open menu">
                <Menu className="h-5 w-5" />
              </button>
              <h1 className="truncate font-display text-lg font-bold tracking-tight sm:text-xl">{title || `${companyName} Admin`}</h1>
            </div>

            <div className="flex items-center gap-2">
              {actions}
              <a href={PUBLIC_SITE_URL} target="_blank" rel="noreferrer" className="hidden items-center gap-1.5 rounded-xl px-3 py-2 text-sm font-medium text-muted hover:bg-ink/5 hover:text-ink md:inline-flex">
                View site <ExternalLink className="h-3.5 w-3.5" />
              </a>
              <div className="relative" ref={dropdownRef}>
                <button onClick={() => setIsDropdownOpen(!isDropdownOpen)} className="flex items-center gap-1.5 rounded-full p-0.5 pr-2 hover:bg-ink/5">
                  <span className="grid h-9 w-9 place-items-center rounded-full bg-ink font-semibold text-white">{initial}</span>
                  <ChevronDown className={`h-4 w-4 text-muted transition-transform ${isDropdownOpen ? "rotate-180" : ""}`} />
                </button>

                {isDropdownOpen && (
                  <div className="absolute right-0 z-50 mt-2 w-60 rounded-2xl border border-line bg-white py-2 shadow-xl">
                    <div className="border-b border-line px-4 py-3">
                      <p className="text-sm font-semibold">{me.username || "Admin"}</p>
                      <p className="truncate text-xs text-muted">{me.email || ""}</p>
                    </div>
                    <Link to="/profile" className="flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-paper" onClick={() => setIsDropdownOpen(false)}>
                      <User className="h-4 w-4 text-muted" /> My profile
                    </Link>
                    <Link to="/site-settings" className="flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-paper" onClick={() => setIsDropdownOpen(false)}>
                      <Settings className="h-4 w-4 text-muted" /> Site settings
                    </Link>
                    <div className="my-1 border-t border-line" />
                    <button onClick={handleLogout} className="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm font-medium text-red-600 hover:bg-red-50">
                      <LogOut className="h-4 w-4" /> Logout
                    </button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </header>
        <main className="flex-1 p-4 sm:p-8">{children}</main>
      </div>
    </div>
  );
};

export default AdminLayout;
</script>

<script type="text/plain" data-path="src/components/EnquiryRow.tsx">
import React, { useState } from "react";
interface Enquiry {
  _id: string;
  name: string;
  mobileNo: string;
  email: string;
  message: string;
  createdAt: string;
  status: "pending" | "resolved";
}

interface EnquiryRowProps {
  enquiry: Enquiry;
  onMarkResolved: (id: string) => void;
}

const EnquiryRow: React.FC<EnquiryRowProps> = ({ enquiry, onMarkResolved }) => {
  const [expanded, setExpanded] = useState(false);
  const previewLimit = 100;
  const isLong = enquiry.message.length > previewLimit;

  return (
    <tr className="border-b border-gray-200 hover:bg-blue-50">
     <td className="py-3 px-4 min-w-[150px]">{enquiry.name}</td>
           <td className="py-3 px-4">{enquiry.mobileNo}</td>
      <td className="py-3 px-4 text-blue-600 underline">{enquiry.email}</td>
      <td className="py-3 px-4 max-w-xl">
        {expanded || !isLong
          ? enquiry.message
          : `${enquiry.message.slice(0, previewLimit)}... `}
        {isLong && (
          <button
            onClick={() => setExpanded(!expanded)}
            className="text-blue-600 underline ml-1 focus:outline-none"
          >
            {expanded ? "Show less" : "Read more"}
          </button>
        )}
      </td>
      <td className="py-3 px-4">{new Date(enquiry.createdAt).toLocaleDateString()}</td>
      <td className="py-3 px-4">
        <span
          className={`px-3 py-1 rounded-full font-semibold text-sm ${
            enquiry.status === "pending"
              ? "bg-yellow-200 text-yellow-800"
              : "bg-green-200 text-green-800"
          }`}
        >
          {enquiry.status.charAt(0).toUpperCase() + enquiry.status.slice(1)}
        </span>
      </td>
      <td className="py-3 px-4">
        {enquiry.status === "pending" && (
          <button
            onClick={() => onMarkResolved(enquiry._id)}
            className="px-4 py-1 rounded-md bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
          >
            Mark Resolved
          </button>
        )}
      </td>
    </tr>
  );
};

export default EnquiryRow;
</script>

import { X, ImagePlus, Shirt } from "lucide-react";
import { getImageUrl } from "../utils/imageUtils";

const SPORT_TYPES = ["Football", "Cricket", "Basketball", "Volleyball", "Hockey", "Kabaddi", "Athletics", "Generic"];
const FABRICS = ["Polyester", "Cotton", "Dri-FIT", "Mesh", "Cotton Blend", "Fleece", "Nylon"];
const SIZES = ["XS", "S", "M", "L", "XL", "XXL", "XXXL"];
const GENDERS = ["Men", "Women", "Unisex", "Kids"];
const FIT_TYPES = ["Regular", "Slim", "Loose", "Athletic"];

const emptyForm = {
  name: "",
  description: "",
  price: 0,
  category: "",
  sportType: "",
  fabric: "",
  availableSizes: [] as string[],
  gender: "Unisex",
  fitType: "Regular",
  isCustomizable: false,
  color: "",
  stockQuantity: 0,
  tags: "",
};

interface ImagePreview {
  src: string;
  file?: File;
  existingId?: number;
  isMain: boolean;
}

const ProductForm = ({
  initialValues,
  onSubmit,
  mode = "add",
  onCancel,
}: {
  initialValues?: any;
  onSubmit: (data: any) => void;
  mode?: "add" | "edit";
  onCancel?: () => void;
}) => {
  const [form, setForm] = useState<any>(emptyForm);
  const [previews, setPreviews] = useState<ImagePreview[]>([]);
  const [removedIds, setRemovedIds] = useState<number[]>([]);
  const [submitting, setSubmitting] = useState(false);
  const [categories, setCategories] = useState<any[]>([]);
  const fileInputRef = useRef<HTMLInputElement>(null);

  useEffect(() => {
    getAllCategories().then(setCategories).catch(console.error);
  }, []);

  useEffect(() => {
    if (initialValues) {
      let tagsString = "";
      if (Array.isArray(initialValues.tags)) {
        tagsString = initialValues.tags.join(", ");
      } else if (typeof initialValues.tags === "string") {
        try {
          const parsed = JSON.parse(initialValues.tags);
          tagsString = Array.isArray(parsed) ? parsed.join(", ") : initialValues.tags;
        } catch {
          tagsString = initialValues.tags;
        }
      }

      let sizesArray: string[] = [];
      if (Array.isArray(initialValues.availableSizes)) {
        sizesArray = initialValues.availableSizes;
      } else if (typeof initialValues.availableSizes === "string") {
        try { sizesArray = JSON.parse(initialValues.availableSizes); } catch { sizesArray = []; }
      }

      setForm({
        ...emptyForm,
        ...initialValues,
        tags: tagsString,
        availableSizes: sizesArray,
        category: typeof initialValues.category === "object"
          ? initialValues.category?.id
          : initialValues.category,
      });

      const existingPreviews: ImagePreview[] = (initialValues.images || []).map((img: any) => ({
        src: getImageUrl(img.imageUrl),
        existingId: img.id,
        isMain: img.isMain,
      }));
      setPreviews(existingPreviews);
      setRemovedIds([]);
    } else {
      setForm(emptyForm);
      setPreviews([]);
      setRemovedIds([]);
    }
  }, [initialValues]);

  const handleChange = (
    e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement>
  ) => {
    const { name, value } = e.target;
    setForm({ ...form, [name]: value });
  };

  const toggleSize = (size: string) => {
    setForm((prev: any) => ({
      ...prev,
      availableSizes: prev.availableSizes.includes(size)
        ? prev.availableSizes.filter((s: string) => s !== size)
        : [...prev.availableSizes, size],
    }));
  };

  const handleImageFiles = (e: React.ChangeEvent<HTMLInputElement>) => {
    const files = Array.from(e.target.files || []);
    const totalAfter = previews.length + files.length;
    if (totalAfter > 5) {
      alert("Maximum 5 images allowed per product.");
      return;
    }
    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        setPreviews(prev => [
          ...prev,
          {
            src: reader.result as string,
            file,
            isMain: prev.length === 0 && idx === 0,
          },
        ]);
      };
      reader.readAsDataURL(file);
    });
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const removeImage = (index: number) => {
    const img = previews[index];
    if (img.existingId) {
      setRemovedIds(prev => [...prev, img.existingId!]);
    }
    const updated = previews.filter((_, i) => i !== index);
    if (updated.length > 0 && !updated.some(p => p.isMain)) {
      updated[0].isMain = true;
    }
    setPreviews(updated);
  };

  const setMainImage = (index: number) => {
    setPreviews(prev => prev.map((p, i) => ({ ...p, isMain: i === index })));
  };

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (submitting) return;
    setSubmitting(true);
    try {
      const tagsArray = form.tags
        ? form.tags.split(",").map((t: string) => t.trim()).filter(Boolean)
        : [];

      const formData = new FormData();
      formData.append("name", form.name);
      formData.append("description", form.description);
      formData.append("price", form.price.toString());
      formData.append("category", form.category);
      formData.append("sportType", form.sportType || "");
      formData.append("fabric", form.fabric || "");
      formData.append("availableSizes", JSON.stringify(form.availableSizes || []));
      formData.append("gender", form.gender || "");
      formData.append("fitType", form.fitType || "");
      formData.append("isCustomizable", String(form.isCustomizable));
      formData.append("color", form.color || "");
      formData.append("stockQuantity", form.stockQuantity?.toString() || "0");
      formData.append("tags", JSON.stringify(tagsArray));

      previews.forEach(p => {
        if (p.file) formData.append("images", p.file);
      });

      if (removedIds.length > 0) {
        formData.append("removeImageIds", removedIds.join(","));
      }

      await onSubmit(formData);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="flex w-full bg-transparent">
      <form
        onSubmit={handleSubmit}
        className="bg-white rounded-3xl shadow-2xl w-full flex flex-col md:flex-row gap-10 p-6 max-h-[85vh] overflow-auto"
      >
        {/* ── Left: Text Fields ──────────────────────────────────────── */}
        <div className="flex-1 grid grid-cols-2 gap-x-8 gap-y-5 overflow-auto">

          {/* Product Code badge (edit mode) */}
          {mode === "edit" && initialValues?.productCode && (
            <div className="col-span-2">
              <label className="block mb-1 text-xs font-semibold text-gray-500">Product Code (Auto-generated)</label>
              <div className="inline-flex items-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold px-3 py-2 rounded-lg text-sm">
                🏷️ {initialValues.productCode}
              </div>
            </div>
          )}

          {/* Name */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Product Name *</label>
            <input
              name="name" type="text" value={form.name} onChange={handleChange} required
              placeholder="e.g. India Cricket Jersey 2024"
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 transition text-sm"
            />
          </div>

          {/* Category */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Category *</label>
            <select
              name="category" value={form.category} onChange={handleChange} required
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 bg-white text-sm"
            >
              <option value="">Select Category</option>
              {categories.map((cat) => (
                <option key={cat.id} value={cat.id}>{cat.name}</option>
              ))}
            </select>
          </div>

          {/* Sport Type */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Sport Type</label>
            <select
              name="sportType" value={form.sportType} onChange={handleChange}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 bg-white text-sm"
            >
              <option value="">Select Sport</option>
              {SPORT_TYPES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>

          {/* Fabric */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Fabric</label>
            <select
              name="fabric" value={form.fabric} onChange={handleChange}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 bg-white text-sm"
            >
              <option value="">Select Fabric</option>
              {FABRICS.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>

          {/* Gender */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Gender</label>
            <select
              name="gender" value={form.gender} onChange={handleChange}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 bg-white text-sm"
            >
              {GENDERS.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
          </div>

          {/* Fit Type */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Fit Type</label>
            <select
              name="fitType" value={form.fitType} onChange={handleChange}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 focus:ring-indigo-400 focus:outline-none text-gray-700 bg-white text-sm"
            >
              {FIT_TYPES.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>

          {/* Price */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Price (₹) *</label>
            <input
              name="price" type="number" value={form.price} onChange={handleChange} required min={0}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 text-sm"
            />
          </div>

          {/* Stock */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Stock *</label>
            <input
              name="stockQuantity" type="number" value={form.stockQuantity} onChange={handleChange} required min={0}
              className="border border-gray-300 rounded-lg w-full px-3 py-2 text-sm"
            />
          </div>

          {/* Color */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Primary Color</label>
            <input
              name="color" type="text" value={form.color} onChange={handleChange}
              placeholder="e.g. Blue, Red & White"
              className="border border-gray-300 rounded-lg w-full px-3 py-2 text-sm"
            />
          </div>

          {/* Customizable Toggle */}
          <div className="flex items-center gap-3 mt-1">
            <label className="text-xs font-semibold text-gray-700">Customizable?</label>
            <button
              type="button"
              onClick={() => setForm((p: any) => ({ ...p, isCustomizable: !p.isCustomizable }))}
              className={`relative w-11 h-6 rounded-full transition-colors focus:outline-none ${
                form.isCustomizable ? "bg-indigo-600" : "bg-gray-300"
              }`}
            >
              <span
                className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform ${
                  form.isCustomizable ? "translate-x-5" : "translate-x-0"
                }`}
              />
            </button>
            <span className="text-xs text-gray-500">{form.isCustomizable ? "Yes" : "No"}</span>
          </div>

          {/* Available Sizes */}
          <div className="col-span-2">
            <label className="block mb-2 text-xs font-semibold text-gray-700">Available Sizes</label>
            <div className="flex flex-wrap gap-2">
              {SIZES.map(size => (
                <button
                  key={size}
                  type="button"
                  onClick={() => toggleSize(size)}
                  className={`px-3 py-1.5 rounded-lg border text-xs font-bold transition-all ${
                    form.availableSizes.includes(size)
                      ? "bg-indigo-600 text-white border-indigo-600 shadow-sm scale-105"
                      : "bg-white text-gray-600 border-gray-300 hover:border-indigo-400 hover:text-indigo-600"
                  }`}
                >
                  {size}
                </button>
              ))}
            </div>
          </div>

          {/* Tags */}
          <div>
            <label className="block mb-1 text-xs font-semibold text-gray-700">Tags (comma-separated)</label>
            <input
              name="tags" type="text" value={form.tags} onChange={handleChange}
              placeholder="jersey, cricket, india, blue"
              className="border border-gray-300 rounded-lg w-full px-3 py-2 text-sm"
            />
          </div>

          {/* Description */}
          <div className="col-span-2">
            <label className="block mb-1 text-xs font-semibold text-gray-700">Description *</label>
            <textarea
              name="description" rows={3} value={form.description} onChange={handleChange} required
              placeholder="Describe the jersey — team, occasion, material features..."
              className="border border-gray-300 rounded-lg w-full px-3 py-2 resize-none focus:ring-indigo-400 focus:outline-none text-gray-700 text-sm"
            />
          </div>
        </div>

        {/* ── Right: Images + Buttons ──────────────────────────────────── */}
        <div className="flex flex-col gap-5 min-w-[300px] max-w-[360px]">
          {/* Image upload area */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-xs font-semibold text-gray-700">
                Product Images ({previews.length}/5)
              </label>
              {previews.length < 5 && (
                <button
                  type="button"
                  onClick={() => fileInputRef.current?.click()}
                  className="flex items-center gap-1 text-xs text-indigo-600 font-semibold hover:text-indigo-800 transition"
                >
                  <ImagePlus size={14} /> Add Image
                </button>
              )}
            </div>

            <input
              ref={fileInputRef} type="file" accept="image/*" multiple
              onChange={handleImageFiles} className="hidden"
            />

            {previews.length === 0 ? (
              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                className="w-full h-44 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl text-gray-400 hover:border-indigo-400 hover:text-indigo-400 transition"
              >
                <Shirt size={32} className="mb-2 opacity-50" />
                <span className="text-xs">Click to add jersey images (max 5)</span>
              </button>
            ) : (
              <div className="space-y-2">
                <div className="relative h-48 bg-gray-50 rounded-xl overflow-hidden border border-gray-200">
                  <img
                    src={previews.find(p => p.isMain)?.src || previews[0]?.src}
                    alt="Main"
                    className="w-full h-full object-contain p-3"
                  />
                  <span className="absolute top-2 left-2 bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                    MAIN
                  </span>
                </div>
                <div className="flex gap-2 flex-wrap">
                  {previews.map((p, i) => (
                    <div key={i} className="relative group">
                      <button
                        type="button"
                        onClick={() => setMainImage(i)}
                        className={`w-14 h-14 rounded-lg overflow-hidden border-2 transition ${
                          p.isMain ? 'border-indigo-600' : 'border-gray-200 hover:border-gray-400'
                        }`}
                      >
                        <img src={p.src} alt={`img-${i}`} className="w-full h-full object-cover" />
                      </button>
                      <button
                        type="button"
                        onClick={() => removeImage(i)}
                        className="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
                      >
                        <X size={10} />
                      </button>
                    </div>
                  ))}
                  {previews.length < 5 && (
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="w-14 h-14 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:border-indigo-400 hover:text-indigo-400 transition"
                    >
                      <ImagePlus size={18} />
                    </button>
                  )}
                </div>
                <p className="text-[10px] text-gray-400">Click thumbnail to set as main image</p>
              </div>
            )}
          </div>

          {/* Action buttons */}
          <div className="flex gap-3 mt-auto">
            <button
              type="submit"
              disabled={submitting}
              className={`flex-1 py-3 rounded-xl font-bold shadow-lg transition text-center ${
                submitting ? "bg-gray-400 text-gray-700 cursor-not-allowed" : "bg-indigo-600 text-white hover:bg-indigo-700"
              }`}
            >
              {submitting
                ? (mode === "edit" ? "Updating..." : "Adding...")
                : (mode === "edit" ? "Update Product" : "Add Product")}
            </button>
            {onCancel && (
              <button
                type="button"
                onClick={onCancel}
                className="flex-1 py-3 bg-gray-50 border border-gray-300 text-gray-600 rounded-xl font-semibold hover:bg-gray-100 transition"
              >
                Cancel
              </button>
            )}
          </div>
        </div>
      </form>
    </div>
  );
};

export default ProductForm;
</script>
<script type="text/plain" data-path="src/components/ProductTable.tsx">
import { useState } from "react";
import { Package } from "lucide-react";
import { getImageUrl } from "../utils/imageUtils";

const ProductTable = ({
  products,
  onEdit,
  onDelete,
}: {
  products: any[] | undefined;
  onEdit: (product: any) => void;
  onDelete: (id: number) => void;
}) => {
  const safeProducts = Array.isArray(products) ? products : [];

  const categories = ["All", ...Array.from(new Set(safeProducts.map((p) =>
    typeof p.category === "object" ? p.category?.name : p.category
  )))];
  const [activeTab, setActiveTab] = useState<string>("All");

  const filteredProducts =
    activeTab === "All"
      ? safeProducts
      : safeProducts.filter((p) => {
          const catName = typeof p.category === "object" ? p.category?.name : p.category;
          return catName === activeTab;
        });

  const normalizeTags = (tags: any): string[] => {
    if (!tags) return [];
    if (Array.isArray(tags)) {
      return tags.flatMap((tag) => {
        try {
          const parsed = JSON.parse(tag);
          return Array.isArray(parsed) ? parsed : [parsed];
        } catch {
          return [tag];
        }
      });
    }
    if (typeof tags === "string") {
      try {
        const parsed = JSON.parse(tags);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return tags.split(",").map((t) => t.trim());
      }
    }
    return [];
  };

  return (
    <div className="mt-6">
      {/* Category tabs */}
      <div className="flex gap-2 mb-5 flex-wrap">
        {categories.map((category) => (
          <button
            key={category}
            className={`px-4 py-2 rounded-full font-medium border transition
              ${activeTab === category
                ? "bg-blue-600 text-white shadow border-blue-600"
                : "bg-gray-50 hover:bg-blue-50 text-gray-700 border-gray-200"
              }`}
            onClick={() => setActiveTab(category)}
          >
            {category}
          </button>
        ))}
      </div>

      <div className="bg-white rounded-2xl shadow-lg overflow-x-auto p-2">
        <table className="w-full min-w-[900px]">
          <thead>
            <tr className="bg-gray-100 text-gray-700 text-sm border-b border-gray-200">
              <th className="py-3 px-3 text-left font-medium">Image</th>
              <th className="py-3 px-3 text-left font-medium">Code</th>
              <th className="py-3 px-3 text-left font-medium">Name</th>
              <th className="py-3 px-3 text-left font-medium">Category</th>
              <th className="py-3 px-3 text-left font-medium">Price</th>
              <th className="py-3 px-3 text-left font-medium">Stock</th>
              <th className="py-3 px-3 text-left font-medium">Tags</th>
              <th className="py-3 px-3 text-left font-medium">Actions</th>
            </tr>
          </thead>
          <tbody>
            {filteredProducts.length === 0 ? (
              <tr>
                <td colSpan={8} className="py-6 text-center text-gray-400">
                  No products in this category.
                </td>
              </tr>
            ) : (
              filteredProducts.map((product) => {
                const mainImage = product.imageUrl
                  || product.images?.find((i: any) => i.isMain)?.imageUrl
                  || product.images?.[0]?.imageUrl;

                return (
                  <tr
                    key={product.id}
                    className="border-b border-gray-100 hover:bg-blue-50 transition group"
                  >
                    <td className="py-2 px-3">
                      <div className="relative">
                        {mainImage ? (
                          <img
                            src={getImageUrl(mainImage)}
                            alt={product.name}
                            className="w-14 h-14 rounded-lg object-cover border border-gray-200 group-hover:border-blue-400 transition"
                          />
                        ) : (
                          <div className="w-14 h-14 rounded-lg bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-400 text-xs">
                            No img
                          </div>
                        )}
                        {product.images?.length > 1 && (
                          <span className="absolute -top-1 -right-1 bg-blue-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                            {product.images.length}
                          </span>
                        )}
                      </div>
                    </td>
                    <td className="py-2 px-3">
                      {product.productCode && (
                        <span className="inline-flex items-center gap-1 bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded-full border border-gray-200 whitespace-nowrap">
                          <Package size={10} /> {product.productCode}
                        </span>
                      )}
                    </td>
                    <td className="py-2 px-3 font-semibold text-gray-900">
                      {product.name}
                      <div className="text-xs text-gray-400 font-normal">
                        {[product.materialType, product.size].filter(Boolean).join(", ")}
                      </div>
                    </td>
                    <td className="py-2 px-3 text-sm">
                      {typeof product.category === "object" ? product.category?.name : product.category}
                    </td>
                    <td className="py-2 px-3">
                      <span className="text-blue-600 font-bold">₹{product.price}</span>
                    </td>
                    <td className="py-2 px-3">
                      <span
                        className={`px-2 py-1 rounded-full text-xs font-bold ${
                          product.stockQuantity < 5
                            ? "bg-red-100 text-red-600"
                            : "bg-green-50 text-green-700"
                        }`}
                      >
                        {product.stockQuantity}
                      </span>
                    </td>
                    <td className="py-2 px-3">
                      <div className="flex flex-wrap gap-1">
                        {normalizeTags(product.tags).slice(0, 3).map((tag: string) => (
                          <span
                            key={tag}
                            className="bg-blue-100 rounded-full px-2 py-0.5 text-xs text-blue-700 font-semibold"
                          >
                            {tag}
                          </span>
                        ))}
                      </div>
                    </td>
                    <td className="py-2 px-3">
                      <button
                        className="mr-2 px-3 py-1 bg-yellow-100 hover:bg-yellow-200 rounded text-yellow-900 text-xs font-bold transition"
                        onClick={() => onEdit(product)}
                      >
                        Edit
                      </button>
                      <button
                        className="px-3 py-1 bg-red-100 hover:bg-red-200 rounded text-red-900 text-xs font-bold transition"
                        onClick={() => onDelete(product.id)}
                      >
                        Delete
                      </button>
                    </td>
                  </tr>
                );
              })
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
};

export default ProductTable;
</script>
<script type="text/plain" data-path="src/components/ProtectedRoute.tsx">
import { FC, ReactNode, useEffect, useState } from "react";
import { Navigate } from "react-router-dom";
import { API_URL } from "../utils/apiUtils";

const ProtectedRoute: FC<{ children: ReactNode }> = ({ children }) => {
    const [isAuthenticated, setIsAuthenticated] = useState<boolean | null>(null);

    useEffect(() => {
        const checkAuth = async () => {
            const token = sessionStorage.getItem("token");
            if (!token) {
                setIsAuthenticated(false);
                return;
            }

            try {
                // Verify session with the backend
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    setIsAuthenticated(true);
                } else {
                    sessionStorage.removeItem("token");
                    setIsAuthenticated(false);
                }
            } catch (error) {
                sessionStorage.removeItem("token");
                setIsAuthenticated(false);
            }
        };

        checkAuth();
    }, []);

    if (isAuthenticated === null) {
        return (
            <div className="min-h-screen flex items-center justify-center bg-gray-50">
                <div className="relative w-16 h-16">
                    <div className="absolute inset-0 border-4 border-indigo-200 rounded-full animate-ping" />
                    <div className="absolute inset-0 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin" />
                </div>
            </div>
        );
    }

    return isAuthenticated ? <>{children}</> : <Navigate to="/login" replace />;
};

export default ProtectedRoute;
</script>

<script type="text/plain" data-path="src/pages/CategoryManagement.tsx">
import { useState, useEffect, useRef } from "react";
import AdminLayout from "../components/AdminLayout";
import { Folder, Plus, Edit2, Trash2, CheckCircle, XCircle, Save, X, Image as ImageIcon } from "lucide-react";
import * as categoryService from "../services/categoryService";
import { getImageUrl } from "../utils/imageUtils";

interface Category {
    id?: string | number;
    _id?: string;
    name: string;
    slug: string;
    description: string;
    imageUrl?: string;
    isActive: boolean;
    createdAt?: string;
    updatedAt?: string;
}

const CategoryManagement = () => {
    const [categories, setCategories] = useState<Category[]>([]);
    const [loading, setLoading] = useState(true);
    const [isEditing, setIsEditing] = useState(false);
    const [editingCategory, setEditingCategory] = useState<Category | null>(null);
    const [formData, setFormData] = useState({
        name: "",
        slug: "",
        description: "",
        imageUrl: "",
        isActive: true,
    });

    const [imagePreview, setImagePreview] = useState<string>("");
    const [imageFile, setImageFile] = useState<File | null>(null);
    const fileInputRef = useRef<HTMLInputElement>(null);

    useEffect(() => {
        loadCategories();
    }, []);

    const loadCategories = async () => {
        try {
            setLoading(true);
            const data = await categoryService.getAllCategories();
            setCategories(data);
            setLoading(false);
        } catch (error: any) {
            alert("Failed to load categories: " + error.message);
            setLoading(false);
        }
    };

    const handleImageChange = (e: React.ChangeEvent<HTMLInputElement>) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setImageFile(file);
        const reader = new FileReader();
        reader.onloadend = () => setImagePreview(reader.result as string);
        reader.readAsDataURL(file);
    };

    const handleSubmit = async (e: React.FormEvent) => {
        e.preventDefault();
        try {
            const payload = new FormData();
            payload.append("name", formData.name);
            payload.append("slug", formData.slug);
            payload.append("description", formData.description);
            payload.append("isActive", String(formData.isActive));
            if (formData.imageUrl && !imageFile) payload.append("imageUrl", formData.imageUrl);
            if (imageFile) payload.append("image", imageFile);

            const catId = editingCategory ? (editingCategory.id || editingCategory._id) : null;

            if (catId) {
                await categoryService.updateCategory(String(catId), payload);
                alert("Category updated successfully!");
            } else {
                await categoryService.createCategory(payload);
                alert("Category created successfully!");
            }
            resetForm();
            loadCategories();
        } catch (error: any) {
            alert(error.message);
        }
    };

    const handleEdit = (category: Category) => {
        setEditingCategory(category);
        setFormData({
            name: category.name,
            slug: category.slug,
            description: category.description || "",
            imageUrl: category.imageUrl || "",
            isActive: category.isActive,
        });
        setImagePreview(category.imageUrl ? getImageUrl(category.imageUrl) : "");
        setImageFile(null);
        setIsEditing(true);
    };

    const handleDelete = async (id: string | number) => {
        if (!window.confirm("Are you sure you want to delete this category? Associated products will be unlinked.")) return;

        try {
            await categoryService.deleteCategory(String(id));
            alert("Category deleted successfully!");
            loadCategories();
        } catch (error: any) {
            alert(error.message);
        }
    };

    const handleToggleStatus = async (id: string | number) => {
        try {
            await categoryService.toggleCategoryStatus(String(id));
            loadCategories();
        } catch (error: any) {
            alert(error.message);
        }
    };

    const resetForm = () => {
        setFormData({
            name: "",
            slug: "",
            description: "",
            imageUrl: "",
            isActive: true,
        });
        setImagePreview("");
        setImageFile(null);
        setEditingCategory(null);
        setIsEditing(false);
    };

    const handleNameChange = (name: string) => {
        setFormData({
            ...formData,
            name,
            slug: name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""),
        });
    };

    if (loading) {
        return (
            <AdminLayout>
                <div className="flex items-center justify-center h-64">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
            </AdminLayout>
        );
    }

    return (
        <AdminLayout>
            <div className="space-y-6">
                {/* Header */}
                <div className="flex items-center justify-between">
                    <div>
                        <h2 className="text-3xl font-bold text-gray-900 tracking-tight">Category Management</h2>
                        <p className="text-gray-600 mt-1">Manage categories, images, and homepage layout</p>
                    </div>
                    <button
                        onClick={() => {
                            if (isEditing) resetForm();
                            else setIsEditing(true);
                        }}
                        className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold text-sm"
                    >
                        {isEditing ? (
                            <>
                                <X className="w-4 h-4" />
                                Cancel
                            </>
                        ) : (
                            <>
                                <Plus className="w-4 h-4" />
                                Add Category
                            </>
                        )}
                    </button>
                </div>

                {/* Add/Edit Form */}
                {isEditing && (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                        <h3 className="text-lg font-semibold text-gray-900 mb-4">
                            {editingCategory ? "Edit Category" : "Add New Category"}
                        </h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Category Name *
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => handleNameChange(e.target.value)}
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                        placeholder="e.g., Oversized T-Shirts"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Slug (auto-generated)
                                    </label>
                                    <input
                                        type="text"
                                        value={formData.slug}
                                        onChange={(e) => setFormData({ ...formData, slug: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 text-sm"
                                        placeholder="oversized-t-shirts"
                                    />
                                </div>
                            </div>

                            {/* Category Image Upload */}
                            <div className="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                                <label className="block text-sm font-bold text-gray-800 flex items-center gap-1.5">
                                    <ImageIcon size={16} className="text-blue-600" /> Category Cover Image (Upload or Paste URL)
                                </label>
                                <div className="flex items-center gap-4">
                                    <div className="w-20 h-20 rounded-lg border border-gray-300 bg-white overflow-hidden flex items-center justify-center shrink-0">
                                        {imagePreview ? (
                                            <img src={imagePreview} alt="Preview" className="w-full h-full object-cover" />
                                        ) : (
                                            <span className="text-[10px] text-gray-400">No Image</span>
                                        )}
                                    </div>
                                    <div className="flex-1 space-y-2">
                                        <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
                                        <button
                                            type="button"
                                            onClick={() => fileInputRef.current?.click()}
                                            className="px-3 py-1.5 bg-blue-50 border border-blue-200 text-blue-700 font-semibold rounded-lg text-xs hover:bg-blue-100 transition"
                                        >
                                            Upload Image File
                                        </button>
                                        <input
                                            type="text"
                                            value={formData.imageUrl}
                                            onChange={(e) => {
                                                setFormData({ ...formData, imageUrl: e.target.value });
                                                setImagePreview(e.target.value);
                                            }}
                                            className="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-xs outline-none bg-white"
                                            placeholder="Or paste image URL (e.g. https://...)"
                                        />
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                    Description
                                </label>
                                <textarea
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    rows={2}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"
                                    placeholder="Brief description of this category..."
                                />
                            </div>
                            <div className="flex items-center gap-2">
                                <input
                                    type="checkbox"
                                    id="isActive"
                                    checked={formData.isActive}
                                    onChange={(e) => setFormData({ ...formData, isActive: e.target.checked })}
                                    className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                />
                                <label htmlFor="isActive" className="text-sm font-medium text-gray-700">
                                    Active (visible to customers)
                                </label>
                            </div>
                            <div className="flex gap-3 pt-2">
                                <button
                                    type="submit"
                                    className="flex items-center gap-2 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold text-sm"
                                >
                                    <Save className="w-4 h-4" />
                                    {editingCategory ? "Update Category" : "Create Category"}
                                </button>
                                <button
                                    type="button"
                                    onClick={resetForm}
                                    className="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition font-semibold text-sm"
                                >
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                )}

                {/* Categories List */}
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div className="p-6 border-b border-gray-200 bg-gray-50">
                        <h3 className="text-lg font-semibold text-gray-900">
                            All Categories ({categories.length})
                        </h3>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Cover Image
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Name
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Slug
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Description
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Status
                                    </th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {categories.length === 0 ? (
                                    <tr>
                                        <td colSpan={6} className="px-6 py-12 text-center text-gray-500">
                                            <Folder className="w-12 h-12 mx-auto mb-4 text-gray-300" />
                                            <p>No categories yet. Create your first category to get started!</p>
                                        </td>
                                    </tr>
                                ) : (
                                    categories.map((category) => {
                                        const catId = (category as any).id || category._id;
                                        return (
                                            <tr key={catId} className="hover:bg-gray-50 transition">
                                                <td className="px-6 py-4">
                                                    <div className="w-12 h-12 rounded-lg bg-gray-100 overflow-hidden border border-gray-200 flex items-center justify-center">
                                                        {category.imageUrl ? (
                                                            <img src={getImageUrl(category.imageUrl)} alt={category.name} className="w-full h-full object-cover" />
                                                        ) : (
                                                            <Folder className="w-5 h-5 text-gray-400" />
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-semibold text-gray-900">{category.name}</span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <code className="text-sm text-gray-600 bg-gray-100 px-2 py-1 rounded">
                                                        {category.slug}
                                                    </code>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <p className="text-sm text-gray-600 line-clamp-2">
                                                        {category.description || "-"}
                                                    </p>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <button
                                                        onClick={() => handleToggleStatus(catId!)}
                                                        className="flex items-center gap-1"
                                                    >
                                                        {category.isActive ? (
                                                            <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">
                                                                <CheckCircle className="w-3 h-3" />
                                                                Active
                                                            </span>
                                                        ) : (
                                                            <span className="inline-flex items-center gap-1 px-2 py-1 bg-gray-100 text-gray-700 rounded-full text-xs font-medium">
                                                                <XCircle className="w-3 h-3" />
                                                                Inactive
                                                            </span>
                                                        )}
                                                    </button>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => handleEdit(category)}
                                                            className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                                            title="Edit category"
                                                        >
                                                            <Edit2 className="w-4 h-4" />
                                                        </button>
                                                        <button
                                                            onClick={() => handleDelete(catId!)}
                                                            className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"
                                                            title="Delete category"
                                                        >
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </AdminLayout>
    );
};

export default CategoryManagement;
</script>
<script type="text/plain" data-path="src/pages/Dashboard.tsx">
import { useState, useEffect } from "react";
import { Link } from "react-router-dom";
import AdminLayout from "../components/AdminLayout";
import { Package, Mail, Star, Image, TrendingUp, Clock, CheckCircle, AlertCircle, Receipt, ShoppingBag, Shirt } from "lucide-react";
import { fetchOrders, fetchOrderStats, Order } from "../services/orderService";
import { fetchInvoices } from "../services/invoiceService";
import { getImageUrl } from "../utils/imageUtils";
import { inr } from "../utils/format";
import { fetchProducts } from "../services/productService";
import { fetchEnquiries } from "../services/enquiryService";
import * as reviewService from "../services/reviewService";
import { fetchBanners } from "../services/bannerService";

interface Stats {
  totalProducts: number;
  totalEnquiries: number;
  pendingEnquiries: number;
  totalReviews: number;
  activeBanners: number;
  lowStockProducts: number;
}

const Dashboard = () => {
  const [stats, setStats] = useState<Stats>({
    totalProducts: 0,
    totalEnquiries: 0,
    pendingEnquiries: 0,
    totalReviews: 0,
    activeBanners: 0,
    lowStockProducts: 0,
  });
  const [recentEnquiries, setRecentEnquiries] = useState<any[]>([]);
  const [loading, setLoading] = useState(true);

  const [sales, setSales] = useState({ newOrders: 0, totalOrders: 0, orderValue: 0, billed: 0, received: 0, outstanding: 0 });
  const [recentOrders, setRecentOrders] = useState<Order[]>([]);

  useEffect(() => {
    loadDashboardData();
    Promise.all([
      fetchOrderStats().catch(() => null),
      fetchInvoices({ page: 1 }).catch(() => null),
      fetchOrders({ page: 1 }).catch(() => null),
    ]).then(([orderStats, invoices, orders]) => {
      setSales({
        newOrders: orderStats?.byStatus.new ?? 0,
        totalOrders: orderStats?.total ?? 0,
        orderValue: orderStats?.revenue ?? 0,
        billed: invoices?.summary.billed ?? 0,
        received: invoices?.summary.received ?? 0,
        outstanding: invoices?.summary.outstanding ?? 0,
      });
      setRecentOrders(orders?.orders.slice(0, 5) ?? []);
    });
  }, []);

  const loadDashboardData = async () => {
    try {
      setLoading(true);

      // Fetch all data
      const [productsData, enquiriesData, reviewsData, bannersData] = await Promise.all([
        fetchProducts().catch(() => ({ products: [] })),
        fetchEnquiries().catch(() => ({ enquiries: [] })),
        reviewService.getAllReviews().catch(() => ({ data: [] })),
        fetchBanners().catch(() => []),
      ]);

      // Process products
      const products = Array.isArray(productsData) ? productsData : productsData.products || [];
      const lowStock = products.filter((p: any) => p.stockQuantity < 5).length;

      // Process enquiries
      const enquiries = enquiriesData.enquiries || [];
      const pending = enquiries.filter((e: any) => e.status === "pending").length;

      // Process reviews
      const reviews = reviewsData.data || reviewsData || [];

      // Process banners
      const banners = Array.isArray(bannersData) ? bannersData : [];
      const active = banners.filter((b: any) => b.isActive).length;

      setStats({
        totalProducts: products.length,
        totalEnquiries: enquiries.length,
        pendingEnquiries: pending,
        totalReviews: Array.isArray(reviews) ? reviews.length : 0,
        activeBanners: active,
        lowStockProducts: lowStock,
      });

      // Get recent 5 enquiries
      setRecentEnquiries(enquiries.slice(0, 5));
      setLoading(false);
    } catch (error) {
      console.error("Error loading dashboard data:", error);
      setLoading(false);
    }
  };

  const StatCard = ({ icon: Icon, title, value, subtitle, color }: any) => (
    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow">
      <div className="flex items-start justify-between">
        <div>
          <p className="text-sm text-gray-600 font-medium">{title}</p>
          <p className="text-3xl font-bold text-gray-900 mt-2">{value}</p>
          {subtitle && <p className="text-sm text-gray-500 mt-1">{subtitle}</p>}
        </div>
        <div className={`p-3 rounded-lg ${color}`}>
          <Icon className="w-6 h-6 text-white" />
        </div>
      </div>
    </div>
  );

  if (loading) {
    return (
      <AdminLayout>
        <div className="flex items-center justify-center h-64">
          <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>
      </AdminLayout>
    );
  }

  return (
    <AdminLayout>
      <div className="space-y-6">
        {/* Header */}
        <div className="relative overflow-hidden rounded-2xl bg-ink p-8 text-white">
          <div className="absolute -right-10 -top-16 h-56 w-56 rounded-full bg-accent/40 blur-3xl" />
          <p className="relative text-xs font-semibold uppercase tracking-[0.2em] text-white/40">Dashboard</p>
          <h2 className="relative mt-2 font-display text-3xl font-bold tracking-tight">Welcome back!</h2>
          <p className="relative mt-1 text-white/60">Here's what's happening with your business today.</p>
          <div className="relative mt-6 flex flex-wrap gap-2">
            <Link to="/invoices/new" className="a-btn-accent"><Receipt className="h-4 w-4" /> New invoice</Link>
            <Link to="/orders" className="a-btn border border-white/20 text-white hover:bg-white hover:text-ink"><ShoppingBag className="h-4 w-4" /> View orders</Link>
            <Link to="/garments" className="a-btn border border-white/20 text-white hover:bg-white hover:text-ink"><Shirt className="h-4 w-4" /> Studio pricing</Link>
          </div>
        </div>

        {/* Sales */}
        <div className="grid grid-cols-2 gap-4 lg:grid-cols-4">
          <Link to="/orders" className="a-card p-5 transition hover:border-ink">
            <p className="a-label">New website orders</p>
            <p className="font-display text-3xl font-bold text-accent">{sales.newOrders}</p>
            <p className="text-xs text-muted">{sales.totalOrders} orders in total</p>
          </Link>
          <div className="a-card p-5">
            <p className="a-label">Website order value</p>
            <p className="font-display text-3xl font-bold">{inr(sales.orderValue)}</p>
            <p className="text-xs text-muted">Excluding cancelled</p>
          </div>
          <Link to="/invoices" className="a-card p-5 transition hover:border-ink">
            <p className="a-label">Invoiced</p>
            <p className="font-display text-3xl font-bold">{inr(sales.billed)}</p>
            <p className="text-xs text-muted">{inr(sales.received)} received</p>
          </Link>
          <Link to="/invoices" className="a-card p-5 transition hover:border-ink">
            <p className="a-label">Outstanding</p>
            <p className="font-display text-3xl font-bold text-red-600">{inr(sales.outstanding)}</p>
            <p className="text-xs text-muted">To be collected</p>
          </Link>
        </div>

        {recentOrders.length > 0 && (
          <div className="a-card">
            <div className="flex items-center justify-between border-b border-line p-5">
              <h3 className="font-display text-lg font-bold">Latest website orders</h3>
              <Link to="/orders" className="text-sm font-semibold text-accent-dark hover:underline">View all</Link>
            </div>
            <div className="divide-y divide-line">
              {recentOrders.map(o => (
                <Link key={o.id} to="/orders" className="flex items-center gap-4 p-4 hover:bg-paper/60">
                  {o.previews?.front
                    ? <img src={getImageUrl(o.previews.front)} alt="" className="h-12 w-11 rounded-lg bg-paper object-cover" />
                    : <span className="h-12 w-11 rounded-lg bg-paper" />}
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-semibold">{o.customerName} <span className="font-normal text-muted">· {o.orderNumber}</span></p>
                    <p className="truncate text-xs text-muted">{o.garmentName} × {o.quantity} · {o.colorName} · {o.size}</p>
                  </div>
                  <p className="text-sm font-semibold">{inr(o.total)}</p>
                </Link>
              ))}
            </div>
          </div>
        )}

        {/* Stats Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <StatCard
            icon={Package}
            title="Total Products"
            value={stats.totalProducts}
            subtitle={stats.lowStockProducts > 0 ? `${stats.lowStockProducts} low stock` : "All stocked"}
            color="bg-blue-600"
          />
          <StatCard
            icon={Mail}
            title="Total Enquiries"
            value={stats.totalEnquiries}
            subtitle={stats.pendingEnquiries > 0 ? `${stats.pendingEnquiries} pending` : "All resolved"}
            color={stats.pendingEnquiries > 0 ? "bg-yellow-600" : "bg-green-600"}
          />
          <StatCard
            icon={Star}
            title="Customer Reviews"
            value={stats.totalReviews}
            subtitle="Total reviews received"
            color="bg-purple-600"
          />
          <StatCard
            icon={Image}
            title="Active Banners"
            value={stats.activeBanners}
            subtitle="Currently displayed"
            color="bg-indigo-600"
          />
          <StatCard
            icon={TrendingUp}
            title="Low Stock Alert"
            value={stats.lowStockProducts}
            subtitle="Products need restock"
            color={stats.lowStockProducts > 5 ? "bg-red-600" : "bg-orange-600"}
          />
          <StatCard
            icon={CheckCircle}
            title="Resolved Enquiries"
            value={stats.totalEnquiries - stats.pendingEnquiries}
            subtitle="All time resolved"
            color="bg-green-600"
          />
        </div>

        {/* Recent Activity */}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {/* Recent Enquiries */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-200">
            <div className="p-6 border-b border-gray-200">
              <h3 className="text-lg font-semibold text-gray-900">Recent Enquiries</h3>
            </div>
            <div className="divide-y divide-gray-100">
              {recentEnquiries.length === 0 ? (
                <p className="p-6 text-center text-gray-500">No enquiries yet</p>
              ) : (
                recentEnquiries.map((enquiry) => (
                  <div key={enquiry._id} className="p-4 hover:bg-gray-50 transition">
                    <div className="flex items-start justify-between">
                      <div className="flex-1">
                        <p className="font-semibold text-gray-900">{enquiry.name}</p>
                        <p className="text-sm text-gray-600 truncate mt-1">{enquiry.message}</p>
                        <p className="text-xs text-gray-400 mt-1">
                          {new Date(enquiry.createdAt).toLocaleDateString()}
                        </p>
                      </div>
                      <div>
                        {enquiry.status === "pending" ? (
                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs font-medium">
                            <Clock className="w-3 h-3" />
                            Pending
                          </span>
                        ) : (
                          <span className="inline-flex items-center gap-1 px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">
                            <CheckCircle className="w-3 h-3" />
                            Resolved
                          </span>
                        )}
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Quick Actions */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 className="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h3>
            <div className="space-y-3">
              <a
                href="/products"
                className="flex items-center gap-3 p-3 rounded-lg hover:bg-blue-50 transition border border-gray-200"
              >
                <Package className="w-5 h-5 text-blue-600" />
                <div>
                  <p className="font-medium text-gray-900">Manage Products</p>
                  <p className="text-sm text-gray-600">Add, edit, or remove products</p>
                </div>
              </a>
              <a
                href="/enquiry-management"
                className="flex items-center gap-3 p-3 rounded-lg hover:bg-green-50 transition border border-gray-200"
              >
                <Mail className="w-5 h-5 text-green-600" />
                <div>
                  <p className="font-medium text-gray-900">View Enquiries</p>
                  <p className="text-sm text-gray-600">Respond to customer enquiries</p>
                </div>
              </a>
              <a
                href="/reviews"
                className="flex items-center gap-3 p-3 rounded-lg hover:bg-purple-50 transition border border-gray-200"
              >
                <Star className="w-5 h-5 text-purple-600" />
                <div>
                  <p className="font-medium text-gray-900">Manage Reviews</p>
                  <p className="text-sm text-gray-600">Monitor customer feedback</p>
                </div>
              </a>
              <a
                href="/banners"
                className="flex items-center gap-3 p-3 rounded-lg hover:bg-indigo-50 transition border border-gray-200"
              >
                <Image className="w-5 h-5 text-indigo-600" />
                <div>
                  <p className="font-medium text-gray-900">Update Banners</p>
                  <p className="text-sm text-gray-600">Manage homepage carousel</p>
                </div>
              </a>
            </div>
          </div>
        </div>

        {/* Alerts */}
        {(stats.pendingEnquiries > 0 || stats.lowStockProducts > 0) && (
          <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-6">
            <div className="flex items-start gap-3">
              <AlertCircle className="w-5 h-5 text-yellow-600 mt-0.5" />
              <div>
                <h4 className="font-semibold text-yellow-900">Attention Required</h4>
                <ul className="mt-2 space-y-1 text-sm text-yellow-800">
                  {stats.pendingEnquiries > 0 && (
                    <li>• You have {stats.pendingEnquiries} pending enquiries to review</li>
                  )}
                  {stats.lowStockProducts > 0 && (
                    <li>• {stats.lowStockProducts} products are running low on stock</li>
                  )}
                </ul>
              </div>
            </div>
          </div>
        )}
      </div>
    </AdminLayout>
  );
};

export default Dashboard;
</script>
<script type="text/plain" data-path="src/pages/EnquiryManagement.tsx">
import React, { useState, useEffect } from "react";
import AdminLayout from "../components/AdminLayout";
import { fetchEnquiries, markEnquiryResolved, deleteEnquiry } from "../services/enquiryService";
import { Search, Filter, Calendar, CheckCircle, Clock, Trash2, Mail, Phone, User, Package, MessageCircle } from "lucide-react";

interface Enquiry {
  id: number;
  name: string;
  mobileNo: string;
  email: string;
  message: string;
  createdAt: string;
  status: "pending" | "resolved";
  enquiryType: "general" | "product";
  productCode?: string;
  productName?: string;
  productId?: number;
}

const EnquiryManagement: React.FC = () => {
  const [enquiries, setEnquiries] = useState<Enquiry[]>([]);
  const [filteredEnquiries, setFilteredEnquiries] = useState<Enquiry[]>([]);
  const [selectedEnquiry, setSelectedEnquiry] = useState<Enquiry | null>(null);
  const [loading, setLoading] = useState<boolean>(true);
  const [error, setError] = useState<string>("");

  const [searchQuery, setSearchQuery] = useState<string>("");
  const [statusFilter, setStatusFilter] = useState<"all" | "pending" | "resolved">("all");
  const [typeFilter, setTypeFilter] = useState<"all" | "general" | "product">("all");
  const [dateFilter, setDateFilter] = useState<"all" | "today" | "week" | "month">("all");

  useEffect(() => { loadEnquiries(); }, []);
  useEffect(() => { applyFilters(); }, [enquiries, searchQuery, statusFilter, typeFilter, dateFilter]);

  const loadEnquiries = async () => {
    try {
      setLoading(true);
      const data = await fetchEnquiries();
      setEnquiries(data.enquiries || []);
      setSelectedEnquiry(data.enquiries?.[0] || null);
      setLoading(false);
    } catch (err: any) {
      setError(err.message || "Unknown error");
      setLoading(false);
    }
  };

  const applyFilters = () => {
    let filtered = [...enquiries];

    if (searchQuery) {
      filtered = filtered.filter((e) =>
        e.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        e.email.toLowerCase().includes(searchQuery.toLowerCase()) ||
        e.mobileNo?.includes(searchQuery) ||
        e.productCode?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        e.productName?.toLowerCase().includes(searchQuery.toLowerCase())
      );
    }

    if (statusFilter !== "all") filtered = filtered.filter((e) => e.status === statusFilter);
    if (typeFilter !== "all") filtered = filtered.filter((e) => e.enquiryType === typeFilter);

    if (dateFilter !== "all") {
      const now = new Date();
      filtered = filtered.filter((e) => {
        const diffDays = (now.getTime() - new Date(e.createdAt).getTime()) / (1000 * 60 * 60 * 24);
        if (dateFilter === "today") return diffDays < 1;
        if (dateFilter === "week") return diffDays < 7;
        if (dateFilter === "month") return diffDays < 30;
        return true;
      });
    }

    setFilteredEnquiries(filtered);
  };

  const handleMarkResolved = async (id: number) => {
    try {
      await markEnquiryResolved(String(id));
      setEnquiries((prev) => prev.map((e) => (e.id === id ? { ...e, status: "resolved" } : e)));
